name: Android APK

on:
  workflow_dispatch:
    inputs:
      release:
        description: Release tag to attach the APK to
        default: v3
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Bundle the prototype into the app
        run: |
          mkdir -p android/app/src/main/assets/www
          cp index.html android/app/src/main/assets/www/
          cp -r img android/app/src/main/assets/www/

      - name: Signing key
        env:
          KS: ${{ secrets.CC_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            echo "$KS" | base64 -d > "$RUNNER_TEMP/cc.jks"
            echo "CC_KEYSTORE=$RUNNER_TEMP/cc.jks" >> "$GITHUB_ENV"
          fi

      - name: Build
        working-directory: android
        env:
          CC_KEYSTORE_PASSWORD: ${{ secrets.CC_KEYSTORE_PASSWORD }}
        run: gradle --no-daemon assembleRelease

      - name: Name the APK
        run: |
          TAG="${{ github.event.inputs.release || github.ref_name }}"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          cp android/app/build/outputs/apk/release/app-release.apk "CampusConnect-$TAG.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: CampusConnect-apk
          path: CampusConnect-*.apk

      - name: Attach to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "CampusConnect-$TAG.apk" --clobber
