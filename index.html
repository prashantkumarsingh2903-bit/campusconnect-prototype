  <div class="stack"><span class="lbl">How could you help?</span><div class="row">${SKILLS.slice(0,10).map(s=>`<button class="chip ${S.prof.skills.has(s)?'on':''}" data-a="skill" data-v="${s}" data-keep="jr1">${s}</button>`).join('')}</div></div>
  <div class="stack"><span class="lbl">Time you can give</span><div class="row">${['< 2 h','2–4 h','4+ h'].map(v=>`<button class="chip ${S.jtime===v?'on':''}" data-a="jtime" data-v="${v}" data-keep="jr1">${ic('clock')}${v} / week</button>`).join('')}</div></div>`,
  foot:`<button class="btn primary" data-a="sendJoin" data-id="${id}">${ic('send')} Send request</button>`};
};

SCR.event=({id})=>{
  const e=ev(id),c=ec(e),m=S.regs[id],l=left(e),saved=S.saved.has(id),d=dp(e);
  let foot,reg='';
  if(e.reg==='required'){
    const mine=m&&m.status==='confirmed';
    reg=e.cap<=40?`<div class="card" style="--c:${c.c}"><div class="sec"><span><span class="big">${l}</span> <span class="meta">seats left of ${e.cap}</span></span>${e.wl?`<span class="pill warn">${e.wl} waiting</span>`:''}</div>
      <div class="seats">${Array.from({length:e.cap},(_,i)=>`<i class="${i<e.taken?(mine&&i===e.taken-1?'me':'t'):''}"></i>`).join('')}</div><span class="meta">${ic('clock','')} Closes ${e.deadline}</span></div>`
    :`<div class="card" style="--c:${c.c}"><div class="sec"><span><span class="big">${l}</span> <span class="meta">seats left of ${e.cap}</span></span></div><div class="bar"><i style="width:${Math.round(e.taken/e.cap*100)}%"></i></div><span class="meta">Closes ${e.deadline}</span></div>`;
  }
  const sv=`<button class="btn icon" data-a="save" data-id="${id}" aria-label="${saved?'Saved':'Save'}" style="${saved?'color:var(--accent-text);border-color:var(--accent)':''}">${ic('bookmark')}</button>`;
  if(e.cancelled) foot=`<button class="btn primary" data-a="root" data-v="home">Find other events</button>`;
  else if(S.attended.has(id)) foot=`<button class="btn primary" data-go="attended" data-id="${id}">${ic('check')} You checked in</button>`;
  else if(m&&m.status==='confirmed') foot=`<button class="btn" data-go="pass" data-id="${id}">${ic('check')} Going</button><button class="btn primary" data-a="checkin" data-id="${id}">${ic('pin')} I'm here</button>`;
  else if(m&&m.status==='waitlisted') foot=`<button class="btn" data-a="leaveWait" data-id="${id}">Leave</button><button class="btn warn" disabled>Waitlist #${m.pos}</button>`;
  else if(m&&m.status==='offer') foot=`<button class="btn primary" data-go="offer" data-id="${id}">Claim your seat</button>`;
  else if(e.reg==='none') foot=`<button class="btn ${saved?'':'primary'}" data-a="save" data-id="${id}">${ic('bell')} ${saved?'Reminder on':'Remind me'}</button>`;
  else if(e.reg==='apply') foot=`${sv}<button class="btn primary" data-go="membership" data-id="${e.club}">Audition</button>`;
  else if(l<=0) foot=`${sv}<button class="btn warn" data-go="full" data-id="${id}">Join waitlist</button>`;
  else foot=`${sv}<button class="btn primary" data-a="register" data-id="${id}">Register · Free</button>`;
  return {bleed:true,
  body:`${hero(c,`<span class="pill acc">${e.type}</span>${e.beginner?'<span class="pill ok">Beginner friendly</span>':''}`,esc(e.title),`<span class="dbadge" style="top:12px;left:auto;right:12px"><b>${d.num}</b><small>${d.mon}</small></span>`,e.img)}
  ${e.cancelled?`<div class="banner bad">${ic('alert')}<span class="grow">Cancelled by organizer<span>${esc(e.reason)}</span></span></div>`:''}
  ${e.changed&&!e.cancelled?`<button class="banner warn" data-go="updates" data-id="${id}">${ic('pin')}<span class="grow">New meeting point<span>${esc(e.venue)}</span></span>${ic('chev')}</button>`:''}
  <button class="li" data-go="club" data-id="${c.id}">${cover(c,'',``,'width:40px;height:40px;border-radius:12px')}<span class="grow"><b>${esc(c.name)}</b><span class="meta">Host</span></span>${ic('chev')}</button>
  <div class="facts"><div class="fact">${ic('cal')}<b>${d.dow} ${d.num} ${d.mon}</b><span>Date</span></div><div class="fact">${ic('clock')}<b>${e.time}</b><span>Time</span></div><div class="fact">${ic('pin')}<b>${esc(e.venue)}</b><span>Place</span></div><div class="fact">${ic('ticket')}<b>Free</b><span>${e.reg==='none'?'Walk in':'No membership'}</span></div></div>
  <div class="stack"><div class="sec"><b>How it goes</b></div><div class="steps">${e.flow.map((s,i)=>`<div class="step done"><i>${i+1}</i>${esc(s)}</div>`).join('')}</div></div>
  <div class="stack"><div class="sec"><b>Good to know</b></div><div class="icchips">${e.who.map(w=>`<span>${ic('users')}${esc(w)}</span>`).join('')}${e.bring.map(b=>`<span>${ic('bag')}${esc(b)}</span>`).join('')}</div></div>
  ${reg}`,foot};
};

/* auth */
SCR.signin=()=>({top:`${backBtn}${S.onb?prog(1):'<h1></h1>'}`,
  body:`${scene('idcard',S.onb?'Verify with your IITG email':'Sign in with your IITG ID')}${S.onb?`<span class="pill ${S.role==='member'?'warn':'acc'}" style="align-self:flex-start">${ic(S.role==='member'?'users':'spark')} ${S.role==='member'?'Joining as a club member':'Joining as an explorer'}</span>`:''}${!S.onb&&S.intent&&S.intent.label!=='sign in'?`<span class="pill acc" style="align-self:flex-start">${ic('arrow')} ${esc(S.intent.label)}</span>`:''}
  ${RECENT.length&&!S.otherEmail?`<div class="stack"><span class="lbl">Continue as</span>${RECENT.map(r=>`<div class="acct"><button class="li" style="padding:0;flex:1;min-width:0" data-a="useEmail" data-v="${esc(r.email)}">${av(r.name,44)}<span class="grow"><b style="font-size:15px">${esc(r.name)}</b><span class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(r.email)}</span></span>${ic('chev')}</button><button class="ib" data-a="forgetEmail" data-v="${esc(r.email)}" aria-label="Remove ${esc(r.email)} from this device">${ic('x')}</button></div>`).join('')}
    <button class="link" style="align-self:flex-start;padding:4px 0" data-a="otherEmail">${ic('plus')} Use another email</button><span class="meta">${ic('lock')} Saved on this device only</span></div>`
  :`<div class="stack"><input class="input" id="email" type="email" inputmode="email" placeholder="name@iitg.ac.in" value="${esc(S.email)}" autocomplete="email" aria-label="IITG email">${S.emailErr?`<span class="err">${S.emailErr}</span>`:''}${RECENT.length?`<button class="link" style="align-self:flex-start;padding:4px 0" data-a="otherEmail">Back to saved accounts</button>`:''}</div>`}`,
  foot:`${S.onb?'':'<button class="btn" data-a="cancelAuth">Later</button>'}${RECENT.length&&!S.otherEmail?'':'<button class="btn primary" data-a="sendCode">Send code</button>'}`});
SCR.otp=()=>({top:`${backBtn}${S.onb?prog(1):'<h1></h1>'}`,
  body:`<div class="center" style="padding-top:12px"><span class="bub" style="background:var(--accent);color:var(--accent-ink)">${ic('mail')}</span><h2 class="h2">Enter the code</h2><span class="meta">Sent to ${esc(S.email)}</span></div>
  <div class="otpwrap"><div class="otp" id="otpv">${otpBoxes()}</div><input id="otp" inputmode="numeric" maxlength="6" autocomplete="one-time-code" aria-label="6-digit code" value="${esc(S.otp)}"></div>
  ${S.otpErr?`<span class="err">${S.otpErr}</span>`:''}<span class="meta" style="text-align:center">Prototype: any 6 digits</span>`,
  foot:`<button class="btn primary" data-a="verify">Verify</button>`});
const cinBoxes=()=>{const c=S.sheet?.code||'';return Array.from({length:4},(_,i)=>`<span class="${i===c.length?'f':''}">${c[i]||''}</span>`).join('')};
const otpBoxes=()=>Array.from({length:6},(_,i)=>`<span class="${i===S.otp.length?'f':''}">${S.otp[i]||''}</span>`).join('');
SCR.profile_verify=()=>{const u=S.user;
  return {top:S.onb?prog(2):`<h1></h1>`,
  body:`<div class="center" style="padding-top:8px"><span class="av" style="width:84px;height:84px;font-size:30px;background:var(--accent);color:var(--accent-ink);border:0">${initials(u.name)}</span><h2 class="h2">Is this you?</h2><span class="pill ok">${ic('shield')} From IITG records</span></div>
  <div class="facts"><div class="fact">${ic('user')}<b>${esc(u.name)}</b><span>Name</span></div><div class="fact">${ic('ticket')}<b>${esc(u.roll)}</b><span>Roll no.</span></div><div class="fact">${ic('star')}<b>${esc(u.prog)}</b><span>Programme</span></div><div class="fact">${ic('home')}<b>${esc(u.hostel)}</b><span>Hostel</span></div></div>`,
  foot:`<button class="btn" data-go="fixdetails">Something's wrong</button><button class="btn primary" data-a="confirmProfile">Yes, that's me</button>`};
};
SCR.nofetch=()=>({top:S.onb?prog(2):`<h1></h1>`,
  body:`<div class="center" style="padding-top:12px">${spot('map',150)}<h2 class="h2">We couldn't find your record</h2><span class="meta">This can happen for new admissions or a recent hostel change.</span></div>
  <div class="proj"><b>${esc(S.email)}</b><span class="meta">Email verified. Only the profile lookup failed.</span></div>`,
  foot:`<button class="btn" data-a="retryFetch">Try again</button><button class="btn primary" data-a="manualFix">Enter details</button>`});
SCR.fixdetails=({manual})=>{const u=S.user,v=k=>manual&&!S.fixKeep?'':esc(u[k]||'');
  return {top:`${backBtn}${S.onb?prog(2):'<h1></h1>'}`,
  body:`<h2 class="h2">${manual?'Add your details':'Fix your details'}</h2>
  <div class="stack"><label class="lbl" for="fx1">Full name</label><input class="input" id="fx1" value="${v('name')}" placeholder="As in IITG records" autocomplete="name"></div>
  <div class="stack"><label class="lbl" for="fx2">Roll number</label><input class="input" id="fx2" value="${v('roll')}" inputmode="numeric" maxlength="9" placeholder="9 digits"></div>
  <div class="stack"><label class="lbl" for="fx3">Programme and year</label><input class="input" id="fx3" value="${v('prog')}" placeholder="e.g. B.Tech CSE · Y1"></div>
  <div class="stack"><label class="lbl" for="fx4">Hostel</label><input class="input" id="fx4" value="${v('hostel')}" placeholder="e.g. Brahmaputra"></div>
  <span class="err" id="fxe" hidden></span>
  <div class="banner acc">${ic('shield')}<span class="grow">We'll check this with IITG records<span>Usually within 2 days. You can use the app meanwhile.</span></span></div>`,
  foot:`<button class="btn primary" data-a="saveFix">Save and continue</button>`};
};

/* registration */
/* plan card: the event and what to do there (no tickets, no badges) */
function ticket(e,ref,extra=''){const c=ec(e),d=dp(e),got=S.attended.has(e.id);
  return `<div class="ticket">${evCover(e)}<div class="thead"><span class="meta">${esc(c.name)}</span><b>${esc(e.title)}</b></div>
  <div class="tbody"><div class="stack" style="gap:6px"><span class="tmeta">${ic('cal')}<b style="color:var(--ink)">${d.dow} ${d.num} ${d.mon}</b> · ${e.time}</span><span class="tmeta">${ic('pin')}${esc(e.venue)}</span>${extra}</div>
  ${got?`<span class="pill ok">${ic('check')} Checked in</span>`:''}</div></div>`}
function collect(id){const e=ev(id);S.attended.add(id);const s=S.stamps[e.club]||(S.stamps[e.club]={n:0});s.n++}
const stampCount=()=>S.attended.size;

/* Activity: what needs doing first, then everything else in plain sight (no sub-tabs) */
function actCard(thumb,title,sub,btn,tone=''){
  const [label,kind,target,id]=btn||[];
  const b=btn?`<button class="btn sm ${tone==='warn'?'warn':'primary'}" ${kind==='go'?`data-go="${target}"`:`data-a="${target}"`} data-id="${id}">${label}</button>`:'';
  return `<div class="act ${tone}">${thumb}<span class="grow"><b>${title}</b><span class="meta">${sub}</span></span>${b}</div>`}
SCR.activity=()=>{
  if(!S.signedIn) return {top:`${backBtn}<h1>My plans</h1>`,body:`<div class="empty">${spot('map')}<b>Your plans, applications and saved events live here</b><button class="btn sm primary" data-a="signinOnly">Sign in</button></div>`};
  const regs=Object.entries(S.regs).map(([id,m])=>({id,e:ev(id),m})).filter(x=>!x.e.cancelled&&x.m.status!=='cancelled').sort((a,b)=>a.e.sort-b.e.sort);
  const todo=[];
  regs.filter(x=>x.m.status==='offer').forEach(x=>todo.push(actCard(evCover(x.e,'thumb'),'A seat opened: '+esc(x.e.title),'Accept by '+x.m.expires,['Accept','go','offer',x.id],'warn')));
  const nx=regs.find(x=>x.m.status==='confirmed'&&!S.attended.has(x.id));
  if(nx){const d=dp(nx.e);todo.push(actCard(evCover(nx.e,'thumb'),'Next: '+esc(nx.e.title),`${d.dow} ${d.num} ${d.mon} · ${nx.e.time} · ${esc(nx.e.venue)}`,["I'm here",'a','checkin',nx.id]))}
  [...S.attended].filter(id=>!S.feedback.has(id)).forEach(id=>todo.push(actCard(evCover(ev(id),'thumb'),'How was '+esc(ev(id).title)+'?','30-second feedback for the organizers',['Rate','go','feedback',id])));
  [...S.saved].map(ev).filter(e=>!e.cancelled&&e.reg==='required'&&!S.regs[e.id]&&left(e)>0).forEach(e=>todo.push(actCard(evCover(e,'thumb'),esc(e.title),'Saved · registration closes '+e.deadline,['Register','a','register',e.id])));
  [...S.followed].map(club).filter(c=>c.recruit.open&&!S.apps[c.id]).forEach(c=>todo.push(actCard(cover(c,'thumb'),esc(c.name)+' is recruiting','Apply by '+c.recruit.deadline,['Apply','go','membership',c.id])));
  Object.keys(S.roomReq).forEach(id=>todo.push(actCard(cover(club(id),'thumb'),esc(club(id).name)+' room','Waiting for moderators to approve you')));
  const apps=Object.entries(S.apps);
  const going=regs.filter(x=>x.m.status==='confirmed'||x.m.status==='waitlisted');
  return {top:`${backBtn}<h1>My plans</h1>`,
  body:`<div class="stack"><div class="sec"><b>Needs your action</b>${todo.length?`<span class="pill warn">${todo.length}</span>`:''}</div>
    ${todo.length?todo.join(''):`<div class="act">${spot('green',52)}<span class="grow"><b>You're all set</b><span class="meta">Nothing waiting on you right now</span></span><button class="btn sm" data-a="root" data-v="home">Explore</button></div>`}</div>
  <div class="stack"><div class="sec"><b>Going</b><span class="meta">${going.length}</span></div>
    ${going.length?going.map(x=>erow(x.e)).join(''):`<span class="meta">No events yet. <button class="link" data-a="homeTab" data-v="events" data-root="1">Find one</button></span>`}</div>
  <div class="stack"><div class="sec"><b>Applications and requests</b><span class="meta">${apps.length}</span></div>
    ${apps.length?apps.map(([id,a])=>{const c=club(id);return `<button class="li" data-go="club" data-id="${id}">${cover(c,'',``,'width:44px;height:44px;border-radius:12px')}<span class="grow"><b style="font-size:14.5px">${esc(c.name)}</b><span class="meta">${a.type==='request'?'Member request':'Core team application'} · sent ${a.date}</span></span><span class="pill warn">${esc(a.status.split(' ').slice(0,3).join(' '))}</span></button>`}).join(''):`<span class="meta">Clubs that are recruiting show “Apply to join” on their page.</span>`}</div>
  <div class="stack"><div class="sec"><b>Saved</b><span class="meta">${S.saved.size}</span></div>
    ${S.saved.size?[...S.saved].map(id=>erow(ev(id))).join(''):`<span class="meta">Tap the bookmark on an event to keep it here.</span>`}</div>`};
};
SCR.confirm=({id})=>{const e=ev(id);return {top:`${backBtn}<h1>Confirm</h1>`,
  body:`${ticket(e,'—',`<span class="tmeta">${ic('user')}${esc(S.user.name)}</span>`)}
  <div class="toggles">${tg('alert','Venue & time changes',true,'noop')}${tg('bell','Remind me the evening before',S.remind,'toggleRemind')}</div>
  <textarea class="input" id="access" placeholder="Anything the organizer should know? (optional)" aria-label="Note for organizer"></textarea>`,
  foot:`<button class="btn primary" data-a="confirmReg" data-id="${id}">Confirm seat</button>`};};
SCR.registered=({id})=>{const e=ev(id),m=S.regs[id];return {top:`<span style="flex:1"></span><button class="ib" data-a="root" data-v="home" aria-label="Close">${ic('x')}</button>`,
  body:`<div class="center"><span class="okbig">${ic('check')}</span><h2 class="h2">You're going!</h2></div>${ticket(e,m.ref)}
  <div class="row meta" style="justify-content:center">${ic('spark')} At the event, tap “I'm here” to check in</div>`,
  foot:`<button class="btn" data-go="activity">My activity</button><button class="btn primary" data-a="cal">${ic('cal')} Add to calendar</button>`};};
SCR.pass=({id})=>{const e=ev(id),m=S.regs[id];if(!m)return SCR.event({id});return {top:`${backBtn}<h1>Your plan</h1>`,
  body:`${e.cancelled?`<div class="banner bad">${ic('alert')}<span class="grow">Cancelled by organizer<span>${esc(e.reason)}</span></span></div>`:''}
  ${e.changed&&!e.cancelled?`<button class="banner warn" data-go="updates" data-id="${id}">${ic('pin')}<span class="grow">Meeting point changed<span>Now: ${esc(e.venue)}</span></span>${ic('chev')}</button>`:''}
  ${ticket(e,m.ref,`<span class="tmeta">${ic('user')}${esc(S.user.name)}</span>`)}
  ${S.attended.has(id)?'':`<div class="row" style="justify-content:space-between"><button class="link" data-a="cal">${ic('cal')} Add to calendar</button><button class="link" style="color:var(--danger)" data-go="cancelReg" data-id="${id}">Can't go</button></div>`}`,
  foot:e.cancelled?`<button class="btn primary" data-a="root" data-v="home">Find other events</button>`:S.attended.has(id)?`<button class="btn primary" data-go="activity">See my journey</button>`:`<button class="btn primary" data-a="checkin" data-id="${id}">${ic('pin')} I'm here · check in</button>`};};
SCR.cancelReg=({id})=>{const e=ev(id),c=ec(e);return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center">${cover(c,'',``,'width:96px;height:96px;border-radius:28px')}<h2 class="h2">Give up your seat?</h2><span class="meta">${esc(e.title)}</span></div>
  <div class="facts"><div class="fact">${ic('ticket')}<b>Seat released</b><span>Instantly</span></div><div class="fact">${ic('users')}<b>${e.wl?'Next in line':'Open to others'}</b><span>${e.wl?'Gets offered it':'Anyone can book'}</span></div></div>
  <textarea class="input" id="why" placeholder="Reason (optional)" aria-label="Reason"></textarea>`,
  foot:`<button class="btn" data-a="back">Keep it</button><button class="btn danger" data-a="doCancel" data-id="${id}">Cancel seat</button>`};};
SCR.full=({id})=>{const e=ev(id),c=ec(e);return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center"><span class="big">0</span><span class="meta">seats left · ${e.wl} waiting</span></div>
  <div class="card" style="--c:${c.c}"><div class="seats">${Array.from({length:e.cap},()=>'<i class="t"></i>').join('')}</div></div>
  <div class="steps"><div class="step done"><i>1</i>Join waitlist</div><div class="step"><i>2</i>Seat opens</div><div class="step"><i>3</i>Accept in time</div></div>
  ${(()=>{const sim=S.ev.filter(x=>x.id!==id&&!x.cancelled&&x.reg==='required'&&left(x)>0&&ec(x).board===c.board).slice(0,4);return sim.length?`<div class="stack"><div class="sec"><b>Open instead</b></div><div class="hs">${sim.map(poster).join('')}</div></div>`:''})()}`,
  foot:`<button class="btn" data-a="back">Not now</button><button class="btn primary" data-a="joinWait" data-id="${id}">Join waitlist · #${e.wl+1}</button>`};};
SCR.offer=({id})=>{const e=ev(id),m=S.regs[id];return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center"><span class="okbig" style="background:var(--warm-soft);color:var(--warm)">${ic('ticket')}</span><h2 class="h2">A seat opened up!</h2><span class="pill warn">${ic('clock')} Accept by ${m.expires}</span></div>${ticket(e,'OFFER')}`,
  foot:`<button class="btn" data-a="declineOffer" data-id="${id}">Pass</button><button class="btn primary" data-a="acceptOffer" data-id="${id}">Take the seat</button>`};};
SCR.regfail=({id})=>{const e=ev(id);return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center" style="padding-top:20px"><span class="okbig" style="background:var(--danger-soft);color:var(--danger)">${ic('alert')}</span><h2 class="h2">Connection dropped</h2><span class="meta">We'll check if your seat went through. No double booking.</span></div>${erow(e)}`,
  foot:`<button class="btn" data-a="back">Back</button><button class="btn primary" data-a="retryReg" data-id="${id}">Check & retry</button>`};};
SCR.updates=({id})=>{const e=ev(id),c=ec(e);return {top:`${backBtn}<h1>Update</h1>`,
  body:`<div class="row">${av(c.contact,40)}<span class="grow"><b>${esc(c.contact)}</b><span class="meta">${esc(c.name)} · today 4:30 PM</span></span><span class="pill ok">${ic('shield')}</span></div>
  <div class="card"><div class="lbl">Meeting point</div><div class="row" style="flex-wrap:nowrap;gap:10px"><div class="fact" style="flex:1;background:var(--surface);opacity:.6">${ic('pin')}<b style="text-decoration:line-through">${esc(e.prevVenue)}</b><span>Before</span></div>${ic('arrow')}<div class="fact" style="flex:1;background:var(--surface);box-shadow:0 0 0 2px var(--accent)">${ic('pin')}<b>${esc(e.venue)}</b><span>Now</span></div></div><span class="meta">Sheltered in case of rain.</span></div>
  <div class="icchips"><span>${ic('cal')}Same day</span><span>${ic('clock')}Same time</span></div>`,
  foot:S.regs[id]?.status==='confirmed'?`<button class="btn primary" data-a="repl" data-v="pass" data-id="${id}">${ic('check')} See your plan</button>`:`<button class="btn primary" data-a="back">Got it</button>`};};
SCR.attended=({id})=>{const e=ev(id),c=ec(e),nx=S.ev.filter(x=>x.club!==e.club&&!x.cancelled&&x.reg==='required'&&left(x)>0).slice(0,4);return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center"><span class="okbig">${ic('check')}</span><h2 class="h2">You're checked in</h2><span class="meta">${esc(e.title)}</span></div>
  <div class="join2"><button class="jt" data-a="follow" data-id="${c.id}"><span class="ji">${ic('heart')}</span><b>${S.followed.has(c.id)?'Following':'Follow club'}</b><span>${esc(c.name)}</span></button>${c.recruit.open?`<button class="jt hot" data-go="membership" data-id="${c.id}"><span class="ji">${ic('star')}</span><b>Core team</b><span>Apply by ${c.recruit.deadline}</span></button>`:`<button class="jt" data-a="openRoom" data-id="${c.id}"><span class="ji">${ic('chat')}</span><b>Club room</b><span>Say hi</span></button>`}</div>
  ${nx.length?`<div class="stack"><div class="sec"><b>Try next</b></div><div class="hs">${nx.map(poster).join('')}</div></div>`:''}`,
  foot:S.feedback.has(id)?`<button class="btn" disabled>${ic('check')} Rated · thanks</button>`:`<button class="btn primary" data-go="feedback" data-id="${id}">Rate it</button>`};};
SCR.feedback=({id})=>{const e=ev(id),fb=S.fb||{};const faces=['Meh','Okay','Good','Great','Loved it'];return {top:`${backBtn}<h1></h1>`,
  body:`<h2 class="h2">How did it feel?</h2>
  <div class="steps">${faces.map((f,i)=>`<button class="step ${fb.w===i+1?'now':''}" data-a="fbWel" data-v="${i+1}"><i style="width:48px;height:48px;font-size:18px">${i+1}</i>${f}</button>`).join('')}</div>
  <div class="stack"><span class="lbl">Matched the event page?</span><div class="row">${['Yes','Partly','No'].map(v=>`<button class="chip ${fb.m===v?'on':''}" data-a="fbMatch" data-v="${v}">${v}</button>`).join('')}</div></div>
  <textarea class="input" id="fbt" placeholder="One thing to improve (optional)" aria-label="Improvement"></textarea>
  <span class="meta">${ic('lock')} Only the organizers see this</span>`,
  foot:`<button class="btn primary" data-a="sendFb" data-id="${id}" ${fb.w?'':'disabled'}>Send</button>`};};

/* membership */
SCR.membership=({id})=>{const c=club(id),r=c.recruit,app=S.apps[id];return {bleed:true,
  body:`${hero(c,`<span class="pill warn">Recruiting</span>`,`Join the ${esc(c.name)} team`)}
  <div class="stats"><div class="stat">${ic('cal')}<b>${r.deadline.split(' ').slice(1).join(' ')}</b><span>Apply by</span></div><div class="stat">${ic('star')}<b>${r.result.split(' ').slice(1).join(' ')}</b><span>Results</span></div><div class="stat">${ic('clock')}<b>${c.hours}</b><span>per week</span></div></div>
  <div class="stack"><div class="sec"><b>Selection</b></div><div class="steps">${r.steps.map((s,i)=>`<div class="step ${app?'done':''}"><i>${i+1}</i>${esc(s)}</div>`).join('')}</div></div>
  <div class="icchips"><span>${ic('users')}All years</span><span>${ic('smile')}${c.beginner?'Beginners welcome':'Experience helps'}</span><span>${ic('ticket')}No fee</span></div>`,
  foot:app?`<button class="btn primary" data-go="activity">Track application</button>`:`<button class="btn primary" data-a="startApp" data-id="${id}">Apply</button>`};};
SCR.apply=({id})=>{const c=club(id);return {top:`${backBtn}<h1>${esc(c.name)}</h1>`,
  body:`<div class="steps"><div class="step now"><i>1</i>Form</div>${c.recruit.steps.slice(1).map((s,i)=>`<div class="step"><i>${i+2}</i>${esc(s)}</div>`).join('')}</div>
  <div class="stack"><label class="lbl" for="a1">Why join?</label><textarea class="input" id="a1" placeholder="A few lines"></textarea><span class="err" id="a1e" hidden>Write a line or two first.</span></div>
  <div class="stack"><label class="lbl" for="a2">Experience</label><div class="row">${['None yet','A little','Lots'].map(v=>`<button class="chip ${S.exp===v?'on':''}" data-a="exp" data-v="${v}">${v}</button>`).join('')}</div></div>
  <div class="stack"><label class="lbl" for="a3">Link to your work <span class="meta">(optional)</span></label><input class="input" id="a3" placeholder="Drive, GitHub, Instagram"></div>`,
  foot:`<button class="btn" data-a="draft">Save draft</button><button class="btn primary" data-a="submitApp" data-id="${id}">Submit</button>`};};

SCR.room=({id,team})=>{
  const key=team?'T:'+id:id,c=club(id),ms=S.msgs[key]||(S.msgs[key]=[]),joined=team||S.rooms.has(id),pin=ms.find(m=>m.pinned),pend=S.roomReq[id];
  if(team) return {top:`${backBtn}${cover(c,'',``,'width:38px;height:38px;border-radius:12px')}<span class="grow"><b>${esc(c.name)} team</b><span class="meta" style="font-size:12px">${ic('lock')} Members only</span></span>`,
  body:`${pin?`<div class="pinned">${ic('pin')}<span>${esc(pin.text)}</span></div>`:''}${msgList(ms,key)}`,
  composer:`<input class="input" id="chat" placeholder="Message the team" autocomplete="off" aria-label="Message"><button class="btn primary" data-a="send" data-id="${key}" aria-label="Send">${ic('send')}</button>`};
  if(!joined) return {bleed:true,
    body:`${hero(c,`<span class="pill">${ic('lock')} Approval needed</span>`,`${esc(c.name)} room`)}
    ${pend?`<div class="banner warn">${ic('clock')}<span class="grow">Request sent<span>Moderators usually reply within a day. We'll notify you.</span></span></div>`
      :`<div class="stack"><label class="lbl" for="rq">Introduce yourself to the moderators</label><textarea class="input" id="rq" placeholder="e.g. First year, love street photography, came to the photo walk"></textarea><span class="err" id="rqe" hidden>Add a line so moderators know who you are.</span></div>`}
    <div class="rules"><div class="rule">${ic('heart')}Be kind</div><div class="rule">${ic('x')}No spam or selling</div><div class="rule">${ic('shield')}Club heads moderate</div><div class="rule">${ic('flag')}Report, privately</div></div>
    ${pin?`<div class="stack"><span class="lbl">Latest announcement</span><div class="pinned">${ic('pin')}<span>${esc(pin.text)}</span></div></div>`:''}`,
    foot:pend?`<button class="btn" data-a="withdrawRoom" data-id="${id}">Withdraw request</button>`:`<button class="btn primary" data-a="reqRoom" data-id="${id}">${ic('send')} Agree to rules and request</button>`};
  return {top:`${backBtn}${cover(c,'',``,'width:38px;height:38px;border-radius:12px')}<span class="grow"><b>${esc(c.name)}</b><span class="meta" style="font-size:12px">${c.members+1} members</span></span><button class="ib" data-a="leaveRoom" data-id="${id}" aria-label="Leave room">${ic('x')}</button>`,
  body:`${pin?`<div class="pinned">${ic('pin')}<span>${esc(pin.text)}</span></div>`:''}${msgList(ms,id)}`,
  composer:`<input class="input" id="chat" placeholder="Message" autocomplete="off" aria-label="Message"><button class="btn primary" data-a="send" data-id="${id}" aria-label="Send">${ic('send')}</button>`};
};

const msgList=(ms,key)=>`<div class="msgs">${ms.filter(m=>!m.pinned).map(m=>{const hid=S.reported.has(key+':'+m.id);
    return `<div class="msg ${m.me?'me':''} ${hid?'hidden':''}">${m.me?'':av(m.who)}<div class="mb">${m.me?'':`<span class="who">${esc(m.who)}${m.role?` <span class="pill acc" style="padding:1px 7px">${m.role}</span>`:''}</span>`}
    <div class="bubble">${hid?'Reported · hidden for you':esc(m.text)}${!m.me&&!hid?`<button class="more" data-a="msgMenu" data-id="${key}" data-v="${m.id}" aria-label="Message options">${ic('more')}</button>`:''}</div></div></div>`}).join('')}</div>`;

/* ---------- onboarding: splash → intro → role → email → OTP → profile → (student) interests → recommendations | (member) your club ---------- */
const prog=n=>`<div class="prog" aria-label="Step ${n} of 4">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}<span>${n}/4</span></div>`;
SCR.splash=()=>({bare:true,body:`<div class="splash"><img class="float" src="img/interests.webp" alt=""><div class="logo">Campus<span>Connect</span></div><p>Find your place at IITG</p><div class="dots"><i></i><i></i><i></i></div></div>`});
const SLIDES=[['circle','Find your people','22 clubs. One place.'],['quiz','Never miss a moment','Events, auditions and deadlines, all here.'],['chat','Talk to your clubs','Chat rooms with members and organizers.']];
SCR.intro=()=>{const [img,t,s]=SLIDES[S.slide],last=S.slide===SLIDES.length-1;
  return {bare:true,body:`<div class="intro"><button class="skip" data-a="toRole">Skip</button><div class="iart"><img src="img/${img}.webp" alt=""></div>
  <div class="itext"><div class="idots">${SLIDES.map((_,i)=>`<button class="${i===S.slide?'on':''}" data-a="slide" data-v="${i}" aria-label="Slide ${i+1}"></button>`).join('')}</div><h2>${t}</h2><p>${s}</p>
  <button class="btn primary" style="width:100%" data-a="${last?'toRole':'nextSlide'}">${last?"Get started":'Next'} ${ic('arrow')}</button></div></div>`};
};
SCR.role=()=>({top:`${backBtn}<h1></h1>`,
  body:`<h2 class="h2">How are you joining?</h2>
  <div class="stack" style="gap:14px">
   <button class="rcard ${S.role==='student'?'on':''}" data-a="pickRole" data-v="student"><img src="img/photo.webp" alt=""><span class="rt"><b>I'm exploring</b><span>Fresher, or not in a club yet</span></span><span class="rchk">${ic('check')}</span><span class="rtags"><span>${ic('search')}Discover</span><span>${ic('ticket')}Join events</span></span></button>
   <button class="rcard ${S.role==='member'?'on':''}" data-a="pickRole" data-v="member"><img src="img/writing.webp" alt=""><span class="rt"><b>I'm a club member</b><span>Plan and update with your team</span></span><span class="rchk">${ic('check')}</span><span class="rtags"><span>${ic('chat')}Team chat</span><span>${ic('edit')}Propose changes</span></span></button>
  </div>
  <button class="link" style="align-self:center;padding:6px" data-a="lookAround">Browse as guest</button>`,
  foot:`<button class="btn primary" data-a="startOnb" ${S.role?'':'disabled'}>Continue</button>`});
SCR.recos=()=>{let recs=recommend();if(!recs.length)recs=[...CLUBS].sort((a,b)=>b.members-a.members).slice(0,6);
  const n=recs.filter(c=>S.followed.has(c.id)).length;
  return {top:`${backBtn}${prog(4)}`,
  body:`<h2 class="h2">Clubs you'll like</h2>
  <div class="grid2">${recs.map(c=>{const f=S.followed.has(c.id);return `<button class="tile" data-a="follow" data-id="${c.id}">${cover(c,'',`<span class="onc ${f?'ok':''} tag" style="top:auto;bottom:8px">${f?ic('check')+' Following':'+ Follow'}</span>`)}<span class="tname" style="-webkit-line-clamp:1">${esc(c.name)}</span><span class="tmeta">${ic('users')}${c.members} · ${c.hours}/wk</span></button>`}).join('')}</div>`,
  foot:`<button class="btn primary" data-a="finishOnb">${n?`Follow ${n} & enter`:'Enter CampusConnect'} ${ic('arrow')}</button>`};
};
SCR.pickclub=()=>({top:`${backBtn}${prog(3)}`,
  body:`<h2 class="h2">Your clubs</h2><span class="pill ok" style="align-self:flex-start">${ic('shield')} Found on club rosters</span>
  <div class="stack" style="gap:12px">${ROSTER.map(([id,role,head])=>{const c=club(id),on=S.pick.has(id);return `<button class="opt ${on?'on':''}" style="padding:10px" data-a="pickTeam" data-v="${id}">${cover(c,'thumb')}<span class="grow"><b>${esc(c.name)}</b><span class="meta">${role} · added by ${head}</span></span><span class="sw ${on?'on':''}"></span></button>`}).join('')}</div>
  <div class="card" style="flex-direction:row;align-items:center">${spot('lamp',64)}<span class="grow"><b>Club missing?</b><span class="meta">Ask its head to add you</span></span><button class="btn sm" data-a="reqAccess">Request</button></div>`,
  foot:`<button class="btn primary" data-a="finishMember" ${S.pick.size?'':'disabled'}>Open team space ${ic('arrow')}</button>`});

/* ---------- club member: team space, proposals ---------- */
const KIND={venue:['pin','Change an event'],new:['cal','New event'],page:['edit','Club page'],recruit:['star','Recruitment']};
const pstat=p=>p.status==='live'?['ok','Live']:p.status==='declined'?['bad','Declined']:['warn','In discussion'];
function ensureMember(){ensureUser();S.role='member';if(!S.teamClubs.length){S.teamClubs=['photo','music'];S.activeClub='photo'}}
SCR.team=()=>{ensureMember();const c=club(S.activeClub),ps=S.props.filter(p=>p.club===c.id),open=ps.filter(p=>p.status==='discussing'),evs=clubEvents(c.id).filter(e=>!e.cancelled),T=S.msgs['T:'+c.id]||[];
  return {nav:'team',top:`<span class="brand" style="font-size:20px">Team</span>${S.teamClubs.length>1?`<button class="chip" data-a="switchTeam">${esc(c.name.split(' ')[0])} ${ic('chev')}</button>`:''}`,
  body:`<div class="tmhead">${cover(c,'',`<span class="onc ${S.memberRole==='head'?'warn':''}" style="position:absolute;left:12px;top:12px"><i></i>${S.memberRole==='head'?'Club head':'Member'}</span>`)}<div><b>${esc(c.name)}</b><span class="meta">${c.members} followers · ${evs.length} upcoming</span></div></div>
  <div class="stack"><div class="sec"><b>Propose a change</b></div><div class="ktiles">${Object.entries(KIND).map(([k,[i,l]])=>`<button class="kt" data-a="newProp" data-v="${k}"><span class="ji">${ic(i)}</span>${l}</button>`).join('')}</div></div>
  <div class="stack"><div class="sec"><b>Proposals</b>${open.length?`<span class="pill warn">${open.length} open</span>`:''}</div>${ps.map(propRow).join('')}</div>
  <button class="card" style="flex-direction:row;align-items:center" data-a="teamChat"><span class="ji" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#F45B4F;color:#fff">${ic('lock')}</span><span class="grow"><b>Team chat</b><span class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${T.length?esc(T[T.length-1].who.split(' ')[0])+': '+esc(T[T.length-1].text):'Members only'}</span></span><span class="avs">${[...new Set(T.map(m=>m.who))].slice(0,3).map(p=>av(p,26)).join('')}</span></button>
  ${evs.length?`<div class="stack"><div class="sec"><b>Our events</b></div><div class="hs">${evs.map(poster).join('')}</div></div>`:''}`};
};
function propRow(p){const [k,t]=pstat(p),[i]=KIND[p.kind];
  return `<button class="prow" data-go="proposal" data-id="${p.id}"><span class="ji">${ic(i)}</span><span class="grow"><b>${esc(p.title)}</b><span class="tmeta">${av(p.by,20)} ${esc(p.by.split(' ')[0])} · ${p.t}</span></span><span class="stack" style="gap:4px;align-items:flex-end"><span class="pill ${k}">${t}</span><span class="tmeta">${ic('check')}${p.up} ${ic('chat')}${p.comments.length}</span></span></button>`}
SCR.proposal=({id})=>{const p=S.props.find(x=>x.id===id),c=club(p.club),[k,t]=pstat(p),[i,l]=KIND[p.kind],v=S.voted[id],head=S.memberRole==='head';
  const stg=p.status==='live'?4:p.status==='declined'?3:2;
  return {top:`${backBtn}<h1>Proposal</h1>`,
  body:`<div class="row" style="flex-wrap:nowrap;gap:12px"><span class="ji big">${ic(i)}</span><span class="grow"><span class="meta">${l} · ${esc(c.name)}</span><b style="font-family:var(--display);font-size:22px;line-height:1.1">${esc(p.title)}</b></span></div>
  <div class="row"><span class="pill ${k}">${t}</span><span class="tmeta">${av(p.by,22)} ${esc(p.by)} · ${p.t}</span></div>
  <div class="card">${p.before?`<div class="row" style="flex-wrap:nowrap;gap:10px"><div class="fact" style="flex:1;background:var(--surface);opacity:.65"><b style="text-decoration:line-through;font-size:14px">${esc(p.before)}</b><span>Now</span></div>${ic('arrow')}<div class="fact" style="flex:1;background:var(--surface);box-shadow:0 0 0 2px var(--accent)"><b style="font-size:14px">${esc(p.after)}</b><span>Proposed</span></div></div>`
    :`<div class="fact" style="background:var(--surface);box-shadow:0 0 0 2px var(--accent)">${ic(i)}<b>${esc(p.after)}</b><span>New</span></div>`}<span class="meta">${esc(p.reason)}</span></div>
  <div class="steps"><div class="step done"><i>1</i>Proposed</div><div class="step ${stg>2?'done':'now'}"><i>2</i>Team talks</div><div class="step ${p.status==='live'?'done':p.status==='declined'?'now':''}"><i>3</i>Head ${p.status==='declined'?'declined':'approves'}</div><div class="step ${p.status==='live'?'done':''}"><i>4</i>Live</div></div>
  ${p.status==='discussing'?`<div class="join2"><button class="jt ${v==='up'?'hot':''}" data-a="vote" data-id="${id}" data-v="up"><span class="ji">${ic('check')}</span><b>${p.up}</b><span>Looks good</span></button><button class="jt ${v==='down'?'hot':''}" data-a="vote" data-id="${id}" data-v="down"><span class="ji">${ic('alert')}</span><b>${p.down}</b><span>Needs work</span></button></div>`:''}
  <div class="stack"><div class="sec"><b>Discussion</b><span class="meta">${p.comments.length}</span></div>${p.comments.length?msgList(p.comments.map((m,j)=>({id:j,...m})),'P:'+id):'<span class="meta">No comments yet. Start the conversation.</span>'}</div>
  ${p.status==='discussing'&&!head?`<div class="banner acc">${ic('shield')}<span class="grow">Waiting for the club head<span>${esc(ROSTER.find(r=>r[0]===c.id)?.[2]||'Club head')} publishes once the team agrees</span></span></div>`:''}`,
  composer:p.status==='discussing'?`<input class="input" id="chat" placeholder="Add to the discussion" autocomplete="off" aria-label="Comment"><button class="btn primary" data-a="comment" data-id="${id}" aria-label="Send">${ic('send')}</button>`:'',
  foot:p.status==='discussing'&&head?`<button class="btn danger" data-a="decide" data-id="${id}" data-v="declined">Decline</button><button class="btn primary" data-a="decide" data-id="${id}" data-v="live">${ic('check')} Approve & publish</button>`:''};
};
SCR.propose=()=>{const c=club(S.activeClub),k=S.pk||'venue',[i,l]=KIND[k],evs=clubEvents(c.id).filter(e=>!e.cancelled);
  let f='';
  if(k==='venue') f=`<div class="stack"><span class="lbl">Which event?</span><div class="hs">${evs.map(e=>`<button class="opt ${S.pevent===e.id?'on':''}" style="width:auto;flex:none" data-a="pEvent" data-v="${e.id}">${evCover(e,'',``,'width:40px;height:40px;border-radius:10px')}<span>${esc(e.title)}</span></button>`).join('')}</div></div>
    <div class="stack"><span class="lbl">What changes?</span><div class="row">${['Venue','Time'].map(x=>`<button class="chip ${S.pfield===x?'on':''}" data-a="pField" data-v="${x}">${ic(x==='Venue'?'pin':'clock')}${x}</button>`).join('')}</div><input class="input" id="pv" placeholder="${S.pfield==='Venue'?'New place, e.g. Library steps':'New time, e.g. 8–10 AM'}"></div>`;
  else if(k==='new') f=`<input class="input" id="pt" placeholder="Event name"><input class="input" id="pv" placeholder="When, e.g. Sat 7 Nov · 5–7 PM"><input class="input" id="pp" placeholder="Where, e.g. Core 1 lab">`;
  else if(k==='page') f=`<textarea class="input" id="pv" placeholder="New club description">${esc(c.short)}</textarea>`;
  else f=`<div class="row">${['Open recruitment','Close recruitment'].map(x=>`<button class="chip ${S.pfield===x?'on':''}" data-a="pField" data-v="${x}">${x}</button>`).join('')}</div><input class="input" id="pv" placeholder="Deadline, e.g. Fri 13 Nov">`;
  return {top:`${backBtn}<h1>New proposal</h1>`,
  body:`<div class="ktiles">${Object.entries(KIND).map(([kk,[ii,ll]])=>`<button class="kt ${kk===k?'on':''}" data-a="newProp" data-v="${kk}" data-stay="1"><span class="ji">${ic(ii)}</span>${ll}</button>`).join('')}</div>
  <div class="stack">${f}<textarea class="input" id="pr" placeholder="Why? One line for your team" style="min-height:70px"></textarea><span class="err" id="perr" hidden>Fill in the details first.</span></div>
  <div class="row meta">${ic('users')} Your team discusses, ${esc(ROSTER.find(r=>r[0]===c.id)?.[2]||'the head')} publishes</div>`,
  foot:`<button class="btn primary" data-a="sendProp">${ic('send')} Send to team</button>`};
};

/* notifications + profile */
SCR.notifs=()=>({top:`${backBtn}<h1>Updates</h1>`,
  body:!S.signedIn?`<div class="empty">${spot('cups')}<b>No updates</b><button class="btn sm primary" data-a="signinOnly">Sign in</button></div>`
   :S.notifs.length?S.notifs.map(n=>`<button class="li" data-a="openNotif" data-v="${n.id}"><span class="bub" style="width:46px;height:46px;background:${n.col||'var(--accent)'}">${ic(n.icon)}</span><span class="grow"><b>${esc(n.title)}</b><span class="meta">${esc(n.text)}</span></span>${n.read?'':'<span class="ib" style="width:10px;height:10px;border-radius:50%;background:var(--danger)"></span>'}</button>`).join('')
   :`<div class="empty">${spot('cups')}<b>All caught up</b></div>`});
/* Profile: about you, not scores. Verified fields stay locked; everything else is yours to edit. */
SCR.profile=()=>{
  if(!S.signedIn) return {nav:'profile',top:`<h1 style="padding-left:6px">Profile</h1>`,body:`${scene('idcard','Browsing as a guest')}<button class="btn primary" data-a="signinOnly">${ic('shield')} Sign in with IITG</button>
    <button class="li" data-go="personalise"><span class="bub" style="width:46px;height:46px;background:var(--accent)">${ic('spark')}</span><span class="grow"><b>Interests</b><span class="meta">${S.interests.size||'None'} picked</span></span>${ic('chev')}</button>`};
  S.pdraft=null;
  const u=S.user,P=S.prof,picks=INTERESTS.filter(x=>S.interests.has(x[1])),fol=[...S.followed].map(club),mine=S.role==='member'?S.teamClubs.map(club):[];
  const links=[['Portfolio',P.links.p],['GitHub',P.links.g],['Instagram',P.links.i]].filter(l=>l[1]);

  ${links.length?`<div class="stack"><div class="sec"><b>Links</b></div>${links.map(([k,v])=>`<div class="proj"><span class="meta">${k}</span><span class="mail">${esc(v)}</span></div>`).join('')}</div>`:''}
  ${mine.length?`<div class="stack"><div class="sec"><b>Member of</b></div>${mine.map(c=>`<button class="li" data-go="club" data-id="${c.id}">${cover(c,'',``,'width:44px;height:44px;border-radius:12px')}<span class="grow"><b style="font-size:14.5px">${esc(c.name)}</b><span class="meta">${S.memberRole==='head'?'Club head':'Member'}</span></span>${ic('chev')}</button>`).join('')}</div>`:''}
  <div class="stack"><div class="sec"><b>Your posts</b><span class="meta">${S.posts.filter(p=>p.me).length}</span></div>${S.posts.filter(p=>p.me).length?S.posts.filter(p=>p.me).map(p=>postCard(p)).join(''):`<button class="pickint" data-a="startPost">${ic('plus')}<span class="grow"><b>Share your first post</b><span>A thought, idea or photo from campus</span></span>${ic('chev')}</button>`}</div>
  <div class="stack"><div class="sec"><b>Clubs I follow</b><span class="meta">${fol.length}</span></div>${fol.length?fol.map(c=>`<button class="li" data-go="club" data-id="${c.id}">${cover(c,'',``,'width:44px;height:44px;border-radius:12px')}<span class="grow"><b style="font-size:14.5px">${esc(c.name)}</b><span class="meta">${c.board}</span></span>${ic('chev')}</button>`).join(''):'<span class="meta">Follow clubs to see their updates</span>'}</div>

  <button class="btn" data-a="signout">Sign out</button>`};
};

const person=n=>PINFO[n]||{bio:'IITG student',head:'',int:[],clubs:[],fol:20,fng:30};
const connState=n=>S.connected.has(n)?'on':S.creq.has(n)?'req':S.inreq.includes(n)?'in':'';
const connBtn=(n,sm=1)=>{const st=connState(n);return st==='on'?`<button class="btn ${sm?'sm':''}" data-a="connect" data-v="${esc(n)}">${ic('check')} Connected</button>`
  :st==='req'?`<button class="btn ${sm?'sm':''}" data-a="connect" data-v="${esc(n)}">${ic('clock')} Requested</button>`
  :st==='in'?`<button class="btn ${sm?'sm':''} primary" data-a="acceptReq" data-v="${esc(n)}">Accept</button>`
  :`<button class="btn ${sm?'sm':''} primary" data-a="connect" data-v="${esc(n)}">Connect</button>`};
const personRow=(n,btn)=>`<div class="li">${`<button class="li" style="padding:0;flex:1;min-width:0" data-go="person" data-id="${esc(n)}">${av(n,44)}<span class="grow"><b style="font-size:14.5px">${esc(n)}</b><span class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${esc(person(n).head||person(n).bio)}</span></span></button>`}${btn??connBtn(n)}</div>`;
const ME_PROFILE=n=>S.signedIn&&n===ME();

/* post card: names open profiles, posts can carry photos and videos */
function postMedia(m){if(!m||!m.length)return '';return `<div class="pmedia n${Math.min(m.length,4)}">${m.slice(0,4).map(x=>x.type==='video'?`<video src="${x.url}" controls playsinline preload="metadata"></video>`:`<img src="${x.url}" alt="">`).join('')}</div>`}
function postCard(p,full){const c=p.club&&club(p.club),liked=S.liked.has(p.id),mine=p.me;
  const head=c?`<button class="li" style="padding:0" data-go="club" data-id="${c.id}">${cover(c,'',``,'width:40px;height:40px;border-radius:50%')}<span class="grow"><b style="font-size:14.5px">${esc(c.name)}</b><span class="meta">${p.t} · ${c.board}</span></span></button>`
    :`<button class="li" style="padding:0" ${mine?'data-a="root" data-v="profile"':`data-go="person" data-id="${esc(p.who)}"`}>${av(p.who,40)}<span class="grow"><b style="font-size:14.5px">${esc(mine?'You':p.who)}</b><span class="meta">${p.t}${p.bio?' · '+esc(p.bio):''}</span></span></button>`;
  const act=c?(S.followed.has(c.id)?'':`<button class="btn sm" data-a="follow" data-id="${c.id}">Follow</button>`):mine?'':connBtn(p.who);
  return `<article class="post"><div class="phd">${head}${act}</div>
  <div class="row" style="gap:6px"><span class="pill ${PTYPE[p.type]||''}">${p.type}</span>${p.tag?`<span class="pill">${esc(club(p.tag).name)}</span>`:''}</div>
  ${p.text?`<p class="ptext">${esc(p.text)}</p>`:''}
  ${p.media&&p.media.length?postMedia(p.media):c?`<button class="pimg" data-go="club" data-id="${c.id}" aria-label="${esc(c.name)}">${cover(c,'',``,'',p.img)}</button>`:''}
  <div class="pact"><button data-a="like" data-id="${p.id}" class="${liked?'on':''}" aria-pressed="${liked}">${ic('heart')}${p.likes+(liked?1:0)}</button><button ${full?'':`data-go="post" data-id="${p.id}"`}>${ic('chat')}${p.comments.length}</button><button data-a="sharePost">${ic('send')}Share</button></div></article>`}
SCR.feed=()=>{const f=S.feedF||'All',list=S.posts.filter(p=>!p.archive&&(f==='All'||(f==='Clubs'?p.club:!p.club)));
  return {nav:'feed',top:`<span class="brand">Feed</span><button class="ib" data-go="notifs" aria-label="Notifications">${ic('bell')}${unread()?`<span class="dot">${unread()}</span>`:''}</button>`,
  body:`<button class="compose" data-a="startPost">${S.signedIn?av(ME(),36):`<span class="ib" style="width:36px;height:36px">${ic('user')}</span>`}<span class="grow">Share a thought, idea or photo</span>${ic('plus')}</button>
  <div class="chips">${['All','Clubs','People'].map(x=>`<button class="chip ${f===x?'on':''}" data-a="feedF" data-v="${x}">${x}</button>`).join('')}</div>
  <div class="stack" style="gap:16px">${list.map(p=>postCard(p)).join('')}</div>`};
};
SCR.post=({id})=>{const p=S.posts.find(x=>x.id===id);
  return {top:`${backBtn}<h1>Post</h1>`,
  body:`${postCard(p,true)}<div class="stack"><div class="sec"><b>Comments</b><span class="meta">${p.comments.length}</span></div>${p.comments.length?msgList(p.comments.map((m,i)=>({id:i,...m})),'C:'+id):'<span class="meta">Be the first to reply.</span>'}</div>`,
  composer:`<input class="input" id="chat" placeholder="Add a comment" autocomplete="off" aria-label="Comment"><button class="btn primary" data-a="pcomment" data-id="${id}" aria-label="Send">${ic('send')}</button>`};
};
SCR.compose=()=>{const d=S.pd||{type:'Thought',tag:null,media:[]},m=d.media||[];
  return {top:`${backBtn}<h1>New post</h1>`,
  body:`<div class="row">${['Thought','Idea','Question','Looking for'].map(t=>`<button class="chip ${d.type===t?'on':''}" data-a="pdType" data-v="${t}">${t}</button>`).join('')}</div>
  <textarea class="input" id="pt1" maxlength="280" style="min-height:120px" placeholder="${{Thought:"What's on your mind?",Idea:'Share an idea for campus',Question:'Ask the campus anything','Looking for':'Teammates, a study buddy, a ride...'}[d.type]}">${esc(d.text||'')}</textarea>
  <div class="mrow">${m.map((x,i)=>`<div class="mthumb">${x.type==='video'?`<video src="${x.url}" muted playsinline></video><span class="vtag">${ic('chev')}</span>`:`<img src="${x.url}" alt="">`}<button data-a="rmMedia" data-v="${i}" aria-label="Remove">${ic('x')}</button></div>`).join('')}
    ${m.length<4?`<label class="madd" for="mfile">${ic('plus')}<span>${m.length?'Add more':'Photo or video'}</span></label>`:''}<input type="file" id="mfile" accept="image/*,video/*" multiple hidden></div>
  <span class="err" id="pte" hidden>Write something or add a photo first.</span>
  <div class="stack"><span class="lbl">Tag a club <span class="meta">(optional)</span></span><div class="chips">${[...new Set([...S.followed,'photo','coding','music','dance','eco'])].slice(0,8).map(id=>`<button class="chip ${d.tag===id?'on':''}" data-a="pdTag" data-v="${id}">${esc(club(id).name)}</button>`).join('')}</div></div>
  <span class="meta">${ic('users')} Visible to IITG students. Up to 4 photos or videos.</span>`,
  foot:`<button class="btn primary" data-a="sendPost">${ic('send')} Post</button>`};
};
SCR.person=({id})=>{const n=id,P=person(n),posts=S.posts.filter(p=>p.who===n&&!p.club),rooms=S.hangs.filter(h=>h.people.includes(n)),fol=S.pfollowing.has(n);
  if(ME_PROFILE(n)) return SCR.profile();
  return {top:`${backBtn}<h1>${esc(n)}</h1>`,
  body:`<div class="phead">${av(n,76)}<span class="grow"><b>${esc(n)}</b><span class="meta">${esc(P.bio)}</span>${P.head?`<span class="headline">${esc(P.head)}</span>`:''}</span></div>
  <div class="nets"><span><b>${P.fol+(fol?1:0)}</b>Followers</span><span><b>${P.fng}</b>Following</span><span><b>${posts.length}</b>Posts</span></div>
  <div class="row" style="flex-wrap:nowrap">${connBtn(n,0).replace('class="btn ','class="btn grow1 ')}<button class="btn grow1 ${fol?'':''}" data-a="pfollow" data-v="${esc(n)}">${fol?ic('check')+' Following':ic('heart')+' Follow'}</button><button class="btn icon" data-a="invTo" data-v="${esc(n)}" aria-label="Invite to a room">${ic('users')}</button></div>
  ${P.int.length?`<div class="stack"><div class="sec"><b>Into</b></div><div class="row">${P.int.map(i=>`<span class="chip">${esc(i)}</span>`).join('')}</div></div>`:''}
  ${P.clubs.length?`<div class="stack"><div class="sec"><b>Clubs</b></div><div class="hs">${P.clubs.map(id=>`<button class="mini2" data-go="club" data-id="${id}">${cover(club(id),'',``,'width:64px;height:64px;border-radius:50%')}<span>${esc(club(id).name.replace(' Club',''))}</span></button>`).join('')}</div></div>`:''}
  ${rooms.length?`<div class="stack"><div class="sec"><b>In rooms</b></div>${rooms.map(hangCard).join('')}</div>`:''}
  <div class="stack"><div class="sec"><b>Posts</b><span class="meta">${posts.length}</span></div>${posts.length?posts.map(p=>postCard(p)).join(''):'<span class="meta">No posts yet.</span>'}</div>`};
};
SCR.network=({id})=>{const tab=id||'connections',sug=[...new Set([...S.hangs.filter(h=>S.hjoined.has(h.id)).flatMap(h=>h.people),...Object.keys(PINFO)])].filter(n=>n!==ME()&&connState(n)===''&&!S.inreq.includes(n)).slice(0,6);
  const lists={connections:[...S.connected],followers:[...S.pfollowers],following:[...S.pfollowing]};
  const L=lists[tab];
  return {top:`${backBtn}<h1>Your network</h1>`,
  body:`${S.inreq.length?`<div class="stack"><div class="sec"><b>Requests</b><span class="pill warn">${S.inreq.length}</span></div>${S.inreq.map(n=>personRow(n,`<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-a="ignoreReq" data-v="${esc(n)}">Ignore</button><button class="btn sm primary" data-a="acceptReq" data-v="${esc(n)}">Accept</button></span>`)).join('')}</div>`:''}
  <div class="seg">${[['connections','Connections'],['followers','Followers'],['following','Following']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-a="netTab" data-v="${k}">${l} · ${lists[k].length}</button>`).join('')}</div>
  <div class="stack">${L.length?L.map(n=>personRow(n,tab==='following'?`<button class="btn sm" data-a="pfollow" data-v="${esc(n)}">Unfollow</button>`:tab==='followers'&&!S.pfollowing.has(n)?`<button class="btn sm primary" data-a="pfollow" data-v="${esc(n)}">Follow back</button>`:undefined)).join('')
    :`<span class="meta">${{connections:'Connect with people from the feed or your rooms.',followers:'No followers yet.',following:'Follow people to see their posts first.'}[tab]}</span>`}</div>
  ${sug.length?`<div class="stack"><div class="sec"><b>People you may know</b><span class="meta">From your rooms and clubs</span></div>${sug.map(n=>personRow(n)).join('')}</div>`:''}`};
};
SCR.roompeople=({id})=>{const h=hang(id);
  return {top:`${backBtn}<h1>In this room</h1>`,body:`<span class="meta">${esc(h.title)} · ${h.people.length} people</span><div class="stack">${h.people.map(n=>n===ME()?`<div class="li">${av(n,44)}<span class="grow"><b>You</b><span class="meta">${n===h.host?'Host':'Member'}</span></span></div>`:personRow(n)).join('')}</div>`};
};
function invToSheet(sh){const mine=S.hangs.filter(h=>S.hjoined.has(h.id));
  return `<div class="sheetbg" data-a="closeSheet"><div class="sheet" data-stop="1"><b style="font-family:var(--display);font-size:20px">Invite ${esc(sh.who)} to a room</b>
  ${mine.length?mine.map(h=>`<button class="opt" data-a="invToRoom" data-v="${h.id}"><span class="spot" style="${sprPos(RTYPE[h.type][1])};width:40px;border-radius:12px"></span><span class="grow"><b>${esc(h.title)}</b><span class="meta">${esc(h.when)}</span></span>${ic('send')}</button>`).join('')
  :`<span class="meta">You're not in any room yet.</span><button class="btn primary" data-a="startRoom">${ic('plus')} Start a room</button>`}</div></div>`}

const hang=id=>S.hangs.find(h=>h.id===id);
function hangCard(h){const [tl,sp]=RTYPE[h.type],inR=S.hjoined.has(h.id),req=S.hreq[h.id];
  return `<button class="hcard" data-go="hang" data-id="${h.id}"><span class="spot" style="${sprPos(sp)};width:64px;flex:none" aria-hidden="true"></span>
  <span class="grow"><span class="row" style="gap:6px"><span class="pill acc">${tl}</span>${liveTag(h)}${h.open?'':`<span class="pill">${ic('lock')} Invite only</span>`}</span><b>${esc(h.title)}</b>
  <span class="tmeta">${ic('clock')}${esc(h.when)} · ${ic('pin')}${esc(h.where)}</span>
  <span class="row" style="gap:8px"><span class="avs">${h.people.slice(0,4).map(p=>av(p,24)).join('')}</span><span class="meta">${h.people.length} in${inR?' · you':req?' · request sent':''}</span></span></span></button>`}
SCR.rooms=()=>{const mine=S.hangs.filter(h=>S.hjoined.has(h.id)),now=S.hangs.filter(h=>!S.hjoined.has(h.id)&&/^Now/.test(h.when)),later=S.hangs.filter(h=>!S.hjoined.has(h.id)&&!/^Now/.test(h.when)),f=S.roomF||'all';
  const filt=l=>l.filter(h=>f==='all'||h.type===f);
  const teams=S.role==='member'?S.teamClubs.map(club):[];
  return {nav:'rooms',top:`<span class="brand">Rooms</span><button class="btn sm primary" data-a="startRoom">${ic('plus')} New room</button>`,
  body:`<div class="chips">${[['all','All'],...Object.entries(RTYPE).map(([k,v])=>[k,v[0]])].map(([k,l])=>`<button class="chip ${f===k?'on':''}" data-a="roomF" data-v="${k}">${l}</button>`).join('')}</div>
  ${mine.length?`<div class="stack"><div class="sec"><b>Your rooms</b></div>${filt(mine).map(hangCard).join('')}</div>`:''}
  ${filt(now).length?`<div class="stack"><div class="sec"><b>Happening now</b></div>${filt(now).map(hangCard).join('')}</div>`:''}
  ${filt(later).length?`<div class="stack"><div class="sec"><b>Later</b></div>${filt(later).map(hangCard).join('')}</div>`:''}

function applyDecision(p,st){p.status=st;if(st!=='live'){toast('Declined. The team is notified.');return}
  const c=club(p.club);
  if(p.kind==='venue'){const e=ev(p.ev);if(p.field==='Time'){e.time=p.after}else{e.prevVenue=e.venue;e.venue=p.after;e.changed=true}
    if(S.regs[e.id])notify({icon:'pin',col:c.c,title:'Event updated',text:`${e.title}: ${p.after}`,go:[p.field==='Time'?'event':'updates',{id:e.id}]})}
  else if(p.kind==='new'){const id='n'+(++S.seq),[dw,dn,mn]=(p.when.match(/^(\w{3}) (\d+) (\w{3})/)||[0,'Sat','7','Nov']).slice(1);
    S.ev.push({id,club:c.id,title:p.title,type:'Workshop',day:`${dw} ${dn} ${mn}`,time:(p.when.split('·')[1]||'5–7 PM').trim(),sort:1100+(+dn||7),venue:p.where,cap:30,taken:0,wl:0,deadline:'Day before, 6 PM',beginner:true,who:['All years'],bring:['Curiosity'],flow:['Intro','Hands-on','Wrap-up'],reg:'required',refp:'NW'})}
  else if(p.kind==='page'){c.short=p.after}
  else{c.recruit=p.title.startsWith('Open')?{open:true,deadline:p.deadline||'Fri 13 Nov',result:'Mon 16 Nov',steps:['Short form','Task','Chat']}:{open:false,next:'Jan 2027'}}
  toast('Published. Students see it now.')}
function planCount(){const r=Object.entries(S.regs);return r.filter(([,m])=>m.status==='offer').length+(r.some(([id,m])=>m.status==='confirmed'&&!S.attended.has(id)&&!ev(id).cancelled)?1:0)
  +[...S.attended].filter(id=>!S.feedback.has(id)).length+[...S.saved].filter(id=>{const e=ev(id);return !e.cancelled&&e.reg==='required'&&!S.regs[id]&&left(e)>0}).length
  +[...S.followed].filter(id=>club(id).recruit.open&&!S.apps[id]).length}

 reset:()=>{fresh();render(true);toast('Reset')},
 roomok:()=>{const hs=Object.keys(S.hreq);hs.forEach(id=>{const h=hang(id);S.hjoined.add(id);if(!h.people.includes(ME()))h.people.push(ME());delete S.hreq[id];notify({icon:'users',col:'#F45B4F',title:"You're in: "+h.title,text:h.host+' accepted your request',go:['hang',{id}]})});
  const ids=Object.keys(S.roomReq);if(!ids.length&&!hs.length){toast('No room requests waiting');return}if(!ids.length){render();toast('Host approved. Check the bell.');return}ids.forEach(id=>{S.rooms.add(id);delete S.roomReq[id];notify({icon:'chat',col:club(id).c,title:"You're in the "+club(id).name+' room',text:'A moderator approved your request',go:['room',{id}]})});render();toast('Moderator approved. Check the bell.')},
 accept:()=>{const r=[...S.creq];if(!r.length){toast('No pending connection requests');return}r.forEach(n=>{S.creq.delete(n);S.connected.add(n);notify({icon:'users',col:'#F45B4F',title:n+' accepted',text:"You're now connected",go:['person',{id:n}]})});render();toast('Accepted. Check the bell.')},
 forget:()=>{RECENT=[];saveRecent();render();toast('Saved emails cleared')},
 fetch:()=>{S.fetchFail=!S.fetchFail;renderGuide();toast(S.fetchFail?'Next sign-in: record lookup fails':'Record lookup works')},
 head:()=>{S.memberRole=S.memberRole==='head'?'member':'head';render();toast(S.memberRole==='head'?'You are now the club head':'Back to member')},
 approve:()=>{const p=S.props.find(x=>x.status==='discussing'&&x.club===(S.activeClub||'photo'));if(!p){toast('No open proposals');return}applyDecision(p,'live');render()}
};
const TASKS=[['Onboard as a fresher: pick interests, follow clubs','splash'],['Onboard as a club member and propose a venue change','splash'],['Register for the photo walk, tap “I\'m here”, enter 4827 to check in','home'],['Find a beginner photography event and register','home'],['Join the full robotics workshop waitlist, then open a seat','home'],['Apply to the Photography Club core team','home'],['Post a photo on the Feed, then open Meera\'s profile and connect','feed'],['Accept a connection request from your Profile','profile'],['Open Robotics Club and read its Posts tab','home'],['Start a chai room and invite two people','rooms'],['Join the DSA study room and hop on its video call','rooms'],['Create a voice room for Ask anything and start the call','rooms'],['Ask to join the invite-only lake hangout, then approve it as the host','rooms'],['Sign up when your record is not found and enter details yourself','splash'],['Edit your profile: add a bio and skills','profile']];
function renderGuide(){const r=cur();
  document.getElementById('guide').innerHTML=`<div class="stack" style="gap:8px"><span class="tag">PROTOTYPE v2</span><h2>CampusConnect</h2>
  <p class="status">Any <b>@iitg.ac.in</b> email + any 6 digits. Now: <b>${r.s.replace('_',' ')}</b> · ${S.signedIn?`<b>${esc(S.user.name)}</b>`:'<b>guest</b>'}${S.failNext?' · <b style="color:var(--danger)">next registration fails</b>':''}</p></div>
  <div class="gcard"><h3>Tasks</h3>${TASKS.map(([t,s],i)=>`<div class="task"><span class="n">0${i+1}</span><span>${t}</span><button class="btn sm" data-g="task" data-v="${s}">Start</button></div>`).join('')}</div>
  <div class="gcard"><h3>Play the organizer</h3><div class="sim"><button class="btn sm" data-g="sim" data-v="venue">${ic('pin')}Venue changes</button><button class="btn sm" data-g="sim" data-v="seat">${ic('ticket')}Seat opens</button><button class="btn sm" data-g="sim" data-v="cancel">${ic('x')}Cancel walk</button><button class="btn sm" data-g="sim" data-v="attend">${ic('star')}Mark attended</button><button class="btn sm ${S.failNext?'danger':''}" data-g="sim" data-v="fail">${ic('alert')}Fail next booking</button><button class="btn sm" data-g="sim" data-v="signin" ${S.signedIn?'disabled':''}>${ic('user')}Skip sign-in</button><button class="btn sm" data-g="sim" data-v="roomok">${ic('users')}Host approves my request</button><button class="btn sm" data-g="sim" data-v="accept">${ic('check')}People accept my requests</button><button class="btn sm ${S.fetchFail?'danger':''}" data-g="sim" data-v="fetch">${ic('user')}${S.fetchFail?'Record lookup fails: on':'Make record lookup fail'}</button><button class="btn sm" data-g="sim" data-v="forget" ${RECENT.length?'':'disabled'}>${ic('x')}Forget saved emails</button><button class="btn sm" data-g="sim" data-v="reset">Reset</button></div>
  <h3 style="margin-top:6px">Club side</h3><div class="sim"><button class="btn sm ${S.memberRole==='head'?'primary':''}" data-g="sim" data-v="head">${ic('shield')}${S.memberRole==='head'?'Club head: on':'Become club head'}</button><button class="btn sm" data-g="sim" data-v="approve">${ic('check')}Head approves next proposal</button></div></div>
  <div class="gcard"><h3>Jump to</h3><div class="jump">${JUMP.map(([g,items])=>`<h4>${g}</h4>`+items.map(([l,s,id])=>`<button class="${r.s===s?'cur':''}" data-g="jump" data-v="${s}" ${id?`data-id="${id}"`:''}>${l}</button>`).join('')).join('')}</div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-g]');
  if(g){const v=g.dataset.v;
    if(g.dataset.g==='sim')SIM[v]();
    else if(g.dataset.g==='task'){fresh();root(v);toast('Fresh start')}
    else if(g.dataset.g==='jump'){if(SPECIAL[v])SPECIAL[v]();else if(g.dataset.id)at(['home'],[v,g.dataset.id]);else{S.searching=false;root(v)}}
    if(matchMedia('(max-width:880px)').matches)document.getElementById('phone').scrollIntoView({behavior:'smooth'});
    return}
  const t=e.target.closest('[data-a],[data-go]');if(!t||!document.getElementById('phone').contains(t))return;
  if(t.classList.contains('sheetbg')&&e.target.closest('[data-stop]'))return;
  if(t.dataset.go){go(t.dataset.go,{id:t.dataset.id});return}
  A[t.dataset.a]&&A[t.dataset.a](t);
});
/* mouse drag-to-scroll for every horizontal row (touch already swipes natively) */
let drag=null;
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;const r=e.target.closest('.hs,.chips');if(!r)return;drag={r,x:e.clientX,s:r.scrollLeft,moved:false}});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>5){drag.moved=true;drag.r.classList.add('drag')}if(drag.moved)drag.r.scrollLeft=drag.s-dx});
document.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;d.r.classList.remove('drag');if(d.moved){const stop=ev=>{ev.stopPropagation();ev.preventDefault()};document.addEventListener('click',stop,{capture:true,once:true});setTimeout(()=>document.removeEventListener('click',stop,{capture:true}),0)}});
document.addEventListener('change',e=>{
  if(e.target.id!=='mfile'||!S.pd)return;S.pd.text=document.getElementById('pt1').value;S.pd.media=S.pd.media||[];
  [...e.target.files].slice(0,4-S.pd.media.length).forEach(f=>{if(/^(image|video)\//.test(f.type))S.pd.media.push({type:f.type.startsWith('video')?'video':'image',url:URL.createObjectURL(f)})});render()});
document.addEventListener('focusin',e=>{if(e.target.id==='q'&&!S.searching&&cur().s==='home'){S.searching=true;S.focusQ=true;render(true)}});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;const r=document.getElementById('results');if(r)r.innerHTML=results()}
  if(e.target.id==='email')S.email=e.target.value;
  if(e.target.id==='otp'){S.otp=e.target.value.replace(/\D/g,'').slice(0,6);e.target.value=S.otp;document.getElementById('otpv').innerHTML=otpBoxes()}
  if(e.target.id==='cin'){S.sheet.code=e.target.value.replace(/\D/g,'').slice(0,4);S.sheet.err='';e.target.value=S.sheet.code;document.getElementById('cinv').innerHTML=cinBoxes()}
  if(e.target.id==='a1'){const x=document.getElementById('a1e');if(x)x.hidden=true}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='chat'){const b=document.querySelector('[data-a="send"]'),c=document.querySelector('[data-a="comment"]'),pc=document.querySelector('[data-a="pcomment"]');b?A.send(b):c?A.comment(c):pc&&A.pcomment(pc)}
  if(e.target.id==='email')A.sendCode();
  if(e.target.id==='otp')A.verify();
  if(e.target.id==='cin')A.doCheckin();
});
render(true);
</script>
