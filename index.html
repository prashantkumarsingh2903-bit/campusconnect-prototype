/* plan card: the event plus the badge you earn there (no tickets, no QR) */
function ticket(e,ref,extra=''){const c=ec(e),d=dp(e),got=S.attended.has(e.id);
  return `<div class="ticket">${evCover(e)}<div class="thead"><span class="meta">${esc(c.name)}</span><b>${esc(e.title)}</b></div>
  <div class="tbody"><div class="stack" style="gap:6px"><span class="tmeta">${ic('cal')}<b style="color:var(--ink)">${d.dow} ${d.num} ${d.mon}</b> · ${e.time}</span><span class="tmeta">${ic('pin')}${esc(e.venue)}</span>${extra}</div>
  <div class="center" style="gap:4px">${medal(evBadge(e),got,64)}<span class="meta" style="font-size:11px;font-weight:700">${got?'Earned':'Badge to earn'}</span></div></div></div>`}

/* ---------- campus journey: one collectible badge per event, clubs level up with repeat visits ---------- */
const BN={walk:'First Light',quiz1:'Quiz Rookie',dance1:'Brave Audition',cp:'Code Starter',badm:'Smash Debut',mlread:'Paper Cracker',openmic:'Mic Drop',linef:'Line Tracer',nets:'Net Session',clean:'Lake Guardian',jam:'Web Weaver'};
const evBadge=e=>({club:e.club,name:BN[e.id]||e.title,img:e.img,title:e.title,date:e.day,ev:e.id});
const stamp=(c,earned,size=84,i=CLUBS.indexOf(c),img)=>`<span class="stamp ${earned?'':'locked'}" style="--c:${c.c};--s:${size}px;--r:${((i*37)%15)-7}deg"><span class="sin"><img src="img/${img||c.img}.webp" alt="" loading="lazy"></span>${earned?'':`<span class="lk">${ic('lock')}</span>`}</span>`;
const medal=(b,earned,size=84,i)=>{const c=club(b.club);return `<span class="medal2" style="--s:${size}px">${stamp(c,earned,size,i??(b.name.length*3),b.img)}<span class="rib" style="--c:${earned?c.c:'#B9B1A1'}">${esc(b.name)}</span></span>`};
const TIERS=[[1,'Bronze','#C07B45'],[3,'Silver','#8D97A3'],[5,'Gold','#D69A12']];
function tier(n){let t=null;TIERS.forEach(x=>{if(n>=x[0])t=x});return {t,nx:TIERS.find(x=>n<x[0])}}
const badgeCount=()=>S.badges.length;
const stampCount=badgeCount;
const LEVELS=[[0,'Fresher'],[1,'Newcomer'],[3,'Regular'],[6,'Insider'],[10,'Campus legend']];
function level(){const n=badgeCount();let i=0;LEVELS.forEach(([m],j)=>{if(n>=m)i=j});return {i,name:LEVELS[i][1],next:LEVELS[i+1],n}}
function collect(id){const e=ev(id),before=tier((S.stamps[e.club]||{n:0}).n).t;S.attended.add(id);
  const s=S.stamps[e.club]||(S.stamps[e.club]={n:0,date:e.day});s.n++;
  const b={id:'b'+(++S.seq),...evBadge(e)};S.badges.unshift(b);S.lastBadge=b.id;
  const after=tier(s.n).t;S.tierUp=after&&after!==before?after:null;
  if(S.pinned.length<3)S.pinned.push(b.id)}
function journeyBody(){const L=level(),mine=S.badges,clubs=Object.keys(S.stamps);
  const up=S.ev.filter(e=>!e.cancelled&&e.reg!=='apply'&&!S.attended.has(e.id)).sort((a,b)=>(S.regs[b.id]?.status==='confirmed')-(S.regs[a.id]?.status==='confirmed')||S.followed.has(b.club)-S.followed.has(a.club)||a.sort-b.sort).slice(0,6);
  return `<div class="jhero"><div class="jl"><span class="meta">Level ${L.i+1}</span><b>${L.name}</b><span class="meta">${L.n} badge${L.n===1?'':'s'} · ${clubs.length} club${clubs.length===1?'':'s'}</span>
    ${L.next?`<div class="bar" style="--c:#F45B4F;margin-top:6px"><i style="width:${(L.n-LEVELS[L.i][0])/(L.next[0]-LEVELS[L.i][0])*100}%"></i></div><span class="meta" style="font-size:12px">${L.next[0]-L.n} more event${L.next[0]-L.n===1?'':'s'} to ${L.next[1]}</span>`:''}</div>
    <div class="jstack">${(mine.length?mine.slice(0,3):[evBadge(ev('walk')),evBadge(ev('cp')),evBadge(ev('nets'))]).map((b,i)=>stamp(club(b.club),mine.length,62,i,b.img)).join('')}</div></div>
  <div class="stack"><div class="sec"><b>Your badges</b><span class="meta">${mine.length}</span></div>
    ${mine.length?`<div class="sgrid">${mine.map(b=>`<button class="scell" data-go="badgeview" data-id="${b.id}">${medal(b,true,76)}<span class="meta" style="font-size:11px">${b.date.split(' ').slice(1).join(' ')}</span>${S.pinned.includes(b.id)?`<em>${ic('pin')}</em>`:''}</button>`).join('')}</div>`
    :`<div class="card" style="flex-direction:row;align-items:center">${spot('map',72)}<span class="grow"><b>Your first badge is one event away</b><span class="meta">Every event has its own badge. Check in to earn it.</span></span></div>`}</div>
  ${up.length?`<div class="stack"><div class="sec"><b>Up for grabs</b><span class="meta">Upcoming events</span></div><div class="hs">${up.map(e=>`<button class="grab" data-go="event" data-id="${e.id}">${medal(evBadge(e),false,76)}<span class="tmeta">${S.regs[e.id]?.status==='confirmed'?`<b style="color:var(--accent-text)">Going</b> · `:''}${dp(e).dow} ${dp(e).num} ${dp(e).mon}</span></button>`).join('')}</div></div>`:''}
  ${clubs.length?`<div class="stack"><div class="sec"><b>Your clubs</b><span class="meta">Keep showing up</span></div>${clubs.map(id=>{const c=club(id),n=S.stamps[id].n,{t,nx}=tier(n);
    return `<button class="ctier" data-go="club" data-id="${id}">${cover(c,'thumb')}<span class="grow"><b>${esc(c.name)}</b><span class="row" style="gap:6px"><span class="tierpill" style="--t:${t[2]}">${ic('star')}${t[1]}</span><span class="tmeta">${n} event${n===1?'':'s'}</span></span>
    ${nx?`<span class="bar" style="--c:${nx[2]}"><i style="width:${n/nx[0]*100}%"></i></span><span class="tmeta">${nx[0]-n} more for ${nx[1]}</span>`:`<span class="tmeta">Top tier reached</span>`}</span></button>`}).join('')}</div>`:''}`}
SCR.stamped=({id})=>{const e=ev(id),c=ec(e),b=S.badges.find(x=>x.ev===id)||evBadge(e),n=S.stamps[c.id].n,{t,nx}=tier(n);
  return {top:`<span style="flex:1"></span><button class="ib" data-a="root" data-v="activity" aria-label="Close">${ic('x')}</button>`,
  body:`<div class="center" style="gap:12px;padding-top:4px"><div class="stampin">${medal(b,true,170)}</div><h2 class="h2">Badge earned!</h2><span class="meta">${esc(e.title)} · ${esc(c.name)}</span></div>
  ${S.tierUp?`<div class="banner acc">${ic('star')}<span class="grow">${esc(c.name)} · ${S.tierUp[1]} unlocked<span>${n} events attended. Thanks for showing up.</span></span></div>`:''}
  <div class="ctier" style="pointer-events:none">${cover(c,'thumb')}<span class="grow"><b>${esc(c.name)}</b><span class="row" style="gap:6px"><span class="tierpill" style="--t:${t[2]}">${ic('star')}${t[1]}</span><span class="tmeta">${n} event${n===1?'':'s'}</span></span>${nx?`<span class="bar" style="--c:${nx[2]}"><i style="width:${n/nx[0]*100}%"></i></span><span class="tmeta">${nx[0]-n} more for ${nx[1]}</span>`:''}</span></div>
  <div class="row meta" style="justify-content:center">${ic('pin')} ${S.pinned.includes(b.id)?'Pinned to your profile':'Saved to your journey'}</div>`,
  foot:`${S.feedback.has(id)?'':`<button class="btn" data-go="feedback" data-id="${id}">Rate it</button>`}<button class="btn primary" data-a="root" data-v="activity">See my badges</button>`};
};
SCR.badgeview=({id})=>{const b=S.badges.find(x=>x.id===id),c=club(b.club),n=S.stamps[c.id]?.n||1,{t}=tier(n),pin=S.pinned.includes(id);
  return {top:`${backBtn}<h1>Badge</h1>`,
  body:`<div class="center" style="gap:12px;padding-top:8px">${medal(b,true,180)}<h2 class="h2">${esc(b.name)}</h2><span class="meta">${esc(b.title)} · ${b.date}</span></div>
  <div class="facts"><div class="fact">${ic('users')}<b>${esc(c.name)}</b><span>Club</span></div><div class="fact">${ic('star')}<b>${t[1]}</b><span>Your club tier</span></div></div>
  <div class="row meta" style="justify-content:center">${ic('check')} Earned by checking in at the event</div>`,
  foot:`<button class="btn" data-a="shareBadge">${ic('send')} Share</button><button class="btn ${pin?'':'primary'}" data-a="pinBadge" data-id="${id}">${ic('pin')} ${pin?'Pinned':'Pin to profile'}</button>`};
};
SCR.confirm=({id})=>{const e=ev(id);return {top:`${backBtn}<h1>Confirm</h1>`,
  body:`${ticket(e,'—',`<span class="tmeta">${ic('user')}${esc(S.user.name)}</span>`)}
  <div class="toggles">${tg('alert','Venue & time changes',true,'noop')}${tg('bell','Remind me the evening before',S.remind,'toggleRemind')}</div>
  <textarea class="input" id="access" placeholder="Anything the organizer should know? (optional)" aria-label="Note for organizer"></textarea>`,
  foot:`<button class="btn primary" data-a="confirmReg" data-id="${id}">Confirm seat</button>`};};
SCR.registered=({id})=>{const e=ev(id),m=S.regs[id];return {top:`<span style="flex:1"></span><button class="ib" data-a="root" data-v="home" aria-label="Close">${ic('x')}</button>`,
  body:`<div class="center"><span class="okbig">${ic('check')}</span><h2 class="h2">You're going!</h2></div>${ticket(e,m.ref)}
  <div class="row meta" style="justify-content:center">${ic('spark')} Tap “I'm here” at the event to earn its badge</div>`,
  foot:`<button class="btn" data-a="root" data-v="activity">My journey</button><button class="btn primary" data-a="cal">${ic('cal')} Add to calendar</button>`};};
SCR.pass=({id})=>{const e=ev(id),m=S.regs[id];if(!m)return SCR.event({id});return {top:`${backBtn}<h1>Your plan</h1>`,
  body:`${e.cancelled?`<div class="banner bad">${ic('alert')}<span class="grow">Cancelled by organizer<span>${esc(e.reason)}</span></span></div>`:''}
  ${e.changed&&!e.cancelled?`<button class="banner warn" data-go="updates" data-id="${id}">${ic('pin')}<span class="grow">Meeting point changed<span>Now: ${esc(e.venue)}</span></span>${ic('chev')}</button>`:''}
  ${ticket(e,m.ref,`<span class="tmeta">${ic('user')}${esc(S.user.name)}</span>`)}
  ${S.attended.has(id)?'':`<div class="row" style="justify-content:space-between"><button class="link" data-a="cal">${ic('cal')} Add to calendar</button><button class="link" style="color:var(--danger)" data-go="cancelReg" data-id="${id}">Can't go</button></div>`}`,
  foot:e.cancelled?`<button class="btn primary" data-a="root" data-v="home">Find other events</button>`:S.attended.has(id)?`<button class="btn primary" data-a="root" data-v="activity">See my journey</button>`:`<button class="btn primary" data-a="checkin" data-id="${id}">${ic('pin')} I'm here · earn badge</button>`};};
SCR.cancelReg=({id})=>{const e=ev(id),c=ec(e);return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center">${cover(c,'',``,'width:96px;height:96px;border-radius:28px')}<h2 class="h2">Give up your seat?</h2><span class="meta">${esc(e.title)}</span></div>
  <div class="facts"><div class="fact">${ic('ticket')}<b>Seat released</b><span>Instantly</span></div><div class="fact">${ic('users')}<b>${e.wl?'Next in line':'Open to others'}</b><span>${e.wl?'Gets offered it':'Anyone can book'}</span></div></div>
  <textarea class="input" id="why" placeholder="Reason (optional)" aria-label="Reason"></textarea>`,
  foot:`<button class="btn" data-a="back">Keep it</button><button class="btn danger" data-a="doCancel" data-id="${id}">Cancel seat</button>`};};
SCR.full=({id})=>{const e=ev(id),c=ec(e);return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center"><span class="big">0</span><span class="meta">seats left · ${e.wl} waiting</span></div>
  <div class="card" style="--c:${c.c}"><div class="seats">${Array.from({length:e.cap},()=>'<i class="t"></i>').join('')}</div></div>
  <div class="steps"><div class="step done"><i>1</i>Join waitlist</div><div class="step"><i>2</i>Seat opens</div><div class="step"><i>3</i>Accept in time</div></div>
  ${(()=>{const sim=S.ev.filter(x=>x.id!==id&&!x.cancelled&&x.reg==='required'&&left(x)>0&&ec(x).board===c.board).slice(0,4);return sim.length?`<div class="stack"><div class="sec"><b>Open instead</b></div><div class="hs">${sim.map(poster).join('')}</div></div>`:''})()}`,
  foot:`<button class="btn" data-a="back">Not now</button><button class="btn primary" data-a="joinWait" data-id="${id}">Join waitlist · #${e.wl+1}</button>`};};
SCR.offer=({id})=>{const e=ev(id),m=S.regs[id];return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center"><span class="okbig" style="background:var(--warm-soft);color:var(--warm)">${ic('ticket')}</span><h2 class="h2">A seat opened up!</h2><span class="pill warn">${ic('clock')} Accept by ${m.expires}</span></div>${ticket(e,'OFFER')}`,
  foot:`<button class="btn" data-a="declineOffer" data-id="${id}">Pass</button><button class="btn primary" data-a="acceptOffer" data-id="${id}">Take the seat</button>`};};
SCR.regfail=({id})=>{const e=ev(id);return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center" style="padding-top:20px"><span class="okbig" style="background:var(--danger-soft);color:var(--danger)">${ic('alert')}</span><h2 class="h2">Connection dropped</h2><span class="meta">We'll check if your seat went through. No double booking.</span></div>${erow(e)}`,
  foot:`<button class="btn" data-a="back">Back</button><button class="btn primary" data-a="retryReg" data-id="${id}">Check & retry</button>`};};
SCR.updates=({id})=>{const e=ev(id),c=ec(e);return {top:`${backBtn}<h1>Update</h1>`,
  body:`<div class="row">${av(c.contact,40)}<span class="grow"><b>${esc(c.contact)}</b><span class="meta">${esc(c.name)} · today 4:30 PM</span></span><span class="pill ok">${ic('shield')}</span></div>
  <div class="card"><div class="lbl">Meeting point</div><div class="row" style="flex-wrap:nowrap;gap:10px"><div class="fact" style="flex:1;background:var(--surface);opacity:.6">${ic('pin')}<b style="text-decoration:line-through">${esc(e.prevVenue)}</b><span>Before</span></div>${ic('arrow')}<div class="fact" style="flex:1;background:var(--surface);box-shadow:0 0 0 2px var(--accent)">${ic('pin')}<b>${esc(e.venue)}</b><span>Now</span></div></div><span class="meta">Sheltered in case of rain.</span></div>
  <div class="icchips"><span>${ic('cal')}Same day</span><span>${ic('clock')}Same time</span></div>`,
  foot:S.regs[id]?.status==='confirmed'?`<button class="btn primary" data-a="repl" data-v="pass" data-id="${id}">${ic('check')} See your plan</button>`:`<button class="btn primary" data-a="back">Got it</button>`};};
SCR.attended=({id})=>{const e=ev(id),c=ec(e),nx=S.ev.filter(x=>x.club!==e.club&&!x.cancelled&&x.reg==='required'&&left(x)>0).slice(0,4);return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center"><span class="okbig" style="background:${c.c};color:#fff">${ic('star')}</span><h2 class="h2">First event, done!</h2><span class="meta">${esc(e.title)}</span></div>
  <div class="join2"><button class="jt" data-a="follow" data-id="${c.id}"><span class="ji">${ic('heart')}</span><b>${S.followed.has(c.id)?'Following':'Follow club'}</b><span>${esc(c.name)}</span></button>${c.recruit.open?`<button class="jt hot" data-go="membership" data-id="${c.id}"><span class="ji">${ic('star')}</span><b>Core team</b><span>Apply by ${c.recruit.deadline}</span></button>`:`<button class="jt" data-a="openRoom" data-id="${c.id}"><span class="ji">${ic('chat')}</span><b>Club room</b><span>Say hi</span></button>`}</div>
  ${nx.length?`<div class="stack"><div class="sec"><b>Try next</b></div><div class="hs">${nx.map(poster).join('')}</div></div>`:''}`,
  foot:S.feedback.has(id)?`<button class="btn" disabled>${ic('check')} Rated · thanks</button>`:`<button class="btn primary" data-go="feedback" data-id="${id}">Rate it</button>`};};
SCR.feedback=({id})=>{const e=ev(id),fb=S.fb||{};const faces=['Meh','Okay','Good','Great','Loved it'];return {top:`${backBtn}<h1></h1>`,
  body:`<h2 class="h2">How did it feel?</h2>
  <div class="steps">${faces.map((f,i)=>`<button class="step ${fb.w===i+1?'now':''}" data-a="fbWel" data-v="${i+1}"><i style="width:48px;height:48px;font-size:18px">${i+1}</i>${f}</button>`).join('')}</div>
  <div class="stack"><span class="lbl">Matched the event page?</span><div class="row">${['Yes','Partly','No'].map(v=>`<button class="chip ${fb.m===v?'on':''}" data-a="fbMatch" data-v="${v}">${v}</button>`).join('')}</div></div>
  <textarea class="input" id="fbt" placeholder="One thing to improve (optional)" aria-label="Improvement"></textarea>
  <span class="meta">${ic('lock')} Only the organizers see this</span>`,
  foot:`<button class="btn primary" data-a="sendFb" data-id="${id}" ${fb.w?'':'disabled'}>Send</button>`};};

/* membership */
SCR.membership=({id})=>{const c=club(id),r=c.recruit,app=S.apps[id];return {bleed:true,
  body:`${hero(c,`<span class="pill warn">Recruiting</span>`,`Join the ${esc(c.name)} team`)}
  <div class="stats"><div class="stat">${ic('cal')}<b>${r.deadline.split(' ').slice(1).join(' ')}</b><span>Apply by</span></div><div class="stat">${ic('star')}<b>${r.result.split(' ').slice(1).join(' ')}</b><span>Results</span></div><div class="stat">${ic('clock')}<b>${c.hours}</b><span>per week</span></div></div>
  <div class="stack"><div class="sec"><b>Selection</b></div><div class="steps">${r.steps.map((s,i)=>`<div class="step ${app?'done':''}"><i>${i+1}</i>${esc(s)}</div>`).join('')}</div></div>
  <div class="icchips"><span>${ic('users')}All years</span><span>${ic('smile')}${c.beginner?'Beginners welcome':'Experience helps'}</span><span>${ic('ticket')}No fee</span></div>`,
  foot:app?`<button class="btn primary" data-a="root" data-v="activity" data-t="applications">Track application</button>`:`<button class="btn primary" data-a="startApp" data-id="${id}">Apply</button>`};};
SCR.apply=({id})=>{const c=club(id);return {top:`${backBtn}<h1>${esc(c.name)}</h1>`,
  body:`<div class="steps"><div class="step now"><i>1</i>Form</div>${c.recruit.steps.slice(1).map((s,i)=>`<div class="step"><i>${i+2}</i>${esc(s)}</div>`).join('')}</div>
  <div class="stack"><label class="lbl" for="a1">Why join?</label><textarea class="input" id="a1" placeholder="A few lines"></textarea><span class="err" id="a1e" hidden>Write a line or two first.</span></div>
  <div class="stack"><label class="lbl" for="a2">Experience</label><div class="row">${['None yet','A little','Lots'].map(v=>`<button class="chip ${S.exp===v?'on':''}" data-a="exp" data-v="${v}">${v}</button>`).join('')}</div></div>
  <div class="stack"><label class="lbl" for="a3">Link to your work <span class="meta">(optional)</span></label><input class="input" id="a3" placeholder="Drive, GitHub, Instagram"></div>`,
  foot:`<button class="btn" data-a="draft">Save draft</button><button class="btn primary" data-a="submitApp" data-id="${id}">Submit</button>`};};

/* activity */
SCR.activity=()=>{
  if(!S.signedIn) return {nav:'activity',top:`<h1 style="padding-left:6px">My journey</h1>`,body:`<div class="empty">${spot('map')}<b>Earn a badge at every event you go to</b><div class="jstack" style="margin:6px 0 4px">${['photo','dance','outdoor'].map((id,i)=>stamp(club(id),true,64,i)).join('')}</div><button class="btn sm primary" data-a="signinOnly">Sign in to start</button></div>`};
  const tab=S.actTab;let inner='';
  if(tab==='journey'){inner=journeyBody()}
  else if(tab==='upcoming'){
    const ids=Object.keys(S.regs).sort((a,b)=>ev(a).sort-ev(b).sort);
    inner=ids.length?ids.map(id=>{const e=ev(id),m=S.regs[id];let k,t,to='event';
      if(e.cancelled&&m.status!=='cancelled'){k='bad';t='Cancelled'}
      else if(S.attended.has(id)){k='ok';t='Badge earned';to='stamped'}
      else if(m.status==='confirmed'){k='ok';t=e.changed?'Venue changed':'Going';to='pass'}
      else if(m.status==='waitlisted'){k='warn';t='Waitlist #'+m.pos}
      else if(m.status==='offer'){k='warn';t='Seat offered';to='offer'}
      else{k='';t='You cancelled'}
      const c=ec(e),d=dp(e);
      return `<button class="erow" data-go="${to}" data-id="${id}">${evCover(e,'thumb')}<span class="grow"><span class="tname" style="-webkit-line-clamp:1">${esc(e.title)}</span><span class="tmeta">${ic('cal')}<b style="color:var(--ink)">${d.dow} ${d.num} ${d.mon}</b> · ${e.time}</span><span class="row"><span class="pill ${k}">${t}</span></span></span>${ic('chev')}</button>`}).join('')
      :`<div class="empty">${spot('map')}<b>No plans yet</b><button class="btn sm primary" data-a="seeEvents">Browse events</button></div>`;
  } else if(tab==='applications'){
    const ids=Object.keys(S.apps);
    inner=ids.length?ids.map(id=>{const c=club(id),a=S.apps[id],steps=['Sent','Review','Result'],idx=1;
      return `<div class="card"><div class="row" style="flex-wrap:nowrap">${cover(c,'thumb')}<span class="grow"><b style="font-family:var(--display);font-size:18px">${esc(c.name)}</b><span class="meta">Core team application</span></span></div><div class="steps">${steps.map((s,i)=>`<div class="step ${i<idx?'done':i===idx?'now':''}"><i>${i<idx?'✓':i+1}</i>${s}</div>`).join('')}</div><span class="meta" style="text-align:center">Result by ${c.recruit.result}</span></div>`}).join('')
      :`<div class="empty">${spot('lamp')}<b>No applications</b><span class="meta">Look for the Recruiting tag</span></div>`;
  } else {
    const ids=[...S.saved];
    inner=ids.length?`<div class="stack" style="gap:14px">${ids.map(id=>erow(ev(id))).join('')}</div>`:`<div class="empty">${spot('green')}<b>Nothing saved</b></div>`;
  }
  return {nav:'activity',top:`<h1 style="padding-left:6px">My journey</h1>`,
  body:`<div class="seg">${[['journey','Journey'],['upcoming','Plans'],['applications','Applied'],['saved','Saved']].map(([v,l])=>`<button class="${tab===v?'on':''}" data-a="actTab" data-v="${v}">${l}</button>`).join('')}</div><div class="stack" style="gap:14px">${inner}</div>`};
};

/* rooms */
function roomRow(id){const c=club(id),ms=S.msgs[id]||[],last=ms[ms.length-1];
  return `<button class="li" data-a="openRoom" data-id="${id}">${cover(c,'',``,'width:52px;height:52px;border-radius:16px')}<span class="grow"><b>${esc(c.name)}</b><span class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${last?esc(last.who.split(' ')[0])+': '+esc(last.text):'Say hi'}</span></span>${S.rooms.has(id)?`<span class="pill acc">${ms.length}</span>`:'<span class="pill">Join</span>'}</button>`}
SCR.rooms=()=>{
  const ids=Object.keys(S.msgs).filter(k=>!k.includes(':'));
  if(!S.signedIn) return {nav:'rooms',top:`<h1 style="padding-left:6px">Rooms</h1>`,body:`${scene('chat','',`${ic('lock')} IITG students only`)}<div class="row" style="justify-content:space-between;flex-wrap:nowrap"><b style="font-family:var(--display);font-size:22px">Talk to your clubs</b><button class="btn sm primary" data-a="signinOnly">Sign in</button></div><div class="stack">${ids.map(roomRow).join('')}</div>`};
  const joined=[...S.rooms],rest=[...new Set([...S.followed,...ids])].filter(id=>!S.rooms.has(id));
  return {nav:'rooms',top:`<h1 style="padding-left:6px">Rooms</h1>`,
  body:`${joined.length?`<div class="stack"><div class="sec"><b>Joined</b></div>${joined.map(roomRow).join('')}</div>`:scene('chat')}
  <div class="stack"><div class="sec"><b>${joined.length?'More rooms':'Popular rooms'}</b></div>${rest.map(roomRow).join('')}</div>`};
};
SCR.room=({id,team})=>{
  const key=team?'T:'+id:id,c=club(id),ms=S.msgs[key]||(S.msgs[key]=[]),joined=team||S.rooms.has(id),pin=ms.find(m=>m.pinned);
  if(team) return {top:`${backBtn}${cover(c,'',``,'width:38px;height:38px;border-radius:12px')}<span class="grow"><b>${esc(c.name)} team</b><span class="meta" style="font-size:12px">${ic('lock')} Members only</span></span>`,
  body:`${pin?`<div class="pinned">${ic('pin')}<span>${esc(pin.text)}</span></div>`:''}${msgList(ms,key)}`,
  composer:`<input class="input" id="chat" placeholder="Message the team" autocomplete="off" aria-label="Message"><button class="btn primary" data-a="send" data-id="${key}" aria-label="Send">${ic('send')}</button>`};
  if(!joined) return {bleed:true,
    body:`${hero(c,`<span class="pill">${ic('users')} ${c.members} members</span>`,`${esc(c.name)} room`)}
    <div class="rules"><div class="rule">${ic('heart')}Be kind</div><div class="rule">${ic('x')}No spam or selling</div><div class="rule">${ic('shield')}Moderated by club heads</div><div class="rule">${ic('flag')}Report, privately</div></div>
    ${pin?`<div class="pinned">${ic('pin')}<span>${esc(pin.text)}</span></div>`:''}`,
    foot:`<button class="btn primary" data-a="joinRoom" data-id="${id}">Agree & join</button>`};
  return {top:`${backBtn}${cover(c,'',``,'width:38px;height:38px;border-radius:12px')}<span class="grow"><b>${esc(c.name)}</b><span class="meta" style="font-size:12px">${c.members+1} members</span></span><button class="ib" data-a="leaveRoom" data-id="${id}" aria-label="Leave room">${ic('x')}</button>`,
  body:`${pin?`<div class="pinned">${ic('pin')}<span>${esc(pin.text)}</span></div>`:''}${msgList(ms,id)}`,
  composer:`<input class="input" id="chat" placeholder="Message" autocomplete="off" aria-label="Message"><button class="btn primary" data-a="send" data-id="${id}" aria-label="Send">${ic('send')}</button>`};
};

const msgList=(ms,key)=>`<div class="msgs">${ms.filter(m=>!m.pinned).map(m=>{const hid=S.reported.has(key+':'+m.id);
    return `<div class="msg ${m.me?'me':''} ${hid?'hidden':''}">${m.me?'':av(m.who)}<div class="mb">${m.me?'':`<span class="who">${esc(m.who)}${m.role?` <span class="pill acc" style="padding:1px 7px">${m.role}</span>`:''}</span>`}
    <div class="bubble">${hid?'Reported · hidden for you':esc(m.text)}${!m.me&&!hid?`<button class="more" data-a="msgMenu" data-id="${key}" data-v="${m.id}" aria-label="Message options">${ic('more')}</button>`:''}</div></div></div>`}).join('')}</div>`;

/* ---------- onboarding: splash → intro → role → email → OTP → profile → (student) interests → recommendations | (member) your club ---------- */
const prog=n=>`<div class="prog" aria-label="Step ${n} of 4">${[1,2,3,4].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}<span>${n}/4</span></div>`;
SCR.splash=()=>({bare:true,body:`<div class="splash"><img class="float" src="img/interests.webp" alt=""><div class="logo">Campus<span>Connect</span></div><p>Find your place at IITG</p><div class="dots"><i></i><i></i><i></i></div></div>`});
const SLIDES=[['circle','Find your people','22 clubs. One place.'],['quiz','Never miss a moment','Events, auditions and deadlines, all here.'],['chat','Talk to your clubs','Chat rooms with members and organizers.']];
SCR.intro=()=>{const [img,t,s]=SLIDES[S.slide],last=S.slide===SLIDES.length-1;
  return {bare:true,body:`<div class="intro"><button class="skip" data-a="toRole">Skip</button><div class="iart"><img src="img/${img}.webp" alt=""></div>
  <div class="itext"><div class="idots">${SLIDES.map((_,i)=>`<button class="${i===S.slide?'on':''}" data-a="slide" data-v="${i}" aria-label="Slide ${i+1}"></button>`).join('')}</div><h2>${t}</h2><p>${s}</p>
  <button class="btn primary" style="width:100%" data-a="${last?'toRole':'nextSlide'}">${last?"Get started":'Next'} ${ic('arrow')}</button></div></div>`};
};
SCR.role=()=>({top:`${backBtn}<h1></h1>`,
  body:`<h2 class="h2">How are you joining?</h2>
  <div class="stack" style="gap:14px">
   <button class="rcard ${S.role==='student'?'on':''}" data-a="pickRole" data-v="student"><img src="img/photo.webp" alt=""><span class="rt"><b>I'm exploring</b><span>Fresher, or not in a club yet</span></span><span class="rchk">${ic('check')}</span><span class="rtags"><span>${ic('search')}Discover</span><span>${ic('ticket')}Join events</span></span></button>
   <button class="rcard ${S.role==='member'?'on':''}" data-a="pickRole" data-v="member"><img src="img/writing.webp" alt=""><span class="rt"><b>I'm a club member</b><span>Plan and update with your team</span></span><span class="rchk">${ic('check')}</span><span class="rtags"><span>${ic('chat')}Team chat</span><span>${ic('edit')}Propose changes</span></span></button>
  </div>
  <button class="link" style="align-self:center;padding:6px" data-a="lookAround">Just look around</button>`,
  foot:`<button class="btn primary" data-a="startOnb" ${S.role?'':'disabled'}>Continue</button>`});
SCR.recos=()=>{let recs=recommend();if(!recs.length)recs=[...CLUBS].sort((a,b)=>b.members-a.members).slice(0,6);
  const n=recs.filter(c=>S.followed.has(c.id)).length;
  return {top:`${backBtn}${prog(4)}`,
  body:`<h2 class="h2">Clubs you'll like</h2>
  <div class="grid2">${recs.map(c=>{const f=S.followed.has(c.id);return `<button class="tile" data-a="follow" data-id="${c.id}">${cover(c,'',`<span class="onc ${f?'ok':''} tag" style="top:auto;bottom:8px">${f?ic('check')+' Following':'+ Follow'}</span>`)}<span class="tname" style="-webkit-line-clamp:1">${esc(c.name)}</span><span class="tmeta">${ic('users')}${c.members} · ${c.hours}/wk</span></button>`}).join('')}</div>`,
  foot:`<button class="btn primary" data-a="finishOnb">${n?`Follow ${n} & enter`:'Enter CampusConnect'} ${ic('arrow')}</button>`};
};
SCR.pickclub=()=>({top:`${backBtn}${prog(3)}`,
  body:`<h2 class="h2">Your clubs</h2><span class="pill ok" style="align-self:flex-start">${ic('shield')} Found on club rosters</span>
  <div class="stack" style="gap:12px">${ROSTER.map(([id,role,head])=>{const c=club(id),on=S.pick.has(id);return `<button class="opt ${on?'on':''}" style="padding:10px" data-a="pickTeam" data-v="${id}">${cover(c,'thumb')}<span class="grow"><b>${esc(c.name)}</b><span class="meta">${role} · added by ${head}</span></span><span class="sw ${on?'on':''}"></span></button>`}).join('')}</div>
  <div class="card" style="flex-direction:row;align-items:center">${spot('lamp',64)}<span class="grow"><b>Club missing?</b><span class="meta">Ask its head to add you</span></span><button class="btn sm" data-a="reqAccess">Request</button></div>`,
  foot:`<button class="btn primary" data-a="finishMember" ${S.pick.size?'':'disabled'}>Open team space ${ic('arrow')}</button>`});

/* ---------- club member: team space, proposals ---------- */
const KIND={venue:['pin','Change an event'],new:['cal','New event'],page:['edit','Club page'],recruit:['star','Recruitment']};
const pstat=p=>p.status==='live'?['ok','Live']:p.status==='declined'?['bad','Declined']:['warn','In discussion'];
function ensureMember(){ensureUser();S.role='member';if(!S.teamClubs.length){S.teamClubs=['photo','music'];S.activeClub='photo'}}
SCR.team=()=>{ensureMember();const c=club(S.activeClub),ps=S.props.filter(p=>p.club===c.id),open=ps.filter(p=>p.status==='discussing'),evs=clubEvents(c.id).filter(e=>!e.cancelled),T=S.msgs['T:'+c.id]||[];
  return {nav:'team',top:`<span class="brand" style="font-size:20px">Team</span>${S.teamClubs.length>1?`<button class="chip" data-a="switchTeam">${esc(c.name.split(' ')[0])} ${ic('chev')}</button>`:''}`,
  body:`<div class="tmhead">${cover(c,'',`<span class="onc ${S.memberRole==='head'?'warn':''}" style="position:absolute;left:12px;top:12px"><i></i>${S.memberRole==='head'?'Club head':'Member'}</span>`)}<div><b>${esc(c.name)}</b><span class="meta">${c.members} followers · ${evs.length} upcoming</span></div></div>
  <div class="stack"><div class="sec"><b>Propose a change</b></div><div class="ktiles">${Object.entries(KIND).map(([k,[i,l]])=>`<button class="kt" data-a="newProp" data-v="${k}"><span class="ji">${ic(i)}</span>${l}</button>`).join('')}</div></div>
  <div class="stack"><div class="sec"><b>Proposals</b>${open.length?`<span class="pill warn">${open.length} open</span>`:''}</div>${ps.map(propRow).join('')}</div>
  <button class="card" style="flex-direction:row;align-items:center" data-a="teamChat"><span class="ji" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#F45B4F;color:#fff">${ic('lock')}</span><span class="grow"><b>Team chat</b><span class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${T.length?esc(T[T.length-1].who.split(' ')[0])+': '+esc(T[T.length-1].text):'Members only'}</span></span><span class="avs">${[...new Set(T.map(m=>m.who))].slice(0,3).map(p=>av(p,26)).join('')}</span></button>
  ${evs.length?`<div class="stack"><div class="sec"><b>Our events</b></div><div class="hs">${evs.map(poster).join('')}</div></div>`:''}`};
};
function propRow(p){const [k,t]=pstat(p),[i]=KIND[p.kind];
  return `<button class="prow" data-go="proposal" data-id="${p.id}"><span class="ji">${ic(i)}</span><span class="grow"><b>${esc(p.title)}</b><span class="tmeta">${av(p.by,20)} ${esc(p.by.split(' ')[0])} · ${p.t}</span></span><span class="stack" style="gap:4px;align-items:flex-end"><span class="pill ${k}">${t}</span><span class="tmeta">${ic('check')}${p.up} ${ic('chat')}${p.comments.length}</span></span></button>`}
SCR.proposal=({id})=>{const p=S.props.find(x=>x.id===id),c=club(p.club),[k,t]=pstat(p),[i,l]=KIND[p.kind],v=S.voted[id],head=S.memberRole==='head';
  const stg=p.status==='live'?4:p.status==='declined'?3:2;
  return {top:`${backBtn}<h1>Proposal</h1>`,
  body:`<div class="row" style="flex-wrap:nowrap;gap:12px"><span class="ji big">${ic(i)}</span><span class="grow"><span class="meta">${l} · ${esc(c.name)}</span><b style="font-family:var(--display);font-size:22px;line-height:1.1">${esc(p.title)}</b></span></div>
  <div class="row"><span class="pill ${k}">${t}</span><span class="tmeta">${av(p.by,22)} ${esc(p.by)} · ${p.t}</span></div>
  <div class="card">${p.before?`<div class="row" style="flex-wrap:nowrap;gap:10px"><div class="fact" style="flex:1;background:var(--surface);opacity:.65"><b style="text-decoration:line-through;font-size:14px">${esc(p.before)}</b><span>Now</span></div>${ic('arrow')}<div class="fact" style="flex:1;background:var(--surface);box-shadow:0 0 0 2px var(--accent)"><b style="font-size:14px">${esc(p.after)}</b><span>Proposed</span></div></div>`
    :`<div class="fact" style="background:var(--surface);box-shadow:0 0 0 2px var(--accent)">${ic(i)}<b>${esc(p.after)}</b><span>New</span></div>`}<span class="meta">${esc(p.reason)}</span></div>
  <div class="steps"><div class="step done"><i>1</i>Proposed</div><div class="step ${stg>2?'done':'now'}"><i>2</i>Team talks</div><div class="step ${p.status==='live'?'done':p.status==='declined'?'now':''}"><i>3</i>Head ${p.status==='declined'?'declined':'approves'}</div><div class="step ${p.status==='live'?'done':''}"><i>4</i>Live</div></div>
  ${p.status==='discussing'?`<div class="join2"><button class="jt ${v==='up'?'hot':''}" data-a="vote" data-id="${id}" data-v="up"><span class="ji">${ic('check')}</span><b>${p.up}</b><span>Looks good</span></button><button class="jt ${v==='down'?'hot':''}" data-a="vote" data-id="${id}" data-v="down"><span class="ji">${ic('alert')}</span><b>${p.down}</b><span>Needs work</span></button></div>`:''}
  <div class="stack"><div class="sec"><b>Discussion</b><span class="meta">${p.comments.length}</span></div>${p.comments.length?msgList(p.comments.map((m,j)=>({id:j,...m})),'P:'+id):'<span class="meta">No comments yet. Start the conversation.</span>'}</div>
  ${p.status==='discussing'&&!head?`<div class="banner acc">${ic('shield')}<span class="grow">Waiting for the club head<span>${esc(ROSTER.find(r=>r[0]===c.id)?.[2]||'Club head')} publishes once the team agrees</span></span></div>`:''}`,
  composer:p.status==='discussing'?`<input class="input" id="chat" placeholder="Add to the discussion" autocomplete="off" aria-label="Comment"><button class="btn primary" data-a="comment" data-id="${id}" aria-label="Send">${ic('send')}</button>`:'',
  foot:p.status==='discussing'&&head?`<button class="btn danger" data-a="decide" data-id="${id}" data-v="declined">Decline</button><button class="btn primary" data-a="decide" data-id="${id}" data-v="live">${ic('check')} Approve & publish</button>`:''};
};
SCR.propose=()=>{const c=club(S.activeClub),k=S.pk||'venue',[i,l]=KIND[k],evs=clubEvents(c.id).filter(e=>!e.cancelled);
  let f='';
  if(k==='venue') f=`<div class="stack"><span class="lbl">Which event?</span><div class="hs">${evs.map(e=>`<button class="opt ${S.pevent===e.id?'on':''}" style="width:auto;flex:none" data-a="pEvent" data-v="${e.id}">${evCover(e,'',``,'width:40px;height:40px;border-radius:10px')}<span>${esc(e.title)}</span></button>`).join('')}</div></div>
    <div class="stack"><span class="lbl">What changes?</span><div class="row">${['Venue','Time'].map(x=>`<button class="chip ${S.pfield===x?'on':''}" data-a="pField" data-v="${x}">${ic(x==='Venue'?'pin':'clock')}${x}</button>`).join('')}</div><input class="input" id="pv" placeholder="${S.pfield==='Venue'?'New place, e.g. Library steps':'New time, e.g. 8–10 AM'}"></div>`;
  else if(k==='new') f=`<input class="input" id="pt" placeholder="Event name"><input class="input" id="pv" placeholder="When, e.g. Sat 7 Nov · 5–7 PM"><input class="input" id="pp" placeholder="Where, e.g. Core 1 lab">`;
  else if(k==='page') f=`<textarea class="input" id="pv" placeholder="New club description">${esc(c.short)}</textarea>`;
  else f=`<div class="row">${['Open recruitment','Close recruitment'].map(x=>`<button class="chip ${S.pfield===x?'on':''}" data-a="pField" data-v="${x}">${x}</button>`).join('')}</div><input class="input" id="pv" placeholder="Deadline, e.g. Fri 13 Nov">`;
  return {top:`${backBtn}<h1>New proposal</h1>`,
  body:`<div class="ktiles">${Object.entries(KIND).map(([kk,[ii,ll]])=>`<button class="kt ${kk===k?'on':''}" data-a="newProp" data-v="${kk}" data-stay="1"><span class="ji">${ic(ii)}</span>${ll}</button>`).join('')}</div>
  <div class="stack">${f}<textarea class="input" id="pr" placeholder="Why? One line for your team" style="min-height:70px"></textarea><span class="err" id="perr" hidden>Fill in the details first.</span></div>
  <div class="row meta">${ic('users')} Your team discusses, ${esc(ROSTER.find(r=>r[0]===c.id)?.[2]||'the head')} publishes</div>`,
  foot:`<button class="btn primary" data-a="sendProp">${ic('send')} Send to team</button>`};
};

/* notifications + profile */
SCR.notifs=()=>({top:`${backBtn}<h1>Updates</h1>`,
  body:!S.signedIn?`<div class="empty">${spot('cups')}<b>No updates</b><button class="btn sm primary" data-a="signinOnly">Sign in</button></div>`
   :S.notifs.length?S.notifs.map(n=>`<button class="li" data-a="openNotif" data-v="${n.id}"><span class="bub" style="width:46px;height:46px;background:${n.col||'var(--accent)'}">${ic(n.icon)}</span><span class="grow"><b>${esc(n.title)}</b><span class="meta">${esc(n.text)}</span></span>${n.read?'':'<span class="ib" style="width:10px;height:10px;border-radius:50%;background:var(--danger)"></span>'}</button>`).join('')
   :`<div class="empty">${spot('cups')}<b>All caught up</b></div>`});
SCR.profile=()=>{
  if(!S.signedIn) return {nav:'profile',top:`<h1 style="padding-left:6px">Profile</h1>`,body:`${scene('idcard','Browsing as a guest')}<button class="btn primary" data-a="signinOnly">${ic('shield')} Sign in with IITG</button>
    <button class="li" data-go="personalise"><span class="bub" style="width:46px;height:46px;background:var(--accent)">${ic('spark')}</span><span class="grow"><b>Interests</b><span class="meta">${S.interests.size||'None'} picked</span></span>${ic('chev')}</button>`};

  <div class="stats"><button class="stat" data-a="root" data-v="activity">${ic('star')}<b>${badgeCount()}</b><span>Badges</span></button><div class="stat">${ic('heart')}<b>${S.followed.size}</b><span>Following</span></div><div class="stat">${ic('chat')}<b>${S.rooms.size}</b><span>Rooms</span></div></div>
  <div class="stack"><div class="sec"><b>Showcase</b><span class="meta">${S.pinned.length}/3 pinned</span></div>${S.pinned.length?`<div class="showcase">${S.pinned.map(id=>S.badges.find(b=>b.id===id)).filter(Boolean).map(b=>`<button class="scell" data-go="badgeview" data-id="${b.id}">${medal(b,true,86)}</button>`).join('')}</div>`:`<span class="meta">Earn badges at events and pin your favourites here.</span>`}</div>

  <div class="stack"><div class="sec"><b>Notify me</b></div><div class="toggles">${tg('heart','New events from followed clubs',S.n1,'tn1')}${tg('bookmark','Saved events closing',S.n2,'tn2')}${tg('alert','Changes to my plans',true,'noop')}</div></div>

/* ---------- render ---------- */
const NAV=[['home','Explore','home'],['activity','Journey','star'],['rooms','Rooms','chat'],['profile','Profile','user']];
const NAVM=[['team','Team','users'],['home','Explore','home'],['rooms','Rooms','chat'],['profile','Profile','user']];
let splashT;
function render(top){
  const r=cur(),out=SCR[r.s](r.p||{}),ph=document.getElementById('phone');
  const prev=ph.querySelector('.scroll'),st=prev&&!top?prev.scrollTop:0;
  const navs=S.role==='member'?NAVM:NAV;
  ph.innerHTML=`<div class="sb ${out.bare?'cream':''}"><span>9:41</span><span>IITG Wi-Fi</span></div>
  ${out.top!==undefined?`<div class="top">${out.top}</div>`:''}
  <div class="scroll ${out.bleed?'bleed':''} ${out.bare?'bare':''}">${out.body}</div>
  ${out.composer?`<div class="composer">${out.composer}</div>`:''}
  ${out.foot?`<div class="foot">${out.foot}</div>`:''}
  ${out.nav?`<nav class="nav">${navs.map(([s,l,i])=>`<button class="${out.nav===s?'on':''}" data-a="root" data-v="${s}">${ic(i)}<span>${l}</span>${s==='activity'&&Object.values(S.regs).some(m=>m.status==='offer')?'<span class="dot"></span>':''}</button>`).join('')}</nav>`:''}
  ${S.sheet?sheetHtml():''}

function applyDecision(p,st){p.status=st;if(st!=='live'){toast('Declined. The team is notified.');return}
  const c=club(p.club);
  if(p.kind==='venue'){const e=ev(p.ev);if(p.field==='Time'){e.time=p.after}else{e.prevVenue=e.venue;e.venue=p.after;e.changed=true}
    if(S.regs[e.id])notify({icon:'pin',col:c.c,title:'Event updated',text:`${e.title}: ${p.after}`,go:[p.field==='Time'?'event':'updates',{id:e.id}]})}
  else if(p.kind==='new'){const id='n'+(++S.seq),[dw,dn,mn]=(p.when.match(/^(\w{3}) (\d+) (\w{3})/)||[0,'Sat','7','Nov']).slice(1);
    S.ev.push({id,club:c.id,title:p.title,type:'Workshop',day:`${dw} ${dn} ${mn}`,time:(p.when.split('·')[1]||'5–7 PM').trim(),sort:1100+(+dn||7),venue:p.where,cap:30,taken:0,wl:0,deadline:'Day before, 6 PM',beginner:true,who:['All years'],bring:['Curiosity'],flow:['Intro','Hands-on','Wrap-up'],reg:'required',refp:'NW'})}
  else if(p.kind==='page'){c.short=p.after}
  else{c.recruit=p.title.startsWith('Open')?{open:true,deadline:p.deadline||'Fri 13 Nov',result:'Mon 16 Nov',steps:['Short form','Task','Chat']}:{open:false,next:'Jan 2027'}}
  toast('Published. Students see it now.')}

  <p class="status">Any <b>@iitg.ac.in</b> email + any 6 digits. Now: <b>${r.s.replace('_',' ')}</b> · ${S.signedIn?`<b>${esc(S.user.name)}</b>`:'<b>guest</b>'}${S.failNext?' · <b style="color:var(--danger)">next registration fails</b>':''}</p></div>
  <div class="gcard"><h3>Tasks</h3>${TASKS.map(([t,s],i)=>`<div class="task"><span class="n">0${i+1}</span><span>${t}</span><button class="btn sm" data-g="task" data-v="${s}">Start</button></div>`).join('')}</div>
  <div class="gcard"><h3>Play the organizer</h3><div class="sim"><button class="btn sm" data-g="sim" data-v="venue">${ic('pin')}Venue changes</button><button class="btn sm" data-g="sim" data-v="seat">${ic('ticket')}Seat opens</button><button class="btn sm" data-g="sim" data-v="cancel">${ic('x')}Cancel walk</button><button class="btn sm" data-g="sim" data-v="attend">${ic('star')}Mark attended</button><button class="btn sm ${S.failNext?'danger':''}" data-g="sim" data-v="fail">${ic('alert')}Fail next booking</button><button class="btn sm" data-g="sim" data-v="signin" ${S.signedIn?'disabled':''}>${ic('user')}Skip sign-in</button><button class="btn sm" data-g="sim" data-v="reset">Reset</button></div>
  <h3 style="margin-top:6px">Club side</h3><div class="sim"><button class="btn sm ${S.memberRole==='head'?'primary':''}" data-g="sim" data-v="head">${ic('shield')}${S.memberRole==='head'?'Club head: on':'Become club head'}</button><button class="btn sm" data-g="sim" data-v="approve">${ic('check')}Head approves next proposal</button></div></div>
  <div class="gcard"><h3>Jump to</h3><div class="jump">${JUMP.map(([g,items])=>`<h4>${g}</h4>`+items.map(([l,s,id])=>`<button class="${r.s===s?'cur':''}" data-g="jump" data-v="${s}" ${id?`data-id="${id}"`:''}>${l}</button>`).join('')).join('')}</div></div>`;
}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-g]');
  if(g){const v=g.dataset.v;
    if(g.dataset.g==='sim')SIM[v]();
    else if(g.dataset.g==='task'){fresh();root(v);toast('Fresh start')}
    else if(g.dataset.g==='jump'){if(SPECIAL[v])SPECIAL[v]();else if(g.dataset.id)at(['home'],[v,g.dataset.id]);else{S.searching=false;root(v)}}
    if(matchMedia('(max-width:880px)').matches)document.getElementById('phone').scrollIntoView({behavior:'smooth'});
    return}
  const t=e.target.closest('[data-a],[data-go]');if(!t||!document.getElementById('phone').contains(t))return;
  if(t.classList.contains('sheetbg')&&e.target.closest('[data-stop]'))return;
  if(t.dataset.go){go(t.dataset.go,{id:t.dataset.id});return}
  A[t.dataset.a]&&A[t.dataset.a](t);
});
/* mouse drag-to-scroll for every horizontal row (touch already swipes natively) */
let drag=null;
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;const r=e.target.closest('.hs,.chips');if(!r)return;drag={r,x:e.clientX,s:r.scrollLeft,moved:false}});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>5){drag.moved=true;drag.r.classList.add('drag')}if(drag.moved)drag.r.scrollLeft=drag.s-dx});
document.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;d.r.classList.remove('drag');if(d.moved){const stop=ev=>{ev.stopPropagation();ev.preventDefault()};document.addEventListener('click',stop,{capture:true,once:true});setTimeout(()=>document.removeEventListener('click',stop,{capture:true}),0)}});
document.addEventListener('focusin',e=>{if(e.target.id==='q'&&!S.searching&&cur().s==='home'){S.searching=true;S.focusQ=true;render(true)}});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;const r=document.getElementById('results');if(r)r.innerHTML=results()}
  if(e.target.id==='email')S.email=e.target.value;
  if(e.target.id==='otp'){S.otp=e.target.value.replace(/\D/g,'').slice(0,6);e.target.value=S.otp;document.getElementById('otpv').innerHTML=otpBoxes()}
  if(e.target.id==='cin'){S.sheet.code=e.target.value.replace(/\D/g,'').slice(0,4);S.sheet.err='';e.target.value=S.sheet.code;document.getElementById('cinv').innerHTML=cinBoxes()}
  if(e.target.id==='a1'){const x=document.getElementById('a1e');if(x)x.hidden=true}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.id==='chat'){const b=document.querySelector('[data-a="send"]'),c=document.querySelector('[data-a="comment"]');b?A.send(b):c&&A.comment(c)}
  if(e.target.id==='email')A.sendCode();
  if(e.target.id==='otp')A.verify();
  if(e.target.id==='cin')A.doCheckin();
});
render(true);
</script>
