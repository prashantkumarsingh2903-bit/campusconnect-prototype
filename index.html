<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCF6E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CampusConnect">
<meta name="description" content="CampusConnect v3.1 prototype: club discovery, a campus feed and rooms for IIT Guwahati students.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CampusConnect Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-sized app on the left, slim test guide on the right; stacks on narrow screens. Visual-first: colour covers carry identity, text stays short. */
:root{
  --page:#EFEBE3; --surface:#FFFFFF; --sunk:#F6F2EA; --ink:#1E1E1C; --muted:#6B655C; --line:#E9E3D8;
  --accent:#2A2622; --accent-ink:#FFFFFF; --accent-soft:#F1EBDF; --accent-text:#2A2622;
  --warm:#9A5B00; --warm-soft:#FFF0D6; --danger:#B42318; --danger-soft:#FDE8E6; --ok:#6B5536; --ok-soft:#F1E7D3;
  --frame:#1D2622;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0C110F; --surface:#121916; --sunk:#1A231F; --ink:#E8F0EC; --muted:#93A29C; --line:#25302C;
  --accent:#F1EBDF; --accent-ink:#1E1E1C; --accent-soft:#2E2A25; --accent-text:#F1EBDF;
  --warm:#F2B457; --warm-soft:#3A2A0F; --danger:#F2867B; --danger-soft:#3B1714; --ok:#E3CFA6; --ok-soft:#332A1C;
  --frame:#000000; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0C110F; --surface:#121916; --sunk:#1A231F; --ink:#E8F0EC; --muted:#93A29C; --line:#25302C;
  --accent:#F1EBDF; --accent-ink:#1E1E1C; --accent-soft:#2E2A25; --accent-text:#F1EBDF;
  --warm:#F2B457; --warm-soft:#3A2A0F; --danger:#F2867B; --danger-soft:#3B1714; --ok:#E3CFA6; --ok-soft:#332A1C;
  --frame:#000000; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;max-width:1080px;margin:0 auto;align-items:start}
@media (max-width:880px){.wrap{grid-template-columns:minmax(0,1fr);gap:24px}}

.phone{width:390px;height:800px;border:10px solid var(--frame);border-radius:44px;background:var(--surface);overflow:hidden;position:relative;display:flex;flex-direction:column;min-width:0}
@media (max-width:880px){.phone{width:100%;height:min(800px,calc(100svh - 48px));border-width:1px;border-color:var(--line);border-radius:20px}}
.sb{flex:none;display:flex;justify-content:space-between;padding:10px 26px 4px;font-size:12px;font-weight:600}
@media (max-width:880px){.sb{display:none}}
/* app mode (inside the Android app): the prototype fills the screen, no frame, no test guide */
html.app body{padding:0;overflow:hidden;background:var(--surface)}
html.app .wrap{display:block;max-width:none}
html.app .phone{width:100vw;height:100vh;height:100dvh;border:0;border-radius:0}
html.app .sb,html.app .guide{display:none}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 8px;min-height:52px}
.top h1{font-family:var(--display);font-size:18px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;flex:1;padding-left:4px}
.brand span{color:#A07D52}
.ib{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;position:relative;flex:none;background:var(--sunk)}
.ib .dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:#2A2622;color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.fab{position:absolute;top:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);color:#121A17;display:grid;place-items:center;z-index:3}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 28px;display:flex;flex-direction:column;gap:22px}
.scroll.bleed{padding-top:0}
.scroll>*{flex-shrink:0}
.foot{flex:none;display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.foot .btn{flex:1}
.nav{flex:none;display:grid;grid-auto-flow:column;grid-auto-columns:1fr;border-top:1px solid var(--line);padding:8px 4px 10px;background:var(--surface)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.nav button.on{color:var(--accent-text)}
.nav button.on svg{stroke-width:2.4}
.nav .dot{position:absolute;top:0;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:#A07D52}

.h2{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.02em}
.sec{display:flex;justify-content:space-between;align-items:baseline}
.sec b{font-family:var(--body);font-size:17px;font-weight:800}
.sec button{font-size:13px;font-weight:700;color:var(--accent-text);padding:12px 0 12px 12px;margin:-12px 0}
.meta{color:var(--muted);font-size:13px}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}

.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;height:48px;padding:0 16px;border-radius:16px;font-weight:700;text-align:center;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{background:var(--warm-soft);color:var(--warm);border-color:transparent}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.sm{height:34px;padding:0 12px;border-radius:11px;font-size:13px}
.btn.icon{flex:0 0 48px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;height:44px;padding:0 14px;border-radius:18px;background:var(--sunk);font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surface)}
.chip svg{width:16px;height:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warm-soft);color:var(--warm)}.pill.bad{background:var(--danger-soft);color:var(--danger)}.pill.acc{background:var(--accent-soft);color:var(--accent-text)}
.input{height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--sunk);padding:0 16px;font:inherit;font-size:16px;color:var(--ink);width:100%}
textarea.input{height:auto;min-height:92px;padding:12px 16px;resize:vertical}
.err{color:var(--danger);font-size:13px;font-weight:600}
.lbl{font-size:13px;font-weight:700}
.search{display:flex;align-items:center;gap:10px;height:50px;border-radius:16px;background:var(--sunk);padding:0 14px;color:var(--muted);flex:1;min-width:0}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15.5px;color:var(--ink);outline:none;height:100%}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:14px;padding:4px}
.seg button{height:44px;border-radius:11px;text-align:center;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* covers: each club owns a colour + illustration */
.cover{position:relative;overflow:hidden;background:var(--c);color:#fff;border-radius:18px;isolation:isolate;flex:none}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 12% 0%,rgba(255,255,255,.3),transparent 55%),radial-gradient(rgba(255,255,255,.16) 1.2px,transparent 1.4px) 0 0/13px 13px}
.cover .art{position:absolute;right:-8%;bottom:-16%;width:70%;max-width:220px;aspect-ratio:1;fill:none;stroke:#fff;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;transform:rotate(-10deg);opacity:.92;z-index:-1}
/* illustrated covers: the club illustrations' own cream ground, fixed in both themes */
.cover.ill{background:var(--bgimg,none) 0 0/8000% no-repeat,#FCF6E8;color:#1E1E1C}
.cover.ill::before{display:none}
.cover.ill>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:-1}
.cover.ill .art{inset:auto;left:50%;top:52%;right:auto;bottom:auto;width:min(48%,110px);transform:translate(-50%,-50%) rotate(-6deg);stroke:#1E1E1C;stroke-width:1.25;opacity:1;z-index:-1}
.cover.ill .blob{position:absolute;left:50%;top:50%;width:min(40%,92px);aspect-ratio:1;border-radius:50%;transform:translate(-22%,-62%);z-index:-2}
.cover.ill .dash{position:absolute;right:16%;top:16%;width:22px;height:22px;z-index:-1;fill:none;stroke:#1E1E1C;stroke-width:2;stroke-linecap:round}
.cover.hero{margin:0 -16px;border-radius:0 0 28px 28px;height:180px}
.spr{position:absolute;left:50%;top:50%;height:94%;aspect-ratio:1;transform:translate(-50%,-50%);background:url(img/objects.webp) var(--x) var(--y)/300% 200% no-repeat;z-index:-1}
.spot{aspect-ratio:1;border-radius:32px;background:url(img/objects.webp) var(--x) var(--y)/300% 200% no-repeat,#FCF6E8}
.scene{position:relative;display:block;width:100%;border-radius:22px;background:#FCF6E8;overflow:hidden;flex:none}
.scene img{display:block;width:100%;height:auto}
.scene .stxt{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:42%;color:#1E1E1C;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.05;text-align:left}
.scene .onc{position:absolute;left:12px;bottom:12px;background:#2A2622}
/* journey: stamps are perforated club roundels in the illustrations' palette */
.stamp{--s:84px;width:var(--s);height:var(--s);flex:none;border-radius:50%;padding:calc(var(--s)*.06);background:#FCF6E8;border:2.5px dashed var(--c);transform:rotate(var(--r));position:relative;display:block;box-shadow:0 0 0 calc(var(--s)*.03) #FCF6E8}
.stamp .sin{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;border:0;background:#FCF6E8}
.stamp img{width:100%;height:100%;object-fit:cover;transform:scale(1.18)}
.stamp.locked{border-color:#C9C2B3}
.stamp.locked img{filter:grayscale(1);opacity:.28}
.stamp .lk{position:absolute;inset:0;display:grid;place-items:center;color:#6E6859}
.stamp .lk svg{width:calc(var(--s)*.26);height:calc(var(--s)*.26)}
.jhero{display:flex;align-items:center;gap:8px;padding:16px;border-radius:22px;background:#FCF6E8;color:#1E1E1C}
.jhero .meta{color:#6E6859}
.jl{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.jl b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.jstack{display:flex}
.jstack .stamp{margin-left:-22px}.jstack .stamp:first-child{margin-left:0}
.trynext{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(160,125,82,.1);width:100%}
.trynext b{font-size:15px}
.bprog{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bp{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:18px;background:var(--sunk);overflow:hidden;isolation:isolate;min-height:96px}
.bp img{position:absolute;right:-10px;bottom:-12px;width:58%;opacity:.35;filter:grayscale(1);z-index:-1}
.bp.on{background:#FCF6E8;color:#1E1E1C}
.bp.on img{opacity:1;filter:none}
.bp b{font-family:var(--display);font-size:16px;font-weight:800}
.bp>span:not(.bar):not(.tick){font-size:12px;font-weight:700;color:var(--muted)}
.bp.on>span:not(.bar):not(.tick){color:#6E6859}
.bp .bar{width:60%;height:6px;margin-top:auto}
.bp .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:#2A2622;color:#fff;display:grid;place-items:center}
.bp .tick svg{width:13px;height:13px;stroke-width:3}
.badge{flex:none;width:112px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 12px;border-radius:18px;background:var(--sunk);text-align:center;position:relative;overflow:hidden}
.badge .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);border:2px dashed transparent}
.badge .medal svg{width:26px;height:26px}
.badge.on{background:#FCF6E8;color:#1E1E1C}
.badge.on .medal{background:#2A2622;color:#fff;box-shadow:0 0 0 4px rgba(160,125,82,.18)}
.badge b{font-size:13.5px;margin-top:4px}
.badge span{font-size:12px;font-weight:700;color:var(--muted)}
.badge.on span{color:#6E6859}
.badge i{position:absolute;left:0;bottom:0;height:4px;background:#2A2622}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}
.scell{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;font-weight:700;position:relative}
.scell em{position:absolute;top:0;right:12%;background:#2A2622;color:#fff;font-style:normal;font-size:12px;padding:2px 6px;border-radius:999px}
.otp.c4{grid-template-columns:repeat(4,1fr);max-width:260px;margin:0 auto;width:100%}
@media (prefers-reduced-motion: no-preference){.stampin .stamp{animation:thunk .7s cubic-bezier(.2,1.4,.4,1) both}}
@keyframes thunk{0%{opacity:0;transform:scale(2.2) rotate(-25deg)}60%{opacity:1;transform:scale(.94) rotate(var(--r))}100%{transform:scale(1) rotate(var(--r))}}
/* event badges: medallion + ribbon; club tiers reward repeat visits */
.medal2{display:inline-flex;flex-direction:column;align-items:center;position:relative;width:var(--s);padding-bottom:calc(var(--s)*.12)}
.medal2 .rib{position:absolute;bottom:0;left:50%;transform:translateX(-50%);max-width:calc(var(--s)*1.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--c);color:#fff;font-size:max(10px,calc(var(--s)*.12));font-weight:800;padding:calc(var(--s)*.035) calc(var(--s)*.1);border-radius:6px;box-shadow:0 2px 6px rgba(80,50,20,.18);letter-spacing:.01em}
.grab{flex:none;width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ctier{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:18px;background:var(--sunk)}
.ctier .grow{gap:5px}.ctier .bar{height:6px;width:100%}
.tierpill{display:inline-flex;align-items:center;gap:4px;background:var(--t);color:#fff;font-size:12px;font-weight:800;padding:3px 9px;border-radius:999px}
.tierpill svg{width:12px;height:12px}
.showcase{display:flex;justify-content:space-around;gap:8px;padding:16px 8px;border-radius:20px;background:#FCF6E8}
.scell em svg{width:11px;height:11px}
.stampin .medal2 .rib{animation:none}
/* v2: explore rows, club profile, action hub, profile */
.nrow{gap:12px}.nrow .tile{flex:none;width:152px;scroll-snap-align:start}.nrow .tile .cover{height:122px}
.pickint{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:16px;background:var(--accent-soft);color:var(--accent-text);width:100%;text-align:left}
.pickint .grow span{font-size:12.5px;opacity:.85}
.about{font-size:16.5px;line-height:1.55}
.joinbox{display:flex;flex-direction:column;gap:10px;padding:16px;border-radius:20px;background:#FCF6E8;color:#1E1E1C}
.joinbox .meta{color:#6E6859}.joinbox b{font-size:16px}
.joinbox .sig{font-size:14px;color:#6E6859;font-style:italic;line-height:1.45}
.joinbox.done{flex-direction:row;align-items:center;background:var(--ok-soft);color:var(--ok)}
.joinbox.done .grow span{font-size:13px}
.blist{display:flex;flex-direction:column;gap:9px;margin:0;padding:0;list-style:none}
.blist li{display:flex;gap:10px;align-items:flex-start;font-size:15px;line-height:1.4}
.blist li svg{color:var(--accent-text);margin-top:1px;width:18px;height:18px}
.proj{display:flex;flex-direction:column;gap:2px;padding:12px 14px;border-radius:14px;background:var(--sunk)}
.act{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:var(--surface);box-shadow:0 1px 3px rgba(80,50,20,.08),0 4px 14px rgba(80,50,20,.06)}
.act .thumb{width:52px;height:52px;border-radius:14px}
.act.warn{background:var(--warm-soft)}
.act b{font-size:14.5px;line-height:1.25}
.act .grow{gap:2px}
.phead{display:flex;align-items:center;gap:14px}
.phead b{font-family:var(--display);font-size:22px;font-weight:800;display:block}
.lockf{display:flex;align-items:center;gap:10px;padding:12px 14px;border-radius:14px;background:var(--sunk);color:var(--muted)}
.mail{font-family:var(--mono);font-size:13.5px;user-select:all;word-break:break-all}
/* v3: feed + hangout rooms */
.compose{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:18px;background:var(--sunk);width:100%;color:var(--muted);font-weight:600;text-align:left}
.compose .av{margin:0;border:0}
.post{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:22px;background:var(--surface);box-shadow:0 1px 3px rgba(80,50,20,.08),0 6px 18px rgba(80,50,20,.06)}
.phd{display:flex;align-items:center;gap:8px}.phd .li{flex:1;min-width:0}.phd .av{margin:0;border:0}
.ptext{font-size:15.5px;line-height:1.5;white-space:pre-wrap}
.pimg{display:block;width:100%}.pimg .cover{height:230px;border-radius:16px}
.pact{display:flex;gap:20px;padding-top:2px}
.pact button{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:13.5px;color:var(--muted)}
.pact button.on{color:var(--accent-text)}.pact button.on svg{fill:currentColor}
.hcard{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:20px;background:var(--surface);box-shadow:0 1px 3px rgba(80,50,20,.08),0 6px 18px rgba(80,50,20,.06);width:100%;text-align:left}
.hcard .grow{gap:5px}.hcard b{font-size:15.5px;line-height:1.25}.hcard .av,.hinfo+.row .av{border-color:var(--surface)}
.hinfo{display:flex;gap:14px;align-items:flex-start;padding:14px;border-radius:20px;background:#FCF6E8;color:#1E1E1C}
.hinfo .grow{gap:4px}.hinfo .tmeta{color:#6E6859}.hinfo b{font-family:var(--display);font-size:20px;font-weight:800;line-height:1.1}
.chip .av{margin:0;border:0}
/* v4: people, media posts, club posts */
.headline{font-size:13.5px;font-weight:600;color:var(--ink);margin-top:3px;line-height:1.35}
.nets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nets>*{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:14px;background:var(--sunk);font-size:12px;color:var(--muted);font-weight:600}
.nets b{font-family:var(--display);font-size:19px;color:var(--ink)}
.grow1{flex:1}
.mini2{flex:none;width:80px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;text-align:center}
.pmedia{display:grid;gap:4px;border-radius:16px;overflow:hidden}

.lrow{display:flex;align-items:center;gap:12px;padding:12px 14px;width:100%;text-align:left;min-height:60px}
.lrow+.lrow{border-top:1px solid var(--line)}.lrow .grow{gap:1px;min-width:0}.lrow .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lrow .ji{background:var(--surface)}
.wrules{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.wrules li{display:flex;gap:10px;align-items:flex-start;font-size:14.5px;line-height:1.4}.wrules svg{flex:none;width:18px;height:18px;margin-top:1px;color:var(--muted)}
.cgc{display:flex;flex-direction:column;gap:12px;padding:14px;border-radius:18px;background:var(--sunk)}
.cga{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.cgb{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:10px 4px;border-radius:14px;background:var(--surface);font-size:12px;font-weight:700;min-height:66px;text-align:center}
.cgb svg{width:22px;height:22px}
/* event page as a message */
.emsg{display:flex;flex-direction:column;gap:14px}
.msubj{font-family:var(--display);font-size:24px;font-weight:800;line-height:1.15;margin:0;letter-spacing:-.01em;text-wrap:balance}
.mfrom{display:flex;gap:12px;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid var(--line);width:100%;text-align:left}
.mfrom .grow{gap:1px;min-width:0}.mfrom .meta{font-size:13px;overflow-wrap:anywhere}
.mwhen{display:flex;flex-direction:column;border-radius:14px;background:var(--sunk);overflow:hidden}
.mwhen>div{display:flex;align-items:center;gap:10px;padding:4px 6px 4px 14px;min-height:52px}
.mwhen>div+div{border-top:1px solid var(--line)}
.mwhen span{flex:1;min-width:0;font-size:14.5px}.mwhen>div>svg{color:var(--muted)}
.mwhen .link{font-size:13.5px;font-weight:700;padding:0 8px}
.cover.mimg{height:160px;border-radius:14px}
.mbody{display:flex;flex-direction:column;gap:12px}.mbody p{margin:0;white-space:pre-line}.mbody .msign{font-size:14px;color:var(--muted)}
.mnote{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding-top:12px;border-top:1px solid var(--line)}.mnote svg{width:16px;height:16px}
/* Plans calendar */
.cal{display:flex;flex-direction:column;gap:4px;padding:10px 10px 12px;border-radius:20px;background:var(--sunk)}
.calh{display:flex;align-items:center;justify-content:space-between}.calh b{font-size:16px;font-weight:800}
.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center}
.cdow{font-size:12px;font-weight:700;color:var(--muted);padding:4px 0}
.cday{position:relative;display:grid;place-items:center;height:44px;border-radius:14px;font-size:15px;font-weight:600;text-align:center}
.cday i{position:absolute;bottom:5px;left:50%;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:#B9A27E}
.cday i.mine{background:#2A2622;width:6px;height:6px;margin-left:-3px}
.cday.past{color:var(--muted)}
.cday.today{box-shadow:inset 0 0 0 1.5px #2A2622;font-weight:800}
.cday.sel{background:#2A2622;color:#fff;font-weight:800}.cday.sel i{background:#FCF6E8}
.calev{padding:6px 6px 6px 14px}
.calbtn{flex:1;display:flex;flex-direction:column;gap:1px;text-align:left;min-width:0}.calbtn b{font-size:15px}
.calbtn .meta{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rmeta{display:flex;align-items:center;gap:4px;font-size:12.5px;font-weight:700;color:#6B5536}.rmeta svg{width:13px;height:13px}
.ib.on{background:#2A2622;color:#fff}
.calempty{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;border-radius:18px;background:var(--sunk);min-height:60px}
/* welcome: a tidy grid of clubs above the text card */
.wel{flex:1;display:flex;flex-direction:column;min-height:0;background:#FCF6E8;color:#1E1E1C}
.wtop{padding:18px 20px 0;font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;color:#1E1E1C}.wtop span{color:#8B6D4B}
.wart{flex:1;display:flex;align-items:center;padding:12px 20px 34px;min-height:0}
.wgrid{width:100%;display:grid;grid-template-columns:repeat(3,1fr);gap:12px 10px}
.wgrid figure{margin:0;display:flex;flex-direction:column;gap:6px;min-width:0}
.wgrid figure:nth-child(3n+2){position:relative;top:22px}
.wt{display:block;aspect-ratio:1;border-radius:22px;padding:8px;background:#FFFFFF;border:1px solid #E9E3D8;box-shadow:0 2px 4px rgba(42,38,34,.10),0 14px 28px rgba(42,38,34,.18)}
.wt img{width:100%;height:100%;object-fit:cover;display:block;border-radius:15px}
.wgrid figcaption{font-size:12.5px;font-weight:700;color:#6B655C;text-align:center}
@media (prefers-reduced-motion: no-preference){.wgrid figure{animation:rise .5s ease both}.wgrid figure:nth-child(2){animation-delay:.06s}.wgrid figure:nth-child(3){animation-delay:.12s}.wgrid figure:nth-child(4){animation-delay:.18s}.wgrid figure:nth-child(5){animation-delay:.24s}.wgrid figure:nth-child(6){animation-delay:.3s}}
.phead>.btn{flex:none;align-self:center}
.cnt{min-width:24px;height:24px;padding:0 7px;border-radius:12px;background:#2A2622;color:#fff;font-size:12px;font-weight:800;display:grid;place-items:center;flex:none}
/* onboarding */
.sb.cream{background:#FCF6E8;color:#1E1E1C}
.scroll.bare{padding:0;gap:0;background:#FCF6E8;color:#1E1E1C}
.splash{position:relative;flex:1;min-height:0;background:#1F1C19;overflow:hidden}
.splash video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.splash .skip{position:absolute;top:14px;right:16px;border:0;border-radius:999px;padding:7px 14px;background:rgba(31,28,25,.55);color:#FCF6E8;font:700 13px var(--body);cursor:pointer;backdrop-filter:blur(6px)}
.splash .skip:focus-visible{outline:2px solid #FCF6E8;outline-offset:2px}
@media (prefers-reduced-motion: no-preference){
 .iart img{animation:floatIn .6s both}}
@keyframes floatIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.25}}
.intro{flex:1;display:flex;flex-direction:column;position:relative}
.intro .skip{position:absolute;top:8px;right:16px;font-weight:700;font-size:14px;padding:8px;color:#1E1E1C;z-index:2}
.iart{flex:1;display:grid;place-items:center;padding:40px 16px 0;min-height:0}
.iart img{width:100%;max-height:100%;object-fit:contain}
.itext{background:var(--surface);color:var(--ink);border-radius:28px 28px 0 0;padding:22px 20px 20px;display:flex;flex-direction:column;gap:10px}
.itext h2{font-family:var(--display);font-size:30px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.05}
.itext p{color:var(--muted);font-size:15px;margin-bottom:8px}
.idots{display:flex;gap:6px}
.idots button{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s}
.idots button.on{width:26px;background:#2A2622}
.prog{flex:1;display:flex;align-items:center;gap:5px;padding-right:6px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:#2A2622}
.prog span{font-size:12px;font-weight:700;color:var(--muted);margin-left:4px}
.rcard{position:relative;display:grid;grid-template-columns:1fr;min-height:168px;border-radius:22px;background:#FCF6E8;overflow:hidden;padding:16px;color:#1E1E1C;isolation:isolate;text-align:left;width:100%}
.rcard img{position:absolute;right:-12px;bottom:-14px;width:52%;height:auto;z-index:-1}
.rcard .rt{display:flex;flex-direction:column;gap:4px;max-width:58%}
.rcard .rt b{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.05}
.rcard .rt span{font-size:13.5px;font-weight:600;color:#5E5A50}
.rcard .rtags{display:flex;flex-direction:column;gap:6px;align-self:end;margin-top:12px}
.rcard .rtags span{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:rgba(255,255,255,.85);color:#1E1E1C;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.rcard .rtags svg{width:13px;height:13px}
.rchk{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:2px solid #D9CFBC;display:grid;place-items:center;background:#fff;color:transparent}
.rcard.on{box-shadow:0 0 0 3px #2A2622;border-color:#2A2622}
.rcard.on .rchk{background:#2A2622;border-color:#2A2622;color:#fff}
.rchk svg{width:16px;height:16px;stroke-width:3}
/* team space */
.tmhead{display:flex;flex-direction:column;gap:8px}
.tmhead .cover{height:150px}
.tmhead b{font-family:var(--display);font-size:24px;font-weight:800;display:block}
.ktiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kt{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--sunk);font-weight:700;font-size:14px;border:2px solid transparent}
.kt.on{border-color:#2A2622;background:var(--surface)}
.ji{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:#EDE4D3;color:#2A2622;flex:none}
.ji.big{width:52px;height:52px;border-radius:16px}
.prow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1.5px solid var(--line);width:100%}
.prow .tmeta .av{border:0;margin:0;font-size:9px}
.htitle{display:flex;flex-direction:column;gap:8px;margin-top:-6px}
.thead{padding:12px 16px 14px;display:flex;flex-direction:column;gap:2px}
.thead b{font-family:var(--display);font-size:20px;font-weight:800;line-height:1.1}
.onc{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.32);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.onc i{width:7px;height:7px;border-radius:50%;background:#fff}
.onc.ok i{background:#5BE38E}.onc.warn i{background:#FFC24B}.onc.bad i{background:#FF8A80}
.dbadge{position:absolute;top:10px;left:10px;background:#fff;color:#1E1E1C;box-shadow:0 2px 8px rgba(80,50,20,.12);border-radius:12px;padding:5px 9px 4px;text-align:center;line-height:1;font-family:var(--display)}
.dbadge b{display:block;font-size:20px;font-weight:800}
.dbadge small{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none;scroll-snap-type:x mandatory;scroll-padding-inline:16px}
.hs::after{content:"";flex:0 0 4px}
.poster{flex:none;width:210px;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start}
.poster .cover{height:170px}
.poster .onc{position:absolute;left:10px;bottom:10px}
.tname{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tmeta{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:4px}
.tmeta svg{width:14px;height:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .cover{height:140px}
.tile .tag{position:absolute;top:8px;left:8px}
.erow{display:flex;gap:12px;align-items:center;width:100%}
.thumb{width:76px;height:76px;border-radius:18px}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
/* home search: full-height field with the illustrations' black outline */
.hsearch{flex:1 0 auto;display:flex;align-items:center;gap:6px;height:58px;padding:0 6px 0 16px;border:0;border-radius:20px;background:var(--sunk);min-width:0;transition:box-shadow .15s}
.hsearch:focus-within{box-shadow:0 0 0 2px #2A2622}
.top .hsearch{height:50px;flex:1 1 auto}
.hsearch label{flex:1;display:flex;align-items:center;gap:10px;min-width:0;height:100%;color:var(--ink)}
.hsearch input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none;height:100%}
.hsearch input::placeholder{color:var(--muted)}
.hf{width:44px;height:44px;border-radius:14px;background:#2A2622;color:#fff;display:grid;place-items:center;position:relative;flex:none}
.top .hf{width:44px;height:44px}
.hf .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:10px;font-weight:700;display:grid;place-items:center}
/* board cards: cream, black outline, illustration peeking from the corner */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard{position:relative;height:124px;border-radius:20px;background:#FCF6E8;overflow:hidden;padding:12px;color:#1E1E1C;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}
.bcard img{position:absolute;right:-18px;bottom:-16px;width:68%;height:auto;z-index:-1}
.bcard b{font-family:var(--display);font-size:18px;font-weight:800;line-height:1}
.bcard span{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;background:rgba(255,255,255,.85);color:#1E1E1C;border-radius:999px;padding:4px 9px;align-self:flex-start}
.bcard span svg{width:13px;height:13px}
.bcard:active{transform:translateY(1px)}
/* boards as one swipeable row of illustrated circles */
.brow{gap:14px;scroll-snap-type:x proximity;padding-top:4px;padding-bottom:4px;cursor:grab}
.brow.drag{cursor:grabbing;scroll-snap-type:none}
.bcirc{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;scroll-snap-align:start;user-select:none}
.bcirc .cc{width:80px;height:80px;border-radius:50%;background:#FCF6E8;overflow:hidden;display:grid;place-items:center;box-shadow:0 2px 10px rgba(80,50,20,.10);transition:transform .15s}
.bcirc .cc img{width:118%;height:118%;object-fit:cover;object-position:center 30%;pointer-events:none}
.bcirc .cc.all{background:var(--accent-soft);color:var(--accent-text)}
.bcirc .cc.all svg{width:26px;height:26px}
.bcirc:hover .cc{transform:translateY(-2px)}
.bcirc b{font-size:13.5px;margin-top:5px}
.bcirc span:last-child{font-size:12px;font-weight:600;color:var(--muted)}
.bub{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative}
.bub svg{width:28px;height:28px}
.bub.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}

/* facts and tiles */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--sunk);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fact svg{width:22px;height:22px;color:var(--accent-text)}
.fact b{font-size:15px;line-height:1.2}
.fact span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sunk);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.stat svg{width:22px;height:22px;color:var(--accent-text)}
.stat b{font-family:var(--display);font-size:18px;font-weight:800;line-height:1}
.stat span{font-size:12px;color:var(--muted)}
.join2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jt{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--line);min-width:0}
.jt .ji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.jt b{font-size:15px}
.jt span{font-size:12.5px;color:var(--muted)}
.jt.hot{border-color:var(--warm);background:var(--warm-soft)}
.jt.hot .ji{background:var(--warm);color:#fff}
.icchips{display:flex;flex-wrap:wrap;gap:8px}
.icchips span{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:600}
.icchips svg{width:16px;height:16px;color:var(--accent-text)}
.seats{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.seats i{aspect-ratio:1;border-radius:4px 4px 2px 2px;background:var(--line)}
.seats i.t{background:#D3C4A8}
.seats i.me{background:var(--ink)}
.big{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:#8C7B63}
.card{background:var(--sunk);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.banner{display:flex;gap:10px;padding:12px 14px;border-radius:16px;align-items:center;font-weight:700;font-size:14px;width:100%}
.banner.warn{background:var(--warm-soft);color:var(--warm)}.banner.bad{background:var(--danger-soft);color:var(--danger)}.banner.acc{background:var(--accent-soft);color:var(--accent-text)}
.banner .grow span{font-weight:500;font-size:13px}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;font-weight:600;position:relative}
.step i{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;color:var(--muted);z-index:1}
.step.done i{background:#D3C4A8;color:#2A2622}
.step.now i{background:var(--accent-soft);color:var(--accent-text);box-shadow:0 0 0 2px var(--accent)}
.step:not(:last-child)::after{content:"";position:absolute;top:17px;left:50%;width:100%;height:2px;background:var(--line)}
.avs{display:flex}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;border:2px solid var(--surface);margin-left:-8px;flex:none}
.avs .av:first-child{margin-left:0}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:4px 0}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:28px 12px}
.empty b{font-family:var(--display);font-size:20px}
.cluster{display:flex;justify-content:center}
.cluster .bub{width:64px;height:64px;margin-left:-14px;border:3px solid var(--surface)}
.cluster .bub:first-child{margin-left:0}
.cluster .bub:nth-child(even){transform:translateY(-10px)}

/* ticket */
.ticket{border-radius:22px;overflow:hidden;background:var(--surface);border:1.5px solid var(--line);position:relative}
.ticket .cover{border-radius:0;height:150px}
.tbody{padding:4px 16px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.ref{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.06em}
.qr{width:96px;height:96px;padding:6px;background:#fff;border-radius:10px}
.qr svg{display:block;width:100%;height:100%}
.okbig{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.okbig svg{width:38px;height:38px;stroke-width:2.6}

/* interests */
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.it{border-radius:18px;background:var(--sunk);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:700;text-align:center;position:relative;border:2px solid transparent}
.it .cover{width:100%;height:78px;border-radius:14px}
.it{padding:6px 6px 10px}
.it.on{border-color:#2A2622;background:var(--surface)}
.it .tick{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:#2A2622;color:#fff;display:grid;place-items:center}
.it .tick svg{width:13px;height:13px;stroke-width:3}

/* chat */
.msgs{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .av{margin:0;width:30px;height:30px;font-size:12px;border:0}
.mb{display:flex;flex-direction:column;gap:3px;min-width:0}
.msg.me .mb{align-items:flex-end}
.who{font-size:12px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.bubble{padding:9px 12px;border-radius:18px 18px 18px 6px;background:var(--sunk);font-size:14px;display:flex;gap:4px;align-items:flex-start}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-radius:18px 18px 6px 18px}
.bubble .more{opacity:.55}.bubble .more svg{width:16px;height:16px}
.msg.hidden .bubble{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-style:italic}
.pinned{display:flex;gap:10px;padding:10px 12px;border-radius:14px;background:var(--accent-soft);color:var(--accent-text);font-size:13.5px;align-items:center}
.composer{flex:none;display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.composer .input{height:46px;border-radius:23px}
.composer .btn{width:46px;height:46px;padding:0;border-radius:50%}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rule{background:var(--sunk);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.rule svg{width:22px;height:22px;color:var(--accent-text)}

.toast{position:absolute;left:16px;right:16px;bottom:86px;background:var(--ink);color:var(--surface);padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:none}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:8}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--sunk);font-weight:600;width:100%;border:2px solid transparent}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.sw{margin-left:auto;width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}.sw.on::after{left:19px}
.toggles{display:flex;flex-direction:column;gap:8px}
.tg{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--sunk);font-weight:600;font-size:14px;width:100%}
.tg svg{color:var(--accent-text)}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp span{height:58px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;font-family:var(--mono);font-size:24px;font-weight:700;border:2px solid transparent}
.otp span.f{border-color:var(--accent)}
.otpwrap{position:relative}
.otpwrap input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}

/* guide */
.guide{display:flex;flex-direction:column;gap:18px;min-width:0;max-width:520px}
.guide h2{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05;margin:0;letter-spacing:-.02em}
.guide .tag{font-family:var(--mono);font-size:12px;color:var(--accent-text);letter-spacing:.04em}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.gcard h3{margin:0;font-size:14px;font-weight:700}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.task:first-of-type{border-top:0}
.task .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sim{display:flex;flex-wrap:wrap;gap:8px}
.jump{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:2px 12px}
.jump h4{grid-column:1/-1;margin:8px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.jump button{font-size:13.5px;padding:3px 0}
.jump button.cur{color:var(--accent-text);font-weight:700}
.jump button:hover{text-decoration:underline}
.status{font-size:13px;color:var(--muted)}
.status b{color:var(--ink)}
@media (prefers-reduced-motion: reduce){.toast,.sw,.sw::after{transition:none}}
</style>

</head>

function qr(seed){let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;const n=21;let r='';
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;h=(h*1103515245+12345)>>>0;if((h>>16)&1)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`}
  return `<div class="qr"><svg viewBox="0 0 21 21" shape-rendering="crispEdges">${r}${fin(0,0)}${fin(14,0)}${fin(0,14)}</svg></div>`}

/* OTP: simulate the code arriving by message and filling itself in, like phone autofill */
let otpT=[];
function stopOtpSim(){otpT.forEach(clearTimeout);otpT=[];document.getElementById('smsbar')?.remove();S.otpSim=null}
function otpStatus(html,cls=''){const el=document.getElementById('otpst');if(el){el.className='otpst '+cls;el.innerHTML=html}}
function startOtpSim(){stopOtpSim();if(S.otp.length)return;
  const code=String(100000+Math.floor(Math.random()*900000)),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const T=(ms,f)=>otpT.push(setTimeout(()=>{if(cur().s==='otp'&&S.otpSim)f()},ms));
  S.otpSim='wait';
  T(reduce?200:1100,()=>{document.getElementById('phone').insertAdjacentHTML('beforeend',`<div class="smsbar" id="smsbar" role="status"><span class="smsic">${ic('chat')}</span><span class="grow"><b>Messages · now</b><span>${code} is your CampusConnect sign-in code. Don't share it.</span></span></div>`);otpStatus(`${ic('check')} Code received`,'got')});
  const start=reduce?400:2000,step=reduce?0:150,end=start+6*step;
  [...code].forEach((d,i)=>T(start+i*step,()=>{S.otp+=d;const inp=document.getElementById('otp');if(inp)inp.value=S.otp;const v=document.getElementById('otpv');v.innerHTML=otpBoxes();v.children[i].classList.add('pop');if(!i)otpStatus('Filling in your code…','got')}));
  T(end+250,()=>{document.getElementById('otpv').classList.add('ok');otpStatus(`${ic('check')} Verified`,'done');document.getElementById('smsbar')?.classList.add('out')});
  T(end+1050,()=>{S.otpSim=null;A.verify()});
}

  <div class="facts"><div class="fact">${ic('user')}<b>${esc(u.name)}</b><span>Name</span></div><div class="fact">${ic('ticket')}<b>${esc(u.roll)}</b><span>Roll no.</span></div><div class="fact">${ic('star')}<b>${esc(u.prog)}</b><span>Programme</span></div><div class="fact">${ic('home')}<b>${esc(u.hostel)}</b><span>Hostel</span></div></div>`,
  foot:`<button class="btn primary" data-a="confirmProfile">Yes, that's me</button>`};
};
SCR.nofetch=()=>({top:S.onb?prog(2):`<h1></h1>`,
  body:`<div class="center" style="padding-top:12px">${spot('map',150)}<h2 class="h2">We couldn't find your record</h2><span class="meta">This can happen for new admissions or a recent hostel change.</span></div>
  <div class="proj"><b>${esc(S.email)}</b><span class="meta">Email verified. Only the profile lookup failed.</span></div>`,
  foot:`<button class="btn" data-a="retryFetch">Try again</button><button class="btn primary" data-a="manualFix">Enter details</button>`});
SCR.fixdetails=({manual})=>{const u=S.user,v=k=>manual&&!S.fixKeep?'':esc(u[k]||'');
  return {top:`${backBtn}${S.onb?prog(2):'<h1></h1>'}`,
  body:`<h2 class="h2">${manual?'Add your details':'Fix your details'}</h2>
  <div class="stack"><label class="lbl" for="fx1">Full name</label><input class="input" id="fx1" value="${v('name')}" placeholder="As in IITG records" autocomplete="name"></div>
  <div class="stack"><label class="lbl" for="fx2">Roll number</label><input class="input" id="fx2" value="${v('roll')}" inputmode="numeric" maxlength="9" placeholder="9 digits"></div>
  <div class="stack"><label class="lbl" for="fx3">Programme and year</label><input class="input" id="fx3" value="${v('prog')}" placeholder="e.g. B.Tech CSE · Y1"></div>
  <div class="stack"><label class="lbl" for="fx4">Hostel</label><input class="input" id="fx4" value="${v('hostel')}" placeholder="e.g. Brahmaputra"></div>
  <span class="err" id="fxe" hidden></span>
  <div class="banner acc">${ic('shield')}<span class="grow">We'll check this with IITG records<span>Usually within 2 days. You can use the app meanwhile.</span></span></div>`,
  foot:`<button class="btn primary" data-a="saveFix">Save and continue</button>`};
};

/* registration */
/* plan card: the event and what to do there (no tickets, no badges) */
function ticket(e,ref,extra=''){const c=ec(e),d=dp(e),got=S.attended.has(e.id);
  return `<div class="ticket">${evCover(e)}<div class="thead"><span class="meta">${esc(c.name)}</span><b>${esc(e.title)}</b></div>
  <div class="tbody"><div class="stack" style="gap:6px"><span class="tmeta">${ic('cal')}<b style="color:var(--ink)">${d.dow} ${d.num} ${d.mon}</b> · ${e.time}</span><span class="tmeta">${ic('pin')}${esc(e.venue)}</span>${extra}</div>
  ${got?`<span class="pill ok">${ic('check')} Checked in</span>`:''}</div></div>`}
function collect(id){const e=ev(id);S.attended.add(id);const s=S.stamps[e.club]||(S.stamps[e.club]={n:0});s.n++}
const stampCount=()=>S.attended.size;

/* Activity: what needs doing first, then everything else in plain sight (no sub-tabs) */
function actCard(thumb,title,sub,btn,tone=''){
  const [label,kind,target,id]=btn||[];
  const b=btn?`<button class="btn sm ${tone==='warn'?'warn':'primary'}" ${kind==='go'?`data-go="${target}"`:`data-a="${target}"`} data-id="${id}">${label}</button>`:'';
  return `<div class="act ${tone}">${thumb}<span class="grow"><b>${title}</b><span class="meta">${sub}</span></span>${b}</div>`}
SCR.activity=()=>{
  if(!S.signedIn) return {top:`${backBtn}<h1>Plans</h1>`,body:`<div class="empty">${spot('map')}<b>Your plans, applications and saved events live here</b><button class="btn sm primary" data-a="signinOnly">Sign in</button></div>`};
  const regs=Object.entries(S.regs).map(([id,m])=>({id,e:ev(id),m})).filter(x=>!x.e.cancelled&&x.m.status!=='cancelled').sort((a,b)=>a.e.sort-b.e.sort);
  const todo=[];
  regs.filter(x=>x.m.status==='offer').forEach(x=>todo.push(actCard(evCover(x.e,'thumb'),'A seat opened: '+esc(x.e.title),'Accept by '+x.m.expires,['Accept','go','offer',x.id],'warn')));
  const nx=regs.find(x=>x.m.status==='confirmed'&&!S.attended.has(x.id));
  if(nx){const d=dp(nx.e);todo.push(actCard(evCover(nx.e,'thumb'),'Next: '+esc(nx.e.title),`${d.dow} ${d.num} ${d.mon} · ${nx.e.time} · ${esc(nx.e.venue)}`,["I'm here",'a','checkin',nx.id]))}
  [...S.attended].filter(id=>!S.feedback.has(id)).forEach(id=>todo.push(actCard(evCover(ev(id),'thumb'),'How was '+esc(ev(id).title)+'?','30-second feedback for the organizers',['Rate','go','feedback',id])));
  [...S.saved].map(ev).filter(e=>!e.cancelled&&e.reg==='required'&&!S.regs[e.id]&&left(e)>0).forEach(e=>todo.push(actCard(evCover(e,'thumb'),esc(e.title),'Saved · registration closes '+e.deadline,['Register','a','register',e.id])));
  [...S.followed].map(club).filter(c=>c.recruit.open&&!S.apps[c.id]).forEach(c=>todo.push(actCard(cover(c,'thumb'),esc(c.name)+' is recruiting','Apply by '+c.recruit.deadline,['Apply','a','startApp',c.id])));
  Object.keys(S.roomReq).forEach(id=>todo.push(actCard(cover(club(id),'thumb'),esc(club(id).name)+' room','Waiting for moderators to approve you')));
  const apps=Object.entries(S.apps);
  const going=regs.filter(x=>x.m.status==='confirmed'||x.m.status==='waitlisted');
  return {top:`${backBtn}<h1>Plans</h1>`,
  body:`<div class="stack"><div class="sec"><b>Needs your action</b>${todo.length?`<span class="pill warn">${todo.length}</span>`:''}</div>
    ${todo.length?todo.join(''):`<div class="act">${spot('green',52)}<span class="grow"><b>You're all set</b><span class="meta">Nothing waiting on you right now</span></span><button class="btn sm" data-a="root" data-v="home">Explore</button></div>`}</div>
  <div class="stack"><div class="sec"><b>Going</b><span class="meta">${going.length}</span></div>
    ${going.length?going.map(x=>erow(x.e)).join(''):`<span class="meta">No events yet. <button class="link" data-a="homeTab" data-v="events" data-root="1">Find one</button></span>`}</div>
  <div class="stack"><div class="sec"><b>Applications and requests</b><span class="meta">${apps.length}</span></div>
    ${apps.length?apps.map(([id,a])=>{const c=club(id);return `<button class="li" data-go="club" data-id="${id}">${cover(c,'',``,'width:44px;height:44px;border-radius:12px')}<span class="grow"><b style="font-size:14.5px">${esc(c.name)}</b><span class="meta">${a.type==='request'?'Member request':'Core team application'} · sent ${a.date}</span></span><span class="pill warn">${esc(a.status.split(' ').slice(0,3).join(' '))}</span></button>`}).join(''):`<span class="meta">Clubs that are recruiting show “Apply to join” on their page.</span>`}</div>
  <div class="stack"><div class="sec"><b>Saved</b><span class="meta">${S.saved.size}</span></div>
    ${S.saved.size?[...S.saved].map(id=>erow(ev(id))).join(''):`<span class="meta">Tap the bookmark on an event to keep it here.</span>`}</div>`};
};
SCR.confirm=({id})=>{const e=ev(id);return {top:`${backBtn}<h1>Confirm</h1>`,
  body:`${ticket(e,'—',`<span class="tmeta">${ic('user')}${esc(S.user.name)}</span>`)}
  <div class="toggles">${tg('alert','Venue & time changes',true,'noop')}${tg('bell','Remind me the evening before',S.remind,'toggleRemind')}</div>
  <textarea class="input" id="access" placeholder="Anything the organizer should know? (optional)" aria-label="Note for organizer"></textarea>`,
  foot:`<button class="btn primary" data-a="confirmReg" data-id="${id}">Confirm seat</button>`};};
SCR.pass=({id})=>{const e=ev(id),m=S.regs[id];if(!m)return SCR.event({id});return {top:`${backBtn}<h1>Going</h1>`,
  body:`${e.cancelled?`<div class="banner bad">${ic('alert')}<span class="grow">Cancelled by organizer<span>${esc(e.reason)}</span></span></div>`:''}
  ${e.changed&&!e.cancelled?`<button class="banner warn" data-go="updates" data-id="${id}">${ic('pin')}<span class="grow">Meeting point changed<span>Now: ${esc(e.venue)}</span></span>${ic('chev')}</button>`:''}
  ${ticket(e,m.ref,`<span class="tmeta">${ic('user')}${esc(S.user.name)}</span>`)}
  ${S.attended.has(id)?'':`<div class="row" style="justify-content:space-between"><button class="link" data-a="cal">${ic('cal')} Add to calendar</button><button class="link" style="color:var(--danger)" data-go="cancelReg" data-id="${id}">Can't go</button></div>`}`,
  foot:e.cancelled?`<button class="btn primary" data-a="root" data-v="home">Find other events</button>`:S.attended.has(id)?`<button class="btn primary" data-go="activity">Plans</button>`:`<button class="btn primary" data-a="checkin" data-id="${id}">${ic('pin')} I'm here · check in</button>`};};
SCR.cancelReg=({id})=>{const e=ev(id),c=ec(e);return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center">${cover(c,'',``,'width:96px;height:96px;border-radius:28px')}<h2 class="h2">Give up your seat?</h2><span class="meta">${esc(e.title)}</span></div>
  <div class="facts"><div class="fact">${ic('ticket')}<b>Seat released</b><span>Instantly</span></div><div class="fact">${ic('users')}<b>${e.wl?'Next in line':'Open to others'}</b><span>${e.wl?'Gets offered it':'Anyone can book'}</span></div></div>
  <textarea class="input" id="why" placeholder="Reason (optional)" aria-label="Reason"></textarea>`,
  foot:`<button class="btn" data-a="back">Keep it</button><button class="btn danger" data-a="doCancel" data-id="${id}">Cancel seat</button>`};};
SCR.full=({id})=>{const e=ev(id),c=ec(e);return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center"><span class="big">0</span><span class="meta">seats left · ${e.wl} waiting</span></div>
  <div class="card" style="--c:${c.c}"><div class="seats">${Array.from({length:e.cap},()=>'<i class="t"></i>').join('')}</div></div>
  <div class="steps"><div class="step done"><i>1</i>Join waitlist</div><div class="step"><i>2</i>Seat opens</div><div class="step"><i>3</i>Accept in time</div></div>
  ${(()=>{const sim=S.ev.filter(x=>x.id!==id&&!x.cancelled&&x.reg==='required'&&left(x)>0&&ec(x).board===c.board).slice(0,4);return sim.length?`<div class="stack"><div class="sec"><b>Open instead</b></div><div class="hs">${sim.map(poster).join('')}</div></div>`:''})()}`,
  foot:`<button class="btn" data-a="back">Not now</button><button class="btn primary" data-a="joinWait" data-id="${id}">Join waitlist · #${e.wl+1}</button>`};};
SCR.offer=({id})=>{const e=ev(id),m=S.regs[id];return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center"><span class="okbig" style="background:var(--warm-soft);color:var(--warm)">${ic('ticket')}</span><h2 class="h2">A seat opened up!</h2><span class="pill warn">${ic('clock')} Accept by ${m.expires}</span></div>${ticket(e,'OFFER')}`,
  foot:`<button class="btn" data-a="declineOffer" data-id="${id}">Pass</button><button class="btn primary" data-a="acceptOffer" data-id="${id}">Take the seat</button>`};};
SCR.regfail=({id})=>{const e=ev(id);return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center" style="padding-top:20px"><span class="okbig" style="background:var(--danger-soft);color:var(--danger)">${ic('alert')}</span><h2 class="h2">Connection dropped</h2><span class="meta">We'll check if your seat went through. No double booking.</span></div>${erow(e)}`,
  foot:`<button class="btn" data-a="back">Back</button><button class="btn primary" data-a="retryReg" data-id="${id}">Check & retry</button>`};};
SCR.updates=({id})=>{const e=ev(id),c=ec(e);return {top:`${backBtn}<h1>Update</h1>`,
  body:`<div class="row">${av(c.contact,40)}<span class="grow"><b>${esc(c.contact)}</b><span class="meta">${esc(c.name)} · today 4:30 PM</span></span><span class="pill ok">${ic('shield')}</span></div>
  <div class="card"><div class="lbl">Meeting point</div><div class="row" style="flex-wrap:nowrap;gap:10px"><div class="fact" style="flex:1;background:var(--surface);opacity:.6">${ic('pin')}<b style="text-decoration:line-through">${esc(e.prevVenue)}</b><span>Before</span></div>${ic('arrow')}<div class="fact" style="flex:1;background:var(--surface);box-shadow:0 0 0 2px var(--accent)">${ic('pin')}<b>${esc(e.venue)}</b><span>Now</span></div></div><span class="meta">Sheltered in case of rain.</span></div>
  <div class="icchips"><span>${ic('cal')}Same day</span><span>${ic('clock')}Same time</span></div>`,
  foot:S.regs[id]?.status==='confirmed'?`<button class="btn primary" data-a="repl" data-v="pass" data-id="${id}">${ic('check')} See your plan</button>`:`<button class="btn primary" data-a="back">Got it</button>`};};
SCR.attended=({id})=>{const e=ev(id),c=ec(e),nx=S.ev.filter(x=>x.club!==e.club&&!x.cancelled&&x.reg==='required'&&left(x)>0).slice(0,4);return {top:`${backBtn}<h1></h1>`,
  body:`<div class="center"><span class="okbig">${ic('check')}</span><h2 class="h2">You're checked in</h2><span class="meta">${esc(e.title)}</span></div>
  <div class="join2"><button class="jt" data-a="follow" data-id="${c.id}"><span class="ji">${ic('heart')}</span><b>${S.followed.has(c.id)?'Following':'Follow club'}</b><span>${esc(c.name)}</span></button>${c.recruit.open?`<button class="jt hot" data-a="startApp" data-id="${c.id}"><span class="ji">${ic('star')}</span><b>Core team</b><span>Apply by ${c.recruit.deadline}</span></button>`:`<button class="jt" data-a="openRoom" data-id="${c.id}"><span class="ji">${ic('chat')}</span><b>Club room</b><span>Say hi</span></button>`}</div>
  ${nx.length?`<div class="stack"><div class="sec"><b>Try next</b></div><div class="hs">${nx.map(poster).join('')}</div></div>`:''}`,
  foot:S.feedback.has(id)?`<button class="btn" disabled>${ic('check')} Rated · thanks</button>`:`<button class="btn primary" data-go="feedback" data-id="${id}">Rate it</button>`};};
SCR.feedback=({id})=>{const e=ev(id),fb=S.fb||{};const faces=['Meh','Okay','Good','Great','Loved it'];return {top:`${backBtn}<h1></h1>`,
  body:`<h2 class="h2">How did it feel?</h2>
  <div class="steps">${faces.map((f,i)=>`<button class="step ${fb.w===i+1?'now':''}" data-a="fbWel" data-v="${i+1}"><i style="width:48px;height:48px;font-size:18px">${i+1}</i>${f}</button>`).join('')}</div>
  <div class="stack"><span class="lbl">Matched the event page?</span><div class="row">${['Yes','Partly','No'].map(v=>`<button class="chip ${fb.m===v?'on':''}" data-a="fbMatch" data-v="${v}">${v}</button>`).join('')}</div></div>
  <textarea class="input" id="fbt" placeholder="One thing to improve (optional)" aria-label="Improvement"></textarea>
  <span class="meta">${ic('lock')} Only the organizers see this</span>`,
  foot:`<button class="btn primary" data-a="sendFb" data-id="${id}" ${fb.w?'':'disabled'}>Send</button>`};};

/* membership */
SCR.room=({id,team})=>{
  const key=team?'T:'+id:id,c=club(id),ms=S.msgs[key]||(S.msgs[key]=[]),joined=team||S.rooms.has(id),pin=ms.find(m=>m.pinned),pend=S.roomReq[id];
  if(team) return {top:`${backBtn}${cover(c,'',``,'width:38px;height:38px;border-radius:12px')}<span class="grow"><b>${esc(c.name)} team</b><span class="meta" style="font-size:12px">${ic('lock')} Members only</span></span>`,
  body:`${pin?`<div class="pinned">${ic('pin')}<span>${esc(pin.text)}</span></div>`:''}${msgList(ms,key)}`,
  composer:`<input class="input" id="chat" placeholder="Message the team" autocomplete="off" aria-label="Message"><button class="btn primary" data-a="send" data-id="${key}" aria-label="Send">${ic('send')}</button>`};
  if(!joined) return {bleed:true,
    body:`${hero(c,`<span class="pill">${ic('lock')} Approval needed</span>`,`${esc(c.name)} room`)}
    ${pend?`<div class="banner warn">${ic('clock')}<span class="grow">Request sent<span>Moderators usually reply within a day. We'll notify you.</span></span></div>`
      :`<div class="stack"><label class="lbl" for="rq">Introduce yourself to the moderators</label><textarea class="input" id="rq" placeholder="e.g. First year, love street photography, came to the photo walk"></textarea><span class="err" id="rqe" hidden>Add a line so moderators know who you are.</span></div>`}
    <div class="rules"><div class="rule">${ic('heart')}Be kind</div><div class="rule">${ic('x')}No spam or selling</div><div class="rule">${ic('shield')}Club heads moderate</div><div class="rule">${ic('flag')}Report, privately</div></div>
    ${pin?`<div class="stack"><span class="lbl">Latest announcement</span><div class="pinned">${ic('pin')}<span>${esc(pin.text)}</span></div></div>`:''}`,
    foot:pend?`<button class="btn" data-a="withdrawRoom" data-id="${id}">Withdraw request</button>`:`<button class="btn primary" data-a="reqRoom" data-id="${id}">${ic('send')} Agree to rules and request</button>`};
  return {top:`${backBtn}${cover(c,'',``,'width:38px;height:38px;border-radius:12px')}<span class="grow"><b>${esc(c.name)}</b><span class="meta" style="font-size:12px">${c.members+1} members</span></span><button class="ib" data-a="leaveRoom" data-id="${id}" aria-label="Leave room">${ic('x')}</button>`,
  body:`${pin?`<div class="pinned">${ic('pin')}<span>${esc(pin.text)}</span></div>`:''}${msgList(ms,id)}`,
  composer:`<input class="input" id="chat" placeholder="Message" autocomplete="off" aria-label="Message"><button class="btn primary" data-a="send" data-id="${id}" aria-label="Send">${ic('send')}</button>`};
};

const msgList=(ms,key)=>`<div class="msgs">${ms.filter(m=>!m.pinned).map(m=>{const hid=S.reported.has(key+':'+m.id);
    return `<div class="msg ${m.me?'me':''} ${hid?'hidden':''}">${m.me?'':av(m.who)}<div class="mb">${m.me?'':`<span class="who">${esc(m.who)}${m.role?` <span class="pill acc" style="padding:1px 7px">${m.role}</span>`:''}</span>`}
    <div class="bubble">${hid?'Reported · hidden for you':esc(m.text)}${!m.me&&!hid?`<button class="more" data-a="msgMenu" data-id="${key}" data-v="${m.id}" aria-label="Message options">${ic('more')}</button>`:''}</div></div></div>`}).join('')}</div>`;

/* ---------- onboarding: splash → intro → role → email → OTP → profile → (student) interests → recommendations | (member) your club ---------- */
const prog=n=>`<div class="prog" aria-label="Step ${n} of 3">${[1,2,3].map(i=>`<i class="${i<=n?'on':''}"></i>`).join('')}<span>${n}/3</span></div>`;
/* ---------- club member: team space, proposals ---------- */
const KIND={venue:['pin','Change an event'],new:['cal','New event'],page:['edit','Club page'],recruit:['star','Recruitment']};
const pstat=p=>p.status==='live'?['ok','Live']:p.status==='declined'?['bad','Declined']:['warn','In discussion'];
function ensureMember(){ensureUser();S.role='member';if(!S.teamClubs.length){S.teamClubs=['photo','music'];S.activeClub='photo'}}
SCR.team=()=>{ensureMember();const c=club(S.activeClub),ps=S.props.filter(p=>p.club===c.id),open=ps.filter(p=>p.status==='discussing'),evs=clubEvents(c.id).filter(e=>!e.cancelled),T=S.msgs['T:'+c.id]||[];
  return {top:`${backBtn}<h1>Team space</h1>${S.teamClubs.length>1?`<button class="chip" data-a="switchTeam">${esc(c.name.split(' ')[0])} ${ic('chev')}</button>`:''}`,
  body:`<div class="tmhead">${cover(c,'',`<span class="onc ${S.memberRole==='head'?'warn':''}" style="position:absolute;left:12px;top:12px"><i></i>${S.memberRole==='head'?'Club head':'Member'}</span>`)}<div><b>${esc(c.name)}</b><span class="meta">${c.members} followers · ${evs.length} upcoming</span></div></div>
  <div class="stack"><div class="sec"><b>Propose a change</b></div><div class="ktiles">${Object.entries(KIND).map(([k,[i,l]])=>`<button class="kt" data-a="newProp" data-v="${k}"><span class="ji">${ic(i)}</span>${l}</button>`).join('')}</div></div>
  <div class="stack"><div class="sec"><b>Proposals</b>${open.length?`<span class="pill warn">${open.length} open</span>`:''}</div>${ps.map(propRow).join('')}</div>
  <button class="card" style="flex-direction:row;align-items:center" data-a="teamChat"><span class="ji" style="width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:#2A2622;color:#fff">${ic('lock')}</span><span class="grow"><b>Team chat</b><span class="meta" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${T.length?esc(T[T.length-1].who.split(' ')[0])+': '+esc(T[T.length-1].text):'Members only'}</span></span><span class="avs">${[...new Set(T.map(m=>m.who))].slice(0,3).map(p=>av(p,26)).join('')}</span></button>
  ${evs.length?`<div class="stack"><div class="sec"><b>Our events</b></div><div class="hs">${evs.map(poster).join('')}</div></div>`:''}`};
};
function propRow(p){const [k,t]=pstat(p),[i]=KIND[p.kind];
  return `<button class="prow" data-go="proposal" data-id="${p.id}"><span class="ji">${ic(i)}</span><span class="grow"><b>${esc(p.title)}</b><span class="tmeta">${av(p.by,20)} ${esc(p.by.split(' ')[0])} · ${p.t}</span></span><span class="stack" style="gap:4px;align-items:flex-end"><span class="pill ${k}">${t}</span><span class="tmeta">${ic('check')}${p.up} ${ic('chat')}${p.comments.length}</span></span></button>`}
SCR.proposal=({id})=>{const p=S.props.find(x=>x.id===id),c=club(p.club),[k,t]=pstat(p),[i,l]=KIND[p.kind],v=S.voted[id],head=S.memberRole==='head';
  const stg=p.status==='live'?4:p.status==='declined'?3:2;
  return {top:`${backBtn}<h1>Proposal</h1>`,

SCR.hang=({id})=>{const h=hang(id),[tl,sp]=RTYPE[h.type],key='H:'+id,ms=S.msgs[key]||(S.msgs[key]=[]),inR=S.hjoined.has(id),req=S.hreq[id],pin=ms.find(m=>m.pinned),host=h.host===(S.user&&S.user.name);

  if(!inR) return {top:`${backBtn}<h1>Room</h1><button class="ib" data-a="roomMenu" data-id="${id}" aria-label="More options">${ic('more')}</button>`,

    ${req?`<div class="banner warn">${ic('clock')}<span class="grow">Request sent to ${esc(h.host)}<span>You'll get a notification when you're in.</span></span></div>`:''}`,

function liveTag(h){if(!h.media||h.media==='chat')return '';const n=h.live.length;return `<span class="pill ${n?'live':''}">${n?'<i class="ldot"></i>':ic(MEDIA[h.media][1])}${MEDIA[h.media][0]}${n?` · ${n} live`:''}</span>`}
function callCard(h){const inC=S.call&&S.call.id===h.id,n=h.live.length,vid=h.media==='video';

  <span class="row" style="gap:8px"><span class="avs">${h.live.slice(0,4).map(p=>av(p,22)).join('')}</span><span class="meta">${inC?'Tap to go back':'Join in, mute any time'}</span></span></span><span class="btn sm primary">${inC?'Open':'Join'}</span></button>`;
  return `<div class="talkbar"><span class="grow"><b>Want to talk?</b><span class="meta">Switch this room to a call</span></span><button class="btn sm" data-a="joinCall" data-id="${h.id}" data-v="voice">${ic('mic')} Voice</button><button class="btn sm" data-a="joinCall" data-id="${h.id}" data-v="video">${ic('video')} Video</button></div>`}
SCR.call=({id})=>{const h=hang(id),c=S.call||{},vid=h.media==='video',all=[...h.live.filter(p=>p!==ME()),ME()],rest=h.people.filter(p=>!all.includes(p)).length;
  return {bare:true,dark:true,body:`<div class="callwrap">
  <div class="ctop"><button class="cbtn sm" data-a="back" aria-label="Back to room">${ic('back')}</button><span class="grow"><b>${esc(h.title)}</b><span><i class="ldot"></i>${vid?'Video':'Voice'} · ${all.length} on call · <span id="ctime">00:00</span></span></span><button class="cbtn sm" data-a="invite" data-id="${id}" aria-label="Invite people">${ic('users')}</button></div>
  <div class="stage ${vid?'v':'a'} n${Math.min(all.length,6)}">${all.map(p=>{const me=p===ME(),muted=me?c.muted:MUTED.has(p),cam=me?c.cam:(vid&&!CAMOFF.has(p));
    return `<div class="ctile ${me?'me':''} ${muted?'muted':''}" data-p="${esc(p)}">${vid&&cam?`<span class="camfill" style="background:linear-gradient(160deg,${avColor(p)}55,#2C2824)">${me?`<span class="camnote">${ic('video')} Your camera</span>`:''}</span>`:''}${av(p,vid?60:68)}<span class="tname2">${me?'You':esc(p)}${muted?ic('micoff'):''}</span>${me&&c.hand?`<span class="handup">${ic('hand2')}</span>`:''}</div>`}).join('')}</div>
  ${rest?`<div class="listen">${rest} more in the room, chatting</div>`:''}
  <div class="cbar"><button class="cbtn ${c.muted?'off':''}" data-a="cMute" aria-label="${c.muted?'Unmute':'Mute'}" aria-pressed="${!!c.muted}">${ic(c.muted?'micoff':'mic')}</button><button class="cbtn ${c.cam?'':'off'}" data-a="cCam" aria-label="${c.cam?'Turn camera off':'Turn camera on'}" aria-pressed="${!!c.cam}">${ic(c.cam?'video':'videooff')}</button><button class="cbtn ${c.hand?'on':''}" data-a="cHand" aria-label="Raise hand" aria-pressed="${!!c.hand}">${ic('hand2')}</button><button class="cbtn" data-a="back" aria-label="Open chat">${ic('chat')}</button><button class="cbtn end" data-a="cLeave" data-id="${id}" aria-label="Leave call">${ic('phoneoff')}</button></div>
  <p class="cnote">Prototype: your mic and camera are not used.</p></div>`};
};
SCR.newroom=()=>{const d=S.rd||{type:'study',when:'Now',open:true,media:'chat'};

  <div class="stack"><label class="lbl" for="rt1">Room name</label><input class="input" id="rt1" maxlength="60" placeholder="${ph}" value="${esc(d.title||'')}"><span class="err" id="rte" hidden>Give your room a name.</span></div>
  <div class="stack"><span class="lbl">When</span><div class="row">${['Now','Later today','Tomorrow'].map(w=>`<button class="chip ${d.when===w?'on':''}" data-a="rdWhen" data-v="${w}">${ic('clock')}${w}</button>`).join('')}</div></div>
  <div class="stack"><label class="lbl" for="rt2">Where</label><input class="input" id="rt2" placeholder="Library, Khokha, a hostel common room, or Online" value="${esc(d.where||'')}"></div>

    <button class="vt ${d.open?'':'on'}" role="radio" aria-checked="${!d.open}" data-a="rdVis" data-v="private"><span class="ji">${ic('lock')}</span><b>Private</b><span>Only people you invite</span>${d.open?'':`<i class="vtick">${ic('check')}</i>`}</button></div></div>
  <span class="meta">${ic('chat')} Rooms start as a chat. Anyone inside can switch to voice or video.</span>`,
