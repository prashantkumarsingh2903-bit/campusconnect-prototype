};
function inviteSheet(sh){const h=hang(sh.id),link='campusconnect.app/r/'+h.id;
  return `<div class="sheetbg" data-a="closeSheet"><div class="sheet" data-stop="1"><b style="font-family:var(--display);font-size:20px">Invite to ${esc(h.title)}</b>
  <div class="proj"><span class="meta">Invite link</span><span class="mail" id="ilink">${link}</span></div>
  <button class="btn" data-a="copyLink">${ic('send')} Copy link</button>
  <span class="lbl">Or invite people you know</span>
  <div class="row">${[...new Set([...S.connected,...PEOPLE])].filter(p=>!h.people.includes(p)).map(p=>`<button class="chip ${sh.pick.has(p)?'on':''}" data-a="invPick" data-v="${esc(p)}">${av(p,22)}${esc(p)}${S.connected.has(p)?' · connected':''}</button>`).join('')}</div>
  <button class="btn primary" data-a="sendInv" ${sh.pick.size?'':'disabled'}>Send ${sh.pick.size||''} invite${sh.pick.size===1?'':'s'}</button></div></div>`}

/* Rooms, simplified: a friendly header, then rooms grouped by whether you know anyone inside.
   Each card answers three questions only: what is it, who is in it, is it public or private. */
/* ===================== v3 (critique fixes) ===================== */
/* splash only on the first launch on this device, and short */
const SEENK='cc.seenSplash';
const FIRST=(()=>{try{return !localStorage.getItem(SEENK)}catch(e){return true}})();
function markSeen(){try{localStorage.setItem(SEENK,'1')}catch(e){}}

/* onboarding: splash → welcome → email → code → is this you → (on a roster? team) → interests → Explore */
SCR.splash=()=>({bare:true,body:`<div class="splash"><video src="img/splash.mp4" autoplay muted playsinline preload="auto" aria-label="CampusConnect intro animation"></video><button class="skip" data-a="skipSplash">Skip</button></div>`});
const WEL=[['coding','Coding'],['music','Music'],['dance','Dance'],['football','Football'],['photo','Photography'],['painting','Art']];
SCR.welcome=()=>({bare:true,body:`<div class="wel"><div class="wtop">Campus<span>Connect</span></div>
  <div class="wart"><div class="wgrid">${WEL.map(([f,l])=>`<figure><span class="wt"><img src="img/${f}.webp" alt=""></span><figcaption>${l}</figcaption></figure>`).join('')}</div></div>
  <div class="itext"><h2>Find your club at IITG</h2><p>22 clubs, their events and rooms, in one place.</p>
  <button class="btn primary" style="width:100%" data-a="startOnb">Get started ${ic('arrow')}</button></div></div>`});
SCR.intro=SCR.welcome;
SCR.pickclub=()=>({top:`${backBtn}${prog(3)}`,
  body:`${scene('writing')}<h2 class="h2">You're on a club team</h2><span class="meta">${ic('shield')} We found you on these club rosters</span>
  <div class="stack" style="gap:12px">${ROSTER.map(([id,role,head])=>{const c=club(id),on=S.pick.has(id);return `<button class="opt ${on?'on':''}" style="padding:10px" data-a="pickTeam" data-v="${id}" aria-pressed="${on}">${cover(c,'thumb')}<span class="grow"><b>${esc(c.name)}</b><span class="meta">${role} · added by ${head}</span></span><span class="sw ${on?'on':''}"></span></button>`}).join('')}</div>
  <button class="link" style="align-self:flex-start" data-a="reqAccess">Club missing? Ask its head to add you</button>`,
  foot:`<button class="btn" data-a="skipTeam">Not now</button><button class="btn primary" data-a="finishMember" ${S.pick.size?'':'disabled'}>Open team space</button>`});

/* people you know = your connections (one mutual relationship, no followers) */
const knownSet=()=>S.signedIn?new Set(S.connected):new Set();
const visiblePost=p=>!p.archive&&!S.hidden.has(p.id)&&!S.blocked.has(p.who)&&!S.muted.has(p.club||p.who);

/* who's going: a few names you may know, then a count */
const GOING={walk:['Meera','Kabir','Ishaan'],quiz1:['Tara','Rahul'],cp:['Rahul','Zoya','Aman'],badm:['Kabir'],mlread:['Ishaan'],linef:['Aman','Meera'],nets:['Kabir','Aman'],clean:['Tara','Meera'],jam:['Zoya']};
function goingNames(e){const K=knownSet();return (GOING[e.id]||[]).filter(n=>!S.blocked.has(n)).sort((a,b)=>(K.has(b)?1:0)-(K.has(a)?1:0))}
function goingLine(e,size=26){if(e.reg!=='required'||e.cancelled||!e.taken)return '';
  const me=S.regs[e.id]?.status==='confirmed',ns=goingNames(e),first=me?'You':ns[0],rest=e.taken-1,avs=(me?[ME(),...ns]:ns).slice(0,3);
  return `<div class="going"><span class="avs">${avs.map(p=>av(p,size)).join('')}</span><span>${first?`<b>${esc(first)}</b> and ${rest} other${rest===1?'':'s'} going`:`${e.taken} going`}</span></div>`}
const goingMini=e=>e.reg!=='required'||e.cancelled||!e.taken?'':`<span class="gmini"><span class="avs">${goingNames(e).slice(0,2).map(p=>av(p,18)).join('')}</span>${e.taken} going</span>`;

/* search: before typing, show what people search for (no picture grid) */
const POPULAR=['Photography','Coding','Dance','Auditions','Workshop','Robotics','Quiz','Music'];
function addRecentQ(q){q=q.trim();if(!q)return;S.recentQ=[q,...S.recentQ.filter(x=>x.toLowerCase()!==q.toLowerCase())].slice(0,5)}
function results(){
  const quick=`<div class="chips"><button class="chip ${fCount()?'on':''}" data-go="filters">${ic('filter')}Filters${fCount()?' · '+fCount():''}</button><button class="chip ${S.f.beginner?'on':''}" data-a="fBeg">${ic('smile')}Beginner</button>${BOARDS.map(([b,m])=>`<button class="chip ${S.f.board===b?'on':''}" data-a="fBoard" data-v="${b}">${mo(m)}${b}</button>`).join('')}</div>`;
  if(!S.q.trim()&&!fCount()) return quick+`${S.recentQ.length?`<div class="stack"><div class="sec"><b>Recent</b><button data-a="clearRecentQ">Clear</button></div><div class="row">${S.recentQ.map(q=>`<button class="chip" data-a="suggest" data-v="${esc(q)}">${ic('clock')}${esc(q)}</button>`).join('')}</div></div>`:''}
  <div class="stack"><div class="sec"><b>Popular at IITG</b></div><div class="row">${POPULAR.map(q=>`<button class="chip" data-a="suggest" data-v="${q}">${ic('search')}${q}</button>`).join('')}</div></div>`;
  const cl=CLUBS.filter(matchClub),evs=S.ev.filter(matchEvent).sort((a,b)=>a.sort-b.sort);
  if(!cl.length&&!evs.length) return quick+`<div class="empty">${spot('map')}<b>Nothing found</b><div class="row" style="justify-content:center">${fCount()?'<button class="btn sm primary" data-a="fReset">Clear filters</button>':''}<button class="btn sm" data-a="exitSearch">Browse all</button></div></div>`;
  return quick+`${cl.length?`<div class="stack"><div class="sec"><b>Clubs</b><span class="meta">${cl.length}</span></div><div class="grid2">${cl.map(tile).join('')}</div></div>`:''}
  ${evs.length?`<div class="stack"><div class="sec"><b>Events</b><span class="meta">${evs.length}</span></div><div class="stack" style="gap:14px">${evs.map(e=>erow(e)).join('')}</div></div>`:''}`;
}

/* Explore. Events get time filters: today is Tue 20 Oct, the weekend is Sat 24 – Sun 25 */
/* Club page: a shorter hero, the size and time cost up front, joining first */
/* after the first registration, ask about reminders at the moment it makes sense */
SCR.registered=({id})=>{const e=ev(id),m=S.regs[id],ask=!S.remindAsked;return {top:`<span style="flex:1"></span><button class="ib" data-a="root" data-v="home" aria-label="Close">${ic('x')}</button>`,
  body:`<div class="center"><span class="okbig">${ic('check')}</span><h2 class="h2">You're going!</h2></div>${ticket(e,m.ref)}
  ${ask?`<div class="remind"><div class="row" style="flex-wrap:nowrap;gap:12px"><span class="ji">${ic('bell')}</span><span class="grow"><b>Get a reminder the evening before?</b><span class="meta">We'll also tell you if the place or time changes.</span></span></div>
    <div class="row" style="flex-wrap:nowrap"><button class="btn grow1" data-a="remindAns" data-v="0">Not now</button><button class="btn grow1 primary" data-a="remindAns" data-v="1">Turn on</button></div></div>`:''}
  <div class="row meta" style="justify-content:center">${ic('spark')} At the event, tap “I'm here” to check in</div>`,
  foot:`<button class="btn" data-go="activity">Plans</button><button class="btn ${ask?'':'primary'}" data-a="cal">${ic('cal')} Add to calendar</button>`};};

/* applying: one screen with the dates, the steps and the form (the separate membership screen is gone) */
SCR.apply=({id})=>{const c=club(id),r=c.recruit,steps=r.steps||['Short form','Chat','Welcome'];return {top:`${backBtn}<h1>Apply</h1>`,
  body:`<div class="row" style="flex-wrap:nowrap;gap:12px">${cover(c,'thumb')}<span class="grow"><b style="font-family:var(--display);font-size:20px;line-height:1.15">Join the ${esc(c.name)} team</b><span class="meta">${r.open?`Apply by ${r.deadline} · results ${r.result}`:esc(c.contact)+' reviews applications'}</span></span></div>
  <div class="steps"><div class="step now"><i>1</i>${esc(steps[0])}</div>${steps.slice(1).map((s,i)=>`<div class="step"><i>${i+2}</i>${esc(s)}</div>`).join('')}</div>
  <div class="icchips"><span>${ic('clock')}${c.hours} a week</span><span>${ic('smile')}${c.beginner?'Beginners welcome':'Experience helps'}</span><span>${ic('ticket')}No fee</span></div>
  <div class="stack"><label class="lbl" for="a1">Why join?</label><textarea class="input" id="a1" placeholder="A few lines"></textarea><span class="err" id="a1e" hidden>Write a line or two first.</span></div>
  <div class="stack"><span class="lbl">Experience</span><div class="row">${['None yet','A little','Lots'].map(v=>`<button class="chip ${S.exp===v?'on':''}" data-a="exp" data-v="${v}">${v}</button>`).join('')}</div></div>
  <div class="stack"><label class="lbl" for="a3">Link to your work <span class="meta">(optional)</span></label><input class="input" id="a3" placeholder="Drive, GitHub, Instagram"></div>`,
  foot:`<button class="btn" data-a="draft">Save draft</button><button class="btn primary" data-a="submitApp" data-id="${id}">Submit</button>`};};
SCR.membership=({id})=>SCR.apply({id});

/* Feed: text first, real photos only, neutral labels, a "…" menu for safety. No Connect or Share on cards. */
/* Connections: requests, your connections, people you may know */
SCR.network=()=>{const L=[...S.connected].filter(n=>!S.blocked.has(n)),sug=[...new Set([...S.hangs.filter(h=>S.hjoined.has(h.id)).flatMap(h=>h.people),...Object.keys(PINFO)])].filter(n=>n!==ME()&&connState(n)===''&&!S.blocked.has(n)).slice(0,5);
  return {top:`${backBtn}<h1>Connections</h1>`,
  body:`${S.inreq.length?`<div class="stack"><div class="sec"><b>Requests</b><span class="meta">${S.inreq.length}</span></div>${S.inreq.map(n=>personRow(n,`<span class="row" style="gap:6px;flex-wrap:nowrap"><button class="btn sm" data-a="ignoreReq" data-v="${esc(n)}">Ignore</button><button class="btn sm primary" data-a="acceptReq" data-v="${esc(n)}">Accept</button></span>`)).join('')}</div>`:''}
  <div class="stack"><div class="sec"><b>Your connections</b><span class="meta">${L.length}</span></div>${L.length?L.map(n=>personRow(n,`<button class="btn sm" data-a="invTo" data-v="${esc(n)}">Invite</button>`)).join(''):`<span class="meta">Connect with people from your rooms and the feed.</span>`}</div>
  ${sug.length?`<div class="stack"><div class="sec"><b>People you may know</b><span class="meta">From your rooms and clubs</span></div>${sug.map(n=>personRow(n)).join('')}</div>`:''}`};
};

/* Rooms: private rooms don't reveal who is inside until you're let in */
function whoLine(h){const K=knownSet(),known=h.people.filter(p=>K.has(p)&&p!==ME()),others=h.people.length-known.length-(h.people.includes(ME())?1:0);
  if(h.people.includes(ME())&&!known.length)return others?`You and ${others} other${others===1?'':'s'}`:'Just you so far';
  if(known.length)return `${known.slice(0,2).join(', ')}${known.length>2?` +${known.length-2}`:''}${others>0?` and ${others} more`:''}`;
  return `${h.people.length} ${h.people.length===1?'person':'people'}`}
function hangCard(h){const [,sp]=RTYPE[h.type],req=S.hreq[h.id],n=h.live?h.live.length:0,hide=!h.open&&!S.hjoined.has(h.id);
  return `<button class="rcard2" data-go="hang" data-id="${h.id}"><span class="spot" style="${sprPos(sp)};width:56px;flex:none" aria-hidden="true"></span>
  <span class="grow"><b>${esc(h.title)}</b>
  <span class="meta">${esc(h.when)} · ${esc(h.where||'Online')}${n&&h.media!=='chat'&&!hide?` · <span class="livetxt"><i class="ldot"></i>${n} on ${h.media}</span>`:''}</span>
  <span class="row" style="gap:8px;flex-wrap:nowrap"><span class="avs">${(hide?[h.host]:h.people.slice(0,3)).map(p=>av(p,22)).join('')}</span><span class="who">${esc(hide?`Hosted by ${h.host} · ${h.people.length} people`:whoLine(h))}</span></span></span>
  <span class="vis ${h.open?'':'priv'}">${h.open?'Public':ic('lock')+'Private'}${req?'<br>Requested':''}</span></button>`}
/* Profile: who you are, connections, team space if you have one, your posts */
const netLine=n=>`<button class="netbtn" data-go="network"><b>${n}</b> connection${n===1?'':'s'}${ic('chev')}</button>`;
SCR.profile=()=>{
  if(!S.signedIn) return {nav:'profile',top:`<span class="brand">Profile</span>`,body:`${scene('idcard','Browsing as a guest')}<button class="btn primary" data-a="signinOnly">${ic('shield')} Sign in with IITG</button>`};
  S.pdraft=null;const u=S.user,P=S.prof,mine=S.posts.filter(p=>p.me);
  return {nav:'profile',top:`<span class="brand">Profile</span><button class="ib" data-go="notifs" aria-label="Notifications">${ic('bell')}${unread()?`<span class="dot">${unread()}</span>`:''}</button><button class="ib" data-go="settings" aria-label="Settings">${ic('gear')}</button>`,
  body:`<div class="phead">${av(P.pref||u.name,72)}<span class="grow"><b>${esc(P.pref||u.name)}</b><span class="meta">${esc(u.prog)} · ${esc(u.hostel)}</span>${u.pending?`<span class="meta">${ic('clock')} Verification pending</span>`:''}</span><button class="btn sm" data-go="editprofile">${ic('edit')} Edit</button></div>
  ${P.bio?`<p class="pbio">${esc(P.bio)}</p>`:`<button class="link" style="align-self:flex-start" data-go="editprofile">${ic('plus')} Add a line about yourself</button>`}
  <div class="links"><button class="lrow" data-go="network"><span class="ji">${ic('users')}</span><span class="grow"><b>Connections</b><span class="meta">${S.connected.size} connection${S.connected.size===1?'':'s'}${S.inreq.length?` · ${S.inreq.length} request${S.inreq.length===1?'':'s'}`:''}</span></span>${S.inreq.length?`<span class="cnt">${S.inreq.length}</span>`:''}${ic('chev')}</button></div>
  ${S.teamClubs.length?yourClubs():''}
  <div class="stack"><div class="sec"><b>Your posts</b><button data-a="startPost">${ic('plus')} New post</button></div>
    ${mine.length?`<div class="nlist">${mine.map(p=>postCard(p)).join('')}</div>`:`<div class="empty" style="padding:18px 8px">${spot('green',90)}<b style="font-size:17px">No posts yet</b><span class="meta">Share a thought, an idea or a photo from campus.</span></div>`}</div>`};
};
SCR.settings=()=>{const u=S.user;
  const row=(icon,label,sub,attr)=>`<button class="srow" ${attr}><span class="ji">${ic(icon)}</span><span class="grow"><b>${label}</b>${sub?`<span class="meta">${sub}</span>`:''}</span>${ic('chev')}</button>`;
  const pick=(key,opts,act)=>`<div class="row">${opts.map(v=>`<button class="chip ${S.priv[key]===v?'on':''}" data-a="${act}" data-v="${v}" aria-pressed="${S.priv[key]===v}">${v}</button>`).join('')}</div>`;
  const ppl=(set,act,lbl)=>[...set].map(n=>`<div class="li">${CLUBS.some(c=>c.id===n)?cover(club(n),'',``,'width:32px;height:32px;border-radius:50%'):av(n,32)}<span class="grow">${esc(club(n)?club(n).name:n)}</span><button class="btn sm" data-a="${act}" data-v="${esc(n)}">${lbl}</button></div>`).join('');
  return {top:`${backBtn}<h1>Settings</h1>`,
  body:`<div class="sgroup"><span class="lbl">Account</span>
    ${row('edit','Edit profile','Name you go by, bio, skills, links','data-go="editprofile"')}
    <div class="srow" style="cursor:default"><span class="ji">${ic('lock')}</span><span class="grow"><b>IITG details</b><span class="meta">${esc(u.name)} · ${esc(u.roll)} · ${esc(u.prog)}</span></span><button class="link" data-a="reqFix">Fix</button></div></div>
  <div class="sgroup"><span class="lbl">Your activity</span>
    ${row('cal','Plans and applications',planCount()?planCount()+' need you':'Events, applications, saved','data-go="activity"')}
    ${row('heart','Clubs you follow',S.followed.size+' clubs','data-go="myclubs"')}
    ${row('spark','Interests',S.interests.size?S.interests.size+' picked':'Not set','data-go="personalise"')}</div>
  ${S.teamClubs.length?`<div class="sgroup"><span class="lbl">Clubs</span>${row('users','Manage clubs',S.teamClubs.map(id=>esc(club(id).name)).join(', '),'data-go="manageclubs"')}</div>`:''}
  <div class="sgroup"><span class="lbl">Privacy and safety</span>
    <div class="srow col"><b>Who can send you connection requests</b>${pick('conn',['Everyone','People in my rooms'],'privConn')}</div>
    <div class="srow col"><b>Who can invite you to rooms</b>${pick('inv',['Everyone','Connections'],'privInv')}</div>
    <div class="srow col"><b>Blocked</b>${S.blocked.size?ppl(S.blocked,'unblock','Unblock'):'<span class="meta">No one. Block people from their profile or a post’s “…” menu.</span>'}</div>
    ${S.muted.size?`<div class="srow col"><b>Muted</b>${ppl(S.muted,'unmute','Unmute')}</div>`:''}</div>
  <div class="sgroup"><span class="lbl">Notifications</span><div class="toggles">${tg('heart','New events from clubs I follow',S.n1,'tn1')}${tg('bookmark','Saved events closing',S.n2,'tn2')}${tg('bell','Reminder the evening before',S.remind,'toggleRemind')}${tg('alert','Changes to my plans',true,'noop')}</div></div>
  <div class="sgroup"><span class="lbl">This device</span>
    <div class="srow" style="cursor:default"><span class="ji">${ic('mail')}</span><span class="grow"><b>Saved sign-in emails</b><span class="meta">${RECENT.length?RECENT.map(r=>esc(r.email)).join(', '):'None saved'}</span></span>${RECENT.length?`<button class="link" data-a="forgetAll">Clear</button>`:''}</div></div>
  <button class="btn" data-a="signout">Sign out</button>`};
};
SCR.myclubs=()=>({top:`${backBtn}<h1>Clubs you follow</h1>`,
  body:[...S.followed].length?[...S.followed].map(club).map(c=>`<div class="li"><button class="li" style="padding:0;flex:1" data-go="club" data-id="${c.id}">${cover(c,'',``,'width:44px;height:44px;border-radius:12px')}<span class="grow"><b style="font-size:14.5px">${esc(c.name)}</b><span class="meta">${c.board}</span></span></button><button class="btn sm" data-a="follow" data-id="${c.id}">Unfollow</button></div>`).join('')
   :`<div class="empty">${spot('green',90)}<b style="font-size:17px">Not following any clubs</b><button class="btn sm primary" data-a="root" data-v="home">Explore clubs</button></div>`});

/* someone else's profile: connect, invite, and Report / Block in the "…" menu */
SCR.person=({id})=>{const n=id,P=person(n);
  if(ME_PROFILE(n)) return SCR.profile();
  if(S.blocked.has(n)) return {top:`${backBtn}<h1>${esc(n)}</h1>`,body:`<div class="empty">${av(n,72)}<b>You blocked ${esc(n)}</b><span class="meta">They can't see your posts, invite you to rooms or send you requests.</span><button class="btn sm" data-a="unblock" data-v="${esc(n)}">Unblock</button></div>`};
  const posts=S.posts.filter(p=>p.who===n&&!p.club&&!S.hidden.has(p.id));
  return {top:`${backBtn}<h1>${esc(n)}</h1><button class="ib" data-a="personMenu" data-v="${esc(n)}" aria-label="More options">${ic('more')}</button>`,
  body:`<div class="phead">${av(n,72)}<span class="grow"><b>${esc(n)}</b><span class="meta">${esc(P.bio)}</span></span></div>
  ${P.head?`<p class="pbio">${esc(P.head)}</p>`:''}
  ${P.clubs.length?`<div class="netline">${ic('users')}<span>${P.clubs.map(c=>esc(club(c).name)).join(', ')}</span></div>`:''}

/* sheets: a short options menu, and asking a club a question */
function menuSheet(sh){return `<div class="sheetbg" data-a="closeSheet"><div class="sheet" data-stop="1"><b class="shtitle">${esc(sh.title)}</b>

function askSheet(sh){const c=club(sh.id);return `<div class="sheetbg" data-a="closeSheet"><div class="sheet" data-stop="1"><b class="shtitle">Ask ${esc(c.name)}</b>

/* Feed, laid out like the Substack app (our own theme):
   club strip on top, then full-width posts on separate blocks, club updates as big image cards,
   a "People you may know" carousel between posts, and a floating + to post. */
const readMin=p=>Math.max(1,Math.round(((p.title||'')+' '+(p.text||'')).split(/\s+/).length/200));
const likeBtns=p=>{const liked=S.liked.has(p.id);return `<div class="pact"><button data-a="like" data-id="${p.id}" class="${liked?'on':''}" aria-pressed="${liked}" aria-label="Like">${ic('heart')}${p.likes+(liked?1:0)}</button><button data-go="post" data-id="${p.id}" aria-label="Comments">${ic('chat')}${p.comments.length||''}</button><button data-a="sharePost" aria-label="Share">${ic('send')}</button></div>`};
function postWho(p){const c=p.club&&club(p.club),mine=p.me;
  return {c,name:c?c.name:mine?'You':p.who,go:c?`data-go="club" data-id="${c.id}"`:mine?'data-a="root" data-v="profile"':`data-go="person" data-id="${esc(p.who)}"`,
    pic:s=>c?cover(c,'',``,`width:${s}px;height:${s}px;border-radius:50%`):av(p.who,s)}}
/* a club update: cover image fading into the card, club label, headline, excerpt, bookmark */
function embed(p,w){const sv=S.savedPosts.has(p.id);
  return `<div class="embed" data-go="post" data-id="${p.id}" role="link" tabindex="0" aria-label="${esc(p.title)}"><span class="eimg">${cover(w.c,'',``,'',p.img)}</span>
  <span class="ebody"><span class="epub">${cover(w.c,'',``,'width:22px;height:22px;border-radius:6px')}${esc(w.c.name)}</span><b class="etitle">${esc(p.title)}</b><span class="eexc">${esc(p.text)}</span><span class="emeta">${esc(p.type)} · ${readMin(p)} min read</span></span>
  <button class="ebm ${sv?'on':''}" data-a="savePost" data-id="${p.id}" aria-pressed="${sv}" aria-label="${sv?'Saved':'Save for later'}">${ic('bookmark')}</button></div>`}
function postCard(p,full){const w=postWho(p),open=full?'':`data-go="post" data-id="${p.id}"`,kind=!w.c&&p.type&&p.type!=='Thought'?` · ${esc(p.type)}`:'';
  return `<article class="note ${full?'full':''}">
  <div class="nhd"><button class="nava" ${w.go} aria-label="${esc(w.name)}">${w.pic(44)}</button><span class="grow"><button class="nname" ${w.go}>${esc(w.name)}${w.c?`<span class="vbadge" title="Official club account">${ic('check')}</span>`:''}</button><span class="meta">${p.t}${kind}</span></span>
  ${p.me?'':`<button class="ib ghost" data-a="postMenu" data-id="${p.id}" aria-label="Post options">${ic('more')}</button>${full?'':`<button class="ib ghost" data-a="dismissPost" data-id="${p.id}" aria-label="Hide this post">${ic('x')}</button>`}`}</div>
  ${p.text&&!p.title?`<p class="ntext" ${open}>${esc(p.text)}</p>`:''}
  ${p.title&&w.c?embed(p,w):''}
  ${postMedia(p.media)}
  ${p.tag?`<button class="ntag" data-go="club" data-id="${p.tag}">${ic('users')}${esc(club(p.tag).name)}</button>`:''}
  ${likeBtns(p)}</article>`}
/* clubs you follow (or clubs posting now), a dot when they have something new */
function clubStrip(){const live=new Set(S.posts.filter(p=>p.club&&visiblePost(p)).map(p=>p.club)),ids=S.followed.size?[...S.followed]:[...live];
  return `<div class="hs cstrip">${ids.map(club).map(c=>`<button class="cs" data-a="openClubPosts" data-id="${c.id}">${cover(c)}${live.has(c.id)?'<i class="new" aria-label="New posts"></i>':''}<span class="lab">${esc(c.name.replace(/ Club$/,''))}</span></button>`).join('')}
  <button class="cs" data-a="root" data-v="home"><span class="csmore">${ic('plus')}</span><span class="lab">Find clubs</span></button></div>`}
function peopleCarousel(){const ppl=Object.keys(PINFO).filter(n=>n!==ME()&&connState(n)===''&&!S.blocked.has(n)&&!S.dismissedPpl.has(n)).slice(0,6);if(!ppl.length)return '';
  return `<section class="fsec"><div class="sec"><b>People you may know</b><button data-go="network">See all</button></div>
  <div class="hs pcar">${ppl.map(n=>`<div class="pcard"><button class="ib ghost pcx" data-a="dismissPerson" data-v="${esc(n)}" aria-label="Not now">${ic('x')}</button><button class="pcbody" data-go="person" data-id="${esc(n)}">${av(n,72)}<b>${esc(n)}</b><span class="meta">${esc(person(n).bio)}</span></button>${connBtn(n)}</div>`).join('')}</div></section>`}
SCR.feed=()=>{const list=S.posts.filter(visiblePost);
  return {nav:'feed',top:`<span class="brand">Feed</span><button class="ib" data-go="notifs" aria-label="Notifications">${ic('bell')}${unread()?`<span class="dot">${unread()}</span>`:''}</button>`,
  body:`<div class="fwrap">${clubStrip()}
  ${list.length?list.slice(0,2).map(p=>postCard(p)).join('')+peopleCarousel()+list.slice(2).map(p=>postCard(p)).join('')
    :`<div class="note"><div class="empty">${spot('green',110)}<b>You're all caught up</b><button class="btn sm primary" data-a="root" data-v="home">Explore clubs</button></div></div>`}</div>`,
  fab:`<button class="fab2" data-a="startPost" aria-label="New post">${ic('plus')}</button>`};
};
/* post page: club updates open as an article (cover, label, headline, byline with Follow); notes open large */
function commentList(p){return p.comments.map((m,i)=>{const hid=S.reported.has('C:'+p.id+':'+i);
  return `<div class="cmt">${av(m.who,32)}<div class="grow"><div class="nhd"><b>${esc(m.me?'You':m.who)}</b><span class="grow"></span>${!m.me&&!hid?`<button class="ib ghost" data-a="msgMenu" data-id="C:${p.id}" data-v="${i}" aria-label="Comment options">${ic('more')}</button>`:''}</div><p class="${hid?'meta':''}">${hid?'Reported · hidden for you':esc(m.text)}</p></div></div>`}).join('')}
SCR.post=({id})=>{const p=S.posts.find(x=>x.id===id),w=postWho(p),fol=w.c&&S.followed.has(w.c.id);
  const main=p.title&&w.c?`<article class="article">${cover(w.c,'acover',``,'',p.img)}<span class="epub">${cover(w.c,'',``,'width:22px;height:22px;border-radius:6px')}${esc(w.c.name)} · ${esc(p.type)}</span><h1>${esc(p.title)}</h1>
    <div class="byline"><button class="nava" ${w.go}>${w.pic(40)}</button><span class="grow"><b>${esc(w.name)}</b><span class="meta">${p.t} · ${readMin(p)} min read</span></span><button class="btn sm ${fol?'':'primary'}" data-a="follow" data-id="${w.c.id}">${fol?'Following':'Follow'}</button></div>
    ${postMedia(p.media)}<div class="abody">${esc(p.text).split(/(?<=\.)\s+(?=[A-Z0-9])/).reduce((a,s,i)=>{const k=Math.floor(i/2);(a[k]=a[k]||[]).push(s);return a},[]).map(x=>`<p>${x.join(' ')}</p>`).join('')}</div>
    ${likeBtns(p)}</article>`:postCard(p,true);
  return {top:`${backBtn}<h1>${p.title?esc(w.name):'Post'}</h1>${p.me||!p.title?'':`<button class="ib" data-a="postMenu" data-id="${p.id}" aria-label="Post options">${ic('more')}</button>`}`,
  body:`${main}<div class="stack" style="gap:0"><div class="sec" style="padding-bottom:4px"><b>Comments</b><span class="meta">${p.comments.length}</span></div>${p.comments.length?commentList(p):'<span class="meta" style="padding-top:8px">Be the first to reply.</span>'}</div>`,
  composer:`<input class="input" id="chat" placeholder="Add a comment" autocomplete="off" aria-label="Comment"><button class="btn primary" data-a="pcomment" data-id="${id}" aria-label="Send">${ic('send')}</button>`};
};

/* Explore: search sits behind an icon in the top bar; boards fold; events = this week, then what's coming */

/* Club page: one paragraph about the club, and joining sits right next to the name */
const lc=s=>/^[A-Z][a-z]/.test(s)&&!/^(Kaggle|Python|Solution|Robocon|Alcheringa|Techniche|Inter|Lightroom)\b/.test(s)?s[0].toLowerCase()+s.slice(1):s;
const andList=a=>a.length>1?a.slice(0,-1).join(', ')+' and '+a[a.length-1]:a[0];
function clubStory(id){const x=CX[id];return `${x.about} ${x.does[0]}, ${andList(x.does.slice(1).map(lc))}. Recent work includes ${andList(x.projects.map(p=>p[0]))}. We look for ${andList(x.looking.map(lc))}.`}
const insta=id=>'@iitg_'+cmail(id).split('@')[0].replace(/\./g,'');
function joinBtn(c){const app=S.apps[c.id];
  if(S.teamClubs.includes(c.id))return `<button class="btn sm" data-a="goTeam" data-id="${c.id}">${ic('lock')} Team</button>`;
  if(app)return `<button class="btn sm" data-go="activity">${ic('check')} ${app.type==='request'?'Requested':'Applied'}</button>`;
  return c.recruit.open?`<button class="btn sm primary" data-a="startApp" data-id="${c.id}">Apply</button>`:`<button class="btn sm primary" data-a="reqJoin" data-id="${c.id}">Request to join</button>`}
const clubHead=c=>`${cover(c,'hero',backFab)}<div class="chead"><span class="grow"><h2 class="h2">${esc(c.name)}</h2><span class="meta csub">${ic('users')}${c.members} members · about ${c.hours} a week</span>${c.recruit.open&&!S.apps[c.id]&&!S.teamClubs.includes(c.id)?`<span class="rline">${ic('clock')}Recruiting · apply by ${c.recruit.deadline}</span>`:''}</span>${joinBtn(c)}</div>`;
const clubPostsOf=id=>S.posts.filter(p=>p.club===id&&!S.hidden.has(p.id));
const clubSeg=(id,tab)=>`<div class="seg"><button class="${tab!=='posts'?'on':''}" data-a="clubTab" data-id="${id}" data-v="about">About</button><button class="${tab==='posts'?'on':''}" data-a="clubTab" data-id="${id}" data-v="posts">Posts${clubPostsOf(id).length?' · '+clubPostsOf(id).length:''}</button></div>`;
const clubFoot=id=>{const fol=S.followed.has(id);return `<button class="btn ${fol?'':'primary'}" data-a="follow" data-id="${id}">${fol?ic('check')+' Following':ic('heart')+' Follow for updates'}</button>`};
function clubLinks(c){const mem=S.teamClubs.includes(c.id);
  return `<div class="links">
  <button class="lrow" data-a="openInsta" data-id="${c.id}"><span class="ji">${ic('insta')}</span><span class="grow"><b>Instagram</b><span class="meta">${insta(c.id)}</span></span>${ic('chev')}</button>
  <button class="lrow" data-a="openWa" data-id="${c.id}"><span class="ji">${ic('wa')}</span><span class="grow"><b>WhatsApp group</b><span class="meta">Open to everyone</span></span>${ic('chev')}</button>
  <div class="lrow"><span class="ji">${ic('mail')}</span><span class="grow"><b>Email</b><span class="meta">${cmail(c.id)}</span></span></div></div>
  <button class="btn" data-a="askClub" data-id="${c.id}">${ic('chat')} Ask ${esc(c.name)} a question</button>`}
function clubPosts(id){const c=club(id),ps=clubPostsOf(id);
  return {bleed:true,body:`${clubHead(c)}${clubSeg(id,'posts')}
  ${ps.length?`<div class="nlist">${ps.map(p=>postCard(p)).join('')}</div>`
    :`<div class="empty">${spot('lamp',110)}<b>No posts yet</b><span class="meta">Follow ${esc(c.name)} to see their updates first.</span></div>`}`,
  foot:clubFoot(id)}}
SCR.club=({id,tab})=>{
  if(tab==='posts')return clubPosts(id);

  body:`${clubHead(c)}${clubSeg(id,'about')}

  ${evs.length?`<div class="stack"><div class="sec"><b>Upcoming</b>${evs.length>2?`<button data-a="homeTab" data-v="events" data-root="1">All events</button>`:''}</div>${evs.slice(0,2).map(miniEv).join('')}</div>`:''}
  ${clubLinks(c)}`,
  foot:clubFoot(id)};
};

/* Rooms: trending first, then people you know, then everything open. Each section folds. */

/* Plans calendar: a month view on top, today's events under it by default; tap a date to see that day; bell = reminder */
const TODAY='2026-10-20',MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'],
  MONF=['January','February','March','April','May','June','July','August','September','October','November','December'],
  DAYF=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'],pad2=n=>String(n).padStart(2,'0');
const evKey=e=>{const [,n,m]=e.day.split(' ');return `2026-${pad2(MON.indexOf(m)+1)}-${pad2(+n)}`};
const fmtKey=k=>{const [y,m,d]=k.split('-').map(Number);return `${DAYF[new Date(y,m-1,d).getDay()].slice(0,3)} ${d} ${MON[m-1]}`};
const mineEv=e=>(S.regs[e.id]&&S.regs[e.id].status!=='cancelled')||S.saved.has(e.id)||!!S.reminders[e.id];
function eventsByDay(){const by={};S.ev.filter(e=>!e.cancelled).forEach(e=>{const k=evKey(e);(by[k]=by[k]||[]).push(e)});return by}
function calendar(){const [y,mo]=S.calMonth.split('-').map(Number),lead=(new Date(y,mo-1,1).getDay()+6)%7,days=new Date(y,mo,0).getDate(),by=eventsByDay(),cells=[];
  for(let i=0;i<lead;i++)cells.push('<span></span>');
  for(let d=1;d<=days;d++){const k=`${y}-${pad2(mo)}-${pad2(d)}`,es=by[k]||[],sel=k===S.calSel;
    cells.push(`<button class="cday ${sel?'sel':''} ${k===TODAY?'today':''} ${k<TODAY?'past':''}" data-a="calDay" data-v="${k}" aria-pressed="${sel}" aria-label="${d} ${MONF[mo-1]}${k===TODAY?', today':''}${es.length?`, ${es.length} event${es.length>1?'s':''}`:''}">${d}${es.length?`<i class="${es.some(mineEv)?'mine':''}"></i>`:''}</button>`)}
  return `<div class="cal"><div class="calh"><button class="ib ghost" data-a="calMove" data-v="-1" aria-label="Previous month">${ic('back')}</button><b>${MONF[mo-1]} ${y}</b><button class="ib ghost" data-a="calMove" data-v="1" aria-label="Next month">${ic('chev')}</button></div>
  <div class="cgrid">${['M','T','W','T','F','S','S'].map(x=>`<span class="cdow" aria-hidden="true">${x}</span>`).join('')}${cells.join('')}</div></div>
  ${dayList(by)}`}
function dayList(by){const es=(by[S.calSel]||[]).sort((a,b)=>a.sort-b.sort),[y,m,d]=S.calSel.split('-').map(Number);
  const head=`<div class="sec"><b>${S.calSel===TODAY?'Today':DAYF[new Date(y,m-1,d).getDay()]}, ${d} ${MONF[m-1]}</b>${es.length?`<span class="meta">${es.length} event${es.length>1?'s':''}</span>`:''}</div>`;
  if(!es.length){const next=Object.keys(by).sort().find(k=>k>S.calSel);
    return `<div class="stack">${head}<div class="calempty"><span class="meta">No events on this day.</span>${next?`<button class="btn sm" data-a="calDay" data-v="${next}">Next: ${fmtKey(next)}</button>`:''}</div></div>`}
  return `<div class="stack">${head}<div class="links">${es.map(e=>{const r=S.reminders[e.id],st=S.regs[e.id]?.status==='confirmed'?'Going':S.saved.has(e.id)?'Saved':'';
    return `<div class="lrow calev"><button class="calbtn" data-go="event" data-id="${e.id}"><b>${esc(e.title)}</b><span class="meta">${e.time} · ${esc(e.venue)}${st?' · '+st:''}</span>${r?`<span class="rmeta">${ic('bell')}${r}</span>`:''}</button><button class="ib ${r?'on':'ghost'}" data-a="remindPick" data-id="${e.id}" aria-pressed="${!!r}" aria-label="${r?'Change reminder':'Set a reminder'} for ${esc(e.title)}">${ic('bell')}</button></div>`}).join('')}</div></div>`}
function remindSheet(sh){const e=ev(sh.id),cur=S.reminders[sh.id];
  return `<div class="sheetbg" data-a="closeSheet"><div class="sheet" data-stop="1"><b class="shtitle">Remind me</b><span class="meta">${esc(e.title)} · ${e.day}, ${e.time}</span>
  ${['1 hour before','Evening before','Morning of the event'].map(o=>`<button class="opt ${cur===o?'on':''}" data-a="setRemind" data-v="${o}">${ic('bell')}${o}</button>`).join('')}
  ${cur?`<button class="btn" data-a="setRemind" data-v="">Turn off reminder</button>`:''}</div></div>`}
const planSections=SCR.activity;

function applyDecision(p,st){p.status=st;if(st!=='live'){toast('Declined. The team is notified.');return}
  const c=club(p.club);
  if(p.kind==='venue'){const e=ev(p.ev);if(p.field==='Time'){e.time=p.after}else{e.prevVenue=e.venue;e.venue=p.after;e.changed=true}
    if(S.regs[e.id])notify({icon:'pin',col:c.c,title:'Event updated',text:`${e.title}: ${p.after}`,go:[p.field==='Time'?'event':'updates',{id:e.id}]})}
  else if(p.kind==='new'){const id='n'+(++S.seq),[dw,dn,mn]=(p.when.match(/^(\w{3}) (\d+) (\w{3})/)||[0,'Sat','7','Nov']).slice(1);
    S.ev.push({id,club:c.id,title:p.title,type:'Workshop',day:`${dw} ${dn} ${mn}`,time:(p.when.split('·')[1]||'5–7 PM').trim(),sort:1100+(+dn||7),venue:p.where,cap:30,taken:0,wl:0,deadline:'Day before, 6 PM',beginner:true,who:['All years'],bring:['Curiosity'],flow:['Intro','Hands-on','Wrap-up'],reg:'required',refp:'NW',msg:p.msg,sent:'Just now'})}
  else if(p.kind==='page'){c.short=p.after}
  else{c.recruit=p.title.startsWith('Open')?{open:true,deadline:p.deadline||'Fri 13 Nov',result:'Mon 16 Nov',steps:['Short form','Task','Chat']}:{open:false,next:'Jan 2027'}}
  toast('Published. Students see it now.')}

    else if(g.dataset.g==='task'){fresh();if(v==='member')S.asMember=true;root(v==='member'?'splash':v);toast('Fresh start')}
    else if(g.dataset.g==='jump'){if(SPECIAL[v])SPECIAL[v]();else if(g.dataset.id)at(['home'],[v,g.dataset.id]);else{S.searching=false;root(v)}}
    if(matchMedia('(max-width:880px)').matches)document.getElementById('phone').scrollIntoView({behavior:'smooth'});
    return}
  const t=e.target.closest('[data-a],[data-go]');if(!t||!document.getElementById('phone').contains(t))return;
  if(t.classList.contains('sheetbg')&&e.target.closest('[data-stop]'))return;
  if(t.dataset.go){go(t.dataset.go,{id:t.dataset.id});return}
  A[t.dataset.a]&&A[t.dataset.a](t);
});
/* mouse drag-to-scroll for every horizontal row (touch already swipes natively) */
let drag=null;
document.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;const r=e.target.closest('.hs,.chips');if(!r)return;drag={r,x:e.clientX,s:r.scrollLeft,moved:false}});
document.addEventListener('pointermove',e=>{if(!drag)return;const dx=e.clientX-drag.x;if(Math.abs(dx)>5){drag.moved=true;drag.r.classList.add('drag')}if(drag.moved)drag.r.scrollLeft=drag.s-dx});
document.addEventListener('pointerup',()=>{if(!drag)return;const d=drag;drag=null;d.r.classList.remove('drag');if(d.moved){const stop=ev=>{ev.stopPropagation();ev.preventDefault()};document.addEventListener('click',stop,{capture:true,once:true});setTimeout(()=>document.removeEventListener('click',stop,{capture:true}),0)}});
document.addEventListener('change',e=>{
  if(e.target.id!=='mfile'||!S.pd)return;S.pd.text=document.getElementById('pt1').value;S.pd.media=S.pd.media||[];
  [...e.target.files].slice(0,4-S.pd.media.length).forEach(f=>{if(/^(image|video)\//.test(f.type))S.pd.media.push({type:f.type.startsWith('video')?'video':'image',url:URL.createObjectURL(f)})});render()});
document.addEventListener('focusin',e=>{if(e.target.id==='q'&&!S.searching&&cur().s==='home'){S.searching=true;S.focusQ=true;render(true)}});
document.addEventListener('input',e=>{
  if(e.target.id==='q'){S.q=e.target.value;const r=document.getElementById('results');if(r)r.innerHTML=results()}
  if(e.target.id==='email')S.email=e.target.value;
  if(e.target.id==='otp'){if(S.otpSim){stopOtpSim();otpStatus('')}S.otp=e.target.value.replace(/\D/g,'').slice(0,6);e.target.value=S.otp;document.getElementById('otpv').innerHTML=otpBoxes()}
  if(e.target.id==='cin'){S.sheet.code=e.target.value.replace(/\D/g,'').slice(0,4);S.sheet.err='';e.target.value=S.sheet.code;document.getElementById('cinv').innerHTML=cinBoxes()}
  if(e.target.id==='pt1'){growCmp(e.target);const c=document.getElementById('pcount');if(c)c.textContent=e.target.value.length+'/280';const b=document.getElementById('pbtn');if(b)b.disabled=!(e.target.value.trim()||(S.pd.media||[]).length);document.getElementById('pte').hidden=true}
  if(e.target.id==='a1'){const x=document.getElementById('a1e');if(x)x.hidden=true}
});
document.addEventListener('keydown',e=>{
  if(e.key!=='Enter')return;
  if(e.target.classList&&e.target.classList.contains('embed')){go('post',{id:e.target.dataset.id});return}
  if(e.target.id==='chat'){const b=document.querySelector('[data-a="send"]'),c=document.querySelector('[data-a="comment"]'),pc=document.querySelector('[data-a="pcomment"]');b?A.send(b):c?A.comment(c):pc&&A.pcomment(pc)}
  if(e.target.id==='email')A.sendCode();
  if(e.target.id==='q'&&S.q.trim())addRecentQ(S.q);
  if(e.target.id==='otp')A.verify();
  if(e.target.id==='cin')A.doCheckin();
});
if(!FIRST)stack=[{s:'welcome',p:{}}];
render(true);
</script>
