<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FCF6E8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="CampusConnect">
<meta name="description" content="CampusConnect v1 prototype: club discovery and participation for IIT Guwahati students.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>CampusConnect Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* Layout: phone-sized app on the left, slim test guide on the right; stacks on narrow screens. Visual-first: colour covers carry identity, text stays short. */
:root{
  --page:#EFEBE3; --surface:#FFFFFF; --sunk:#F6F2EA; --ink:#121A17; --muted:#5E6B66; --line:#E9E3D8;
  --accent:#D9443A; --accent-ink:#FFFFFF; --accent-soft:#FDE8E4; --accent-text:#B8352C;
  --warm:#9A5B00; --warm-soft:#FFF0D6; --danger:#B42318; --danger-soft:#FDE8E6; --ok:#13703F; --ok-soft:#DFF3E6;
  --frame:#1D2622;
  --display:"Bricolage Grotesque","Segoe UI",system-ui,sans-serif;
  --body:"Figtree","Segoe UI",system-ui,sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --page:#0C110F; --surface:#121916; --sunk:#1A231F; --ink:#E8F0EC; --muted:#93A29C; --line:#25302C;
  --accent:#FF7A6E; --accent-ink:#2B0B08; --accent-soft:#3D1A16; --accent-text:#FF9F95;
  --warm:#F2B457; --warm-soft:#3A2A0F; --danger:#F2867B; --danger-soft:#3B1714; --ok:#6BD69A; --ok-soft:#123222;
  --frame:#000000; color-scheme:dark}}
:root[data-theme="dark"]{
  --page:#0C110F; --surface:#121916; --sunk:#1A231F; --ink:#E8F0EC; --muted:#93A29C; --line:#25302C;
  --accent:#FF7A6E; --accent-ink:#2B0B08; --accent-soft:#3D1A16; --accent-text:#FF9F95;
  --warm:#F2B457; --warm-soft:#3A2A0F; --danger:#F2867B; --danger-soft:#3B1714; --ok:#6BD69A; --ok-soft:#123222;
  --frame:#000000; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--page);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:left}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{display:grid;grid-template-columns:auto minmax(0,1fr);gap:40px;max-width:1080px;margin:0 auto;align-items:start}
@media (max-width:880px){.wrap{grid-template-columns:minmax(0,1fr);gap:24px}}

.phone{width:390px;height:800px;border:10px solid var(--frame);border-radius:44px;background:var(--surface);overflow:hidden;position:relative;display:flex;flex-direction:column;min-width:0}
@media (max-width:880px){.phone{width:100%;height:min(800px,calc(100svh - 48px));border-width:1px;border-color:var(--line);border-radius:20px}}
.sb{flex:none;display:flex;justify-content:space-between;padding:10px 26px 4px;font-size:12px;font-weight:600}
@media (max-width:880px){.sb{display:none}}
.top{flex:none;display:flex;align-items:center;gap:8px;padding:6px 12px 8px;min-height:52px}
.top h1{font-family:var(--display);font-size:18px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand{font-family:var(--display);font-weight:800;font-size:22px;letter-spacing:-.02em;flex:1;padding-left:4px}
.brand span{color:var(--accent)}
.ib{width:40px;height:40px;border-radius:14px;display:grid;place-items:center;position:relative;flex:none;background:var(--sunk)}
.ib .dot{position:absolute;top:4px;right:4px;min-width:16px;height:16px;padding:0 4px;border-radius:8px;background:var(--danger);color:#fff;font-size:10px;font-weight:700;display:grid;place-items:center}
.fab{position:absolute;top:12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.92);color:#121A17;display:grid;place-items:center;z-index:3}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;flex:none}
.scroll{flex:1;overflow-y:auto;overscroll-behavior:contain;padding:4px 16px 28px;display:flex;flex-direction:column;gap:22px}
.scroll.bleed{padding-top:0}
.scroll>*{flex-shrink:0}
.foot{flex:none;display:flex;gap:10px;padding:12px 16px;border-top:1px solid var(--line);background:var(--surface)}
.foot .btn{flex:1}
.nav{flex:none;display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);padding:8px 4px 10px;background:var(--surface)}
.nav button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--muted);position:relative}
.nav button.on{color:var(--accent-text)}
.nav button.on svg{stroke-width:2.4}
.nav .dot{position:absolute;top:0;left:calc(50% + 7px);width:8px;height:8px;border-radius:50%;background:var(--danger)}

.h2{font-family:var(--display);font-size:28px;font-weight:800;line-height:1.05;margin:0;text-wrap:balance;letter-spacing:-.02em}
.sec{display:flex;justify-content:space-between;align-items:baseline}
.sec b{font-family:var(--display);font-size:18px;font-weight:700}
.sec button{font-size:13px;font-weight:600;color:var(--accent-text)}
.meta{color:var(--muted);font-size:13px}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.center{display:flex;flex-direction:column;align-items:center;text-align:center;gap:10px}

.btn{display:inline-flex;justify-content:center;align-items:center;gap:6px;height:48px;padding:0 16px;border-radius:16px;font-weight:700;text-align:center;border:1px solid var(--line);background:var(--surface)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.warn{background:var(--warm-soft);color:var(--warm);border-color:transparent}
.btn.danger{background:var(--danger-soft);color:var(--danger);border-color:transparent}
.btn.sm{height:34px;padding:0 12px;border-radius:11px;font-size:13px}
.btn.icon{flex:0 0 48px;padding:0}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 14px;border-radius:18px;background:var(--sunk);font-size:13.5px;font-weight:600;white-space:nowrap}
.chip.on{background:var(--ink);color:var(--surface)}
.chip svg{width:16px;height:16px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips::-webkit-scrollbar,.hs::-webkit-scrollbar{display:none}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:999px;background:var(--sunk);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.warn{background:var(--warm-soft);color:var(--warm)}.pill.bad{background:var(--danger-soft);color:var(--danger)}.pill.acc{background:var(--accent-soft);color:var(--accent-text)}
.input{height:52px;border-radius:16px;border:1.5px solid var(--line);background:var(--sunk);padding:0 16px;font:inherit;font-size:16px;color:var(--ink);width:100%}
textarea.input{height:auto;min-height:92px;padding:12px 16px;resize:vertical}
.err{color:var(--danger);font-size:13px;font-weight:600}
.lbl{font-size:13px;font-weight:700}
.search{display:flex;align-items:center;gap:10px;height:50px;border-radius:16px;background:var(--sunk);padding:0 14px;color:var(--muted);flex:1;min-width:0}
.search input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:15.5px;color:var(--ink);outline:none;height:100%}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:14px;padding:4px}
.seg button{height:38px;border-radius:11px;text-align:center;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}

/* covers: each club owns a colour + illustration */
.cover{position:relative;overflow:hidden;background:var(--c);color:#fff;border-radius:18px;isolation:isolate;flex:none}
.cover::before{content:"";position:absolute;inset:0;z-index:-1;background:radial-gradient(circle at 12% 0%,rgba(255,255,255,.3),transparent 55%),radial-gradient(rgba(255,255,255,.16) 1.2px,transparent 1.4px) 0 0/13px 13px}
.cover .art{position:absolute;right:-8%;bottom:-16%;width:70%;max-width:220px;aspect-ratio:1;fill:none;stroke:#fff;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round;transform:rotate(-10deg);opacity:.92;z-index:-1}
/* illustrated covers: the club illustrations' own cream ground, fixed in both themes */
.cover.ill{background:var(--bgimg,none) 0 0/8000% no-repeat,#FCF6E8;color:#1E1E1C}
.cover.ill::before{display:none}
.cover.ill>img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;z-index:-1}
.cover.ill .art{inset:auto;left:50%;top:52%;right:auto;bottom:auto;width:min(48%,110px);transform:translate(-50%,-50%) rotate(-6deg);stroke:#1E1E1C;stroke-width:1.25;opacity:1;z-index:-1}
.cover.ill .blob{position:absolute;left:50%;top:50%;width:min(40%,92px);aspect-ratio:1;border-radius:50%;transform:translate(-22%,-62%);z-index:-2}
.cover.ill .dash{position:absolute;right:16%;top:16%;width:22px;height:22px;z-index:-1;fill:none;stroke:#1E1E1C;stroke-width:2;stroke-linecap:round}
.cover.hero{margin:0 -16px;border-radius:0 0 28px 28px;height:250px}
.spr{position:absolute;left:50%;top:50%;height:94%;aspect-ratio:1;transform:translate(-50%,-50%);background:url(img/objects.webp) var(--x) var(--y)/300% 200% no-repeat;z-index:-1}
.spot{aspect-ratio:1;border-radius:32px;background:url(img/objects.webp) var(--x) var(--y)/300% 200% no-repeat,#FCF6E8}
.scene{position:relative;display:block;width:100%;border-radius:22px;background:#FCF6E8;overflow:hidden;flex:none}
.scene img{display:block;width:100%;height:auto}
.scene .stxt{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:42%;color:#1E1E1C;font-family:var(--display);font-weight:800;font-size:21px;line-height:1.05;text-align:left}
.scene .onc{position:absolute;left:12px;bottom:12px;background:#F45B4F}
/* journey: stamps are perforated club roundels in the illustrations' palette */
.stamp{--s:84px;width:var(--s);height:var(--s);flex:none;border-radius:50%;padding:calc(var(--s)*.06);background:#FCF6E8;border:2.5px dashed var(--c);transform:rotate(var(--r));position:relative;display:block;box-shadow:0 0 0 calc(var(--s)*.03) #FCF6E8}
.stamp .sin{display:block;width:100%;height:100%;border-radius:50%;overflow:hidden;border:0;background:#FCF6E8}
.stamp img{width:100%;height:100%;object-fit:cover;transform:scale(1.18)}
.stamp.locked{border-color:#C9C2B3}
.stamp.locked img{filter:grayscale(1);opacity:.28}
.stamp .lk{position:absolute;inset:0;display:grid;place-items:center;color:#6E6859}
.stamp .lk svg{width:calc(var(--s)*.26);height:calc(var(--s)*.26)}
.jhero{display:flex;align-items:center;gap:8px;padding:16px;border-radius:22px;background:#FCF6E8;color:#1E1E1C}
.jhero .meta{color:#6E6859}
.jl{flex:1;display:flex;flex-direction:column;gap:2px;min-width:0}
.jl b{font-family:var(--display);font-size:28px;font-weight:800;line-height:1}
.jstack{display:flex}
.jstack .stamp{margin-left:-22px}.jstack .stamp:first-child{margin-left:0}
.trynext{display:flex;align-items:center;gap:12px;padding:12px;border-radius:18px;background:rgba(244,91,79,.1);width:100%}
.trynext b{font-size:15px}
.bprog{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bp{position:relative;display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:18px;background:var(--sunk);overflow:hidden;isolation:isolate;min-height:96px}
.bp img{position:absolute;right:-10px;bottom:-12px;width:58%;opacity:.35;filter:grayscale(1);z-index:-1}
.bp.on{background:#FCF6E8;color:#1E1E1C}
.bp.on img{opacity:1;filter:none}
.bp b{font-family:var(--display);font-size:16px;font-weight:800}
.bp>span:not(.bar):not(.tick){font-size:12px;font-weight:700;color:var(--muted)}
.bp.on>span:not(.bar):not(.tick){color:#6E6859}
.bp .bar{width:60%;height:6px;margin-top:auto}
.bp .tick{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:#F45B4F;color:#fff;display:grid;place-items:center}
.bp .tick svg{width:13px;height:13px;stroke-width:3}
.badge{flex:none;width:112px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:14px 8px 12px;border-radius:18px;background:var(--sunk);text-align:center;position:relative;overflow:hidden}
.badge .medal{width:56px;height:56px;border-radius:50%;display:grid;place-items:center;background:var(--line);color:var(--muted);border:2px dashed transparent}
.badge .medal svg{width:26px;height:26px}
.badge.on{background:#FCF6E8;color:#1E1E1C}
.badge.on .medal{background:#F45B4F;color:#fff;box-shadow:0 0 0 4px rgba(244,91,79,.18)}
.badge b{font-size:13.5px;margin-top:4px}
.badge span{font-size:11.5px;font-weight:700;color:var(--muted)}
.badge.on span{color:#6E6859}
.badge i{position:absolute;left:0;bottom:0;height:4px;background:#F45B4F}
.sgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px 8px}
.scell{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12px;font-weight:700;position:relative}
.scell em{position:absolute;top:0;right:12%;background:#F45B4F;color:#fff;font-style:normal;font-size:11px;padding:2px 6px;border-radius:999px}
.otp.c4{grid-template-columns:repeat(4,1fr);max-width:260px;margin:0 auto;width:100%}
@media (prefers-reduced-motion: no-preference){.stampin .stamp{animation:thunk .7s cubic-bezier(.2,1.4,.4,1) both}}
@keyframes thunk{0%{opacity:0;transform:scale(2.2) rotate(-25deg)}60%{opacity:1;transform:scale(.94) rotate(var(--r))}100%{transform:scale(1) rotate(var(--r))}}
/* event badges: medallion + ribbon; club tiers reward repeat visits */
.medal2{display:inline-flex;flex-direction:column;align-items:center;position:relative;width:var(--s);padding-bottom:calc(var(--s)*.12)}
.medal2 .rib{position:absolute;bottom:0;left:50%;transform:translateX(-50%);max-width:calc(var(--s)*1.25);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:var(--c);color:#fff;font-size:max(10px,calc(var(--s)*.12));font-weight:800;padding:calc(var(--s)*.035) calc(var(--s)*.1);border-radius:6px;box-shadow:0 2px 6px rgba(80,50,20,.18);letter-spacing:.01em}
.grab{flex:none;width:104px;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ctier{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border-radius:18px;background:var(--sunk)}
.ctier .grow{gap:5px}.ctier .bar{height:6px;width:100%}
.tierpill{display:inline-flex;align-items:center;gap:4px;background:var(--t);color:#fff;font-size:11.5px;font-weight:800;padding:3px 9px;border-radius:999px}
.tierpill svg{width:12px;height:12px}
.showcase{display:flex;justify-content:space-around;gap:8px;padding:16px 8px;border-radius:20px;background:#FCF6E8}
.scell em svg{width:11px;height:11px}
.stampin .medal2 .rib{animation:none}
/* onboarding */
.sb.cream{background:#FCF6E8;color:#1E1E1C}
.scroll.bare{padding:0;gap:0;background:#FCF6E8;color:#1E1E1C}
.splash{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.splash img{width:100%;max-width:330px;height:auto}
.splash .logo{font-family:var(--display);font-weight:800;font-size:38px;letter-spacing:-.03em;line-height:1}
.splash .logo span{color:#F45B4F}
.splash p{font-size:15px;font-weight:600;color:#5E5A50}
.splash .dots{display:flex;gap:6px;margin-top:18px}
.splash .dots i{width:8px;height:8px;border-radius:50%;background:#F45B4F}
@media (prefers-reduced-motion: no-preference){
 .float{animation:floatIn .9s cubic-bezier(.2,.8,.2,1) both,bob 3s ease-in-out .9s infinite}
 .splash .logo,.splash p{animation:rise .7s .35s both}
 .splash .dots i{animation:blink 1s infinite}.splash .dots i:nth-child(2){animation-delay:.15s}.splash .dots i:nth-child(3){animation-delay:.3s}
 .iart img{animation:floatIn .6s both}}
@keyframes floatIn{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes blink{50%{opacity:.25}}
.intro{flex:1;display:flex;flex-direction:column;position:relative}
.intro .skip{position:absolute;top:8px;right:16px;font-weight:700;font-size:14px;padding:8px;color:#1E1E1C;z-index:2}
.iart{flex:1;display:grid;place-items:center;padding:40px 16px 0;min-height:0}
.iart img{width:100%;max-height:100%;object-fit:contain}
.itext{background:var(--surface);color:var(--ink);border-radius:28px 28px 0 0;padding:22px 20px 20px;display:flex;flex-direction:column;gap:10px}
.itext h2{font-family:var(--display);font-size:30px;font-weight:800;margin:0;letter-spacing:-.02em;line-height:1.05}
.itext p{color:var(--muted);font-size:15px;margin-bottom:8px}
.idots{display:flex;gap:6px}
.idots button{width:8px;height:8px;border-radius:4px;background:var(--line);transition:width .2s}
.idots button.on{width:26px;background:#F45B4F}
.prog{flex:1;display:flex;align-items:center;gap:5px;padding-right:6px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:#F45B4F}
.prog span{font-size:12px;font-weight:700;color:var(--muted);margin-left:4px}
.rcard{position:relative;display:grid;grid-template-columns:1fr;min-height:168px;border-radius:22px;background:#FCF6E8;overflow:hidden;padding:16px;color:#1E1E1C;isolation:isolate;text-align:left;width:100%}
.rcard img{position:absolute;right:-12px;bottom:-14px;width:52%;height:auto;z-index:-1}
.rcard .rt{display:flex;flex-direction:column;gap:4px;max-width:58%}
.rcard .rt b{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.05}
.rcard .rt span{font-size:13.5px;font-weight:600;color:#5E5A50}
.rcard .rtags{display:flex;flex-direction:column;gap:6px;align-self:end;margin-top:12px}
.rcard .rtags span{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;background:rgba(255,255,255,.85);color:#1E1E1C;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.rcard .rtags svg{width:13px;height:13px}
.rchk{position:absolute;top:12px;right:12px;width:28px;height:28px;border-radius:50%;border:2px solid #D9CFBC;display:grid;place-items:center;background:#fff;color:transparent}
.rcard.on{box-shadow:0 0 0 3px #F45B4F;border-color:#F45B4F}
.rcard.on .rchk{background:#F45B4F;border-color:#F45B4F;color:#fff}
.rchk svg{width:16px;height:16px;stroke-width:3}
/* team space */
.tmhead{display:flex;flex-direction:column;gap:8px}
.tmhead .cover{height:150px}
.tmhead b{font-family:var(--display);font-size:24px;font-weight:800;display:block}
.ktiles{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kt{display:flex;align-items:center;gap:10px;padding:12px;border-radius:16px;background:var(--sunk);font-weight:700;font-size:14px;border:2px solid transparent}
.kt.on{border-color:#F45B4F;background:var(--surface)}
.ji{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(244,91,79,.12);color:#D2453B;flex:none}
.ji.big{width:52px;height:52px;border-radius:16px}
.prow{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;border:1.5px solid var(--line);width:100%}
.prow .tmeta .av{border:0;margin:0;font-size:9px}
.htitle{display:flex;flex-direction:column;gap:8px;margin-top:-6px}
.thead{padding:12px 16px 14px;display:flex;flex-direction:column;gap:2px}
.thead b{font-family:var(--display);font-size:20px;font-weight:800;line-height:1.1}
.onc{display:inline-flex;align-items:center;gap:5px;background:rgba(0,0,0,.32);color:#fff;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px}
.onc i{width:7px;height:7px;border-radius:50%;background:#fff}
.onc.ok i{background:#5BE38E}.onc.warn i{background:#FFC24B}.onc.bad i{background:#FF8A80}
.dbadge{position:absolute;top:10px;left:10px;background:#fff;color:#1E1E1C;box-shadow:0 2px 8px rgba(80,50,20,.12);border-radius:12px;padding:5px 9px 4px;text-align:center;line-height:1;font-family:var(--display)}
.dbadge b{display:block;font-size:20px;font-weight:800}
.dbadge small{font-size:10px;font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.hs{display:flex;gap:12px;overflow-x:auto;margin:0 -16px;padding:2px 16px;scrollbar-width:none;scroll-snap-type:x mandatory}
.poster{flex:none;width:210px;display:flex;flex-direction:column;gap:6px;scroll-snap-align:start}
.poster .cover{height:170px}
.poster .onc{position:absolute;left:10px;bottom:10px}
.tname{font-weight:700;font-size:15px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.tmeta{color:var(--muted);font-size:12.5px;display:flex;align-items:center;gap:4px}
.tmeta svg{width:14px;height:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px 12px}
.tile{display:flex;flex-direction:column;gap:6px;min-width:0}
.tile .cover{height:140px}
.tile .tag{position:absolute;top:8px;left:8px}
.erow{display:flex;gap:12px;align-items:center;width:100%}
.thumb{width:76px;height:76px;border-radius:18px}
.grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
/* home search: full-height field with the illustrations' black outline */
.hsearch{flex:1 0 auto;display:flex;align-items:center;gap:6px;height:58px;padding:0 6px 0 16px;border:0;border-radius:20px;background:var(--sunk);min-width:0;transition:box-shadow .15s}
.hsearch:focus-within{box-shadow:0 0 0 2px #F45B4F}
.top .hsearch{height:50px;flex:1 1 auto}
.hsearch label{flex:1;display:flex;align-items:center;gap:10px;min-width:0;height:100%;color:var(--ink)}
.hsearch input{flex:1;min-width:0;border:0;background:transparent;font:inherit;font-size:16px;color:var(--ink);outline:none;height:100%}
.hsearch input::placeholder{color:var(--muted)}
.hf{width:44px;height:44px;border-radius:14px;background:#F45B4F;color:#fff;display:grid;place-items:center;position:relative;flex:none}
.top .hf{width:38px;height:38px}
.hf .dot{position:absolute;top:-4px;right:-4px;min-width:18px;height:18px;border-radius:9px;background:var(--ink);color:var(--surface);font-size:10px;font-weight:700;display:grid;place-items:center}
/* board cards: cream, black outline, illustration peeking from the corner */
.bgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.bcard{position:relative;height:124px;border-radius:20px;background:#FCF6E8;overflow:hidden;padding:12px;color:#1E1E1C;display:flex;flex-direction:column;justify-content:space-between;isolation:isolate}
.bcard img{position:absolute;right:-18px;bottom:-16px;width:68%;height:auto;z-index:-1}
.bcard b{font-family:var(--display);font-size:18px;font-weight:800;line-height:1}
.bcard span{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;background:rgba(255,255,255,.85);color:#1E1E1C;border-radius:999px;padding:4px 9px;align-self:flex-start}
.bcard span svg{width:13px;height:13px}
.bcard:active{transform:translateY(1px)}
/* boards as one swipeable row of illustrated circles */
.brow{gap:14px;scroll-snap-type:x proximity;padding-top:4px;padding-bottom:4px;cursor:grab}
.brow.drag{cursor:grabbing;scroll-snap-type:none}
.bcirc{flex:none;width:84px;display:flex;flex-direction:column;align-items:center;gap:3px;text-align:center;scroll-snap-align:start;user-select:none}
.bcirc .cc{width:80px;height:80px;border-radius:50%;background:#FCF6E8;overflow:hidden;display:grid;place-items:center;box-shadow:0 2px 10px rgba(80,50,20,.10);transition:transform .15s}
.bcirc .cc img{width:118%;height:118%;object-fit:cover;object-position:center 30%;pointer-events:none}
.bcirc .cc.all{background:var(--accent-soft);color:var(--accent-text)}
.bcirc .cc.all svg{width:26px;height:26px}
.bcirc:hover .cc{transform:translateY(-2px)}
.bcirc b{font-size:13.5px;margin-top:5px}
.bcirc span:last-child{font-size:11.5px;font-weight:600;color:var(--muted)}
.bub{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;color:#fff;position:relative}
.bub svg{width:28px;height:28px}
.bub.on{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}

/* facts and tiles */
.facts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fact{background:var(--sunk);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;min-width:0}
.fact svg{width:22px;height:22px;color:var(--accent-text)}
.fact b{font-size:15px;line-height:1.2}
.fact span{font-size:12px;color:var(--muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.stat{background:var(--sunk);border-radius:16px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center}
.stat svg{width:22px;height:22px;color:var(--accent-text)}
.stat b{font-family:var(--display);font-size:18px;font-weight:800;line-height:1}
.stat span{font-size:11.5px;color:var(--muted)}
.join2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.jt{border-radius:18px;padding:14px;display:flex;flex-direction:column;gap:8px;border:1.5px solid var(--line);min-width:0}
.jt .ji{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent-text)}
.jt b{font-size:15px}
.jt span{font-size:12.5px;color:var(--muted)}
.jt.hot{border-color:var(--warm);background:var(--warm-soft)}
.jt.hot .ji{background:var(--warm);color:#fff}
.icchips{display:flex;flex-wrap:wrap;gap:8px}
.icchips span{display:inline-flex;align-items:center;gap:6px;background:var(--sunk);border-radius:12px;padding:8px 12px;font-size:13.5px;font-weight:600}
.icchips svg{width:16px;height:16px;color:var(--accent-text)}
.seats{display:grid;grid-template-columns:repeat(10,1fr);gap:5px}
.seats i{aspect-ratio:1;border-radius:4px 4px 2px 2px;background:var(--line)}
.seats i.t{background:var(--c)}
.seats i.me{background:var(--ink)}
.big{font-family:var(--display);font-size:34px;font-weight:800;line-height:1}
.bar{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--c)}
.card{background:var(--sunk);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:12px}
.banner{display:flex;gap:10px;padding:12px 14px;border-radius:16px;align-items:center;font-weight:700;font-size:14px;width:100%}
.banner.warn{background:var(--warm-soft);color:var(--warm)}.banner.bad{background:var(--danger-soft);color:var(--danger)}.banner.acc{background:var(--accent-soft);color:var(--accent-text)}
.banner .grow span{font-weight:500;font-size:13px}
.steps{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.step{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;font-size:12.5px;font-weight:600;position:relative}
.step i{width:34px;height:34px;border-radius:50%;background:var(--sunk);display:grid;place-items:center;font-style:normal;font-family:var(--display);font-weight:800;color:var(--muted);z-index:1}
.step.done i{background:var(--accent);color:var(--accent-ink)}
.step.now i{background:var(--accent-soft);color:var(--accent-text);box-shadow:0 0 0 2px var(--accent)}
.step:not(:last-child)::after{content:"";position:absolute;top:17px;left:50%;width:100%;height:2px;background:var(--line)}
.avs{display:flex}
.av{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:12px;font-weight:700;border:2px solid var(--surface);margin-left:-8px;flex:none}
.avs .av:first-child{margin-left:0}
.li{display:flex;align-items:center;gap:12px;width:100%;padding:4px 0}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:28px 12px}
.empty b{font-family:var(--display);font-size:20px}
.cluster{display:flex;justify-content:center}
.cluster .bub{width:64px;height:64px;margin-left:-14px;border:3px solid var(--surface)}
.cluster .bub:first-child{margin-left:0}
.cluster .bub:nth-child(even){transform:translateY(-10px)}

/* ticket */
.ticket{border-radius:22px;overflow:hidden;background:var(--surface);border:1.5px solid var(--line);position:relative}
.ticket .cover{border-radius:0;height:150px}
.tbody{padding:4px 16px 16px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
.ref{font-family:var(--mono);font-weight:700;font-size:22px;letter-spacing:.06em}
.qr{width:96px;height:96px;padding:6px;background:#fff;border-radius:10px}
.qr svg{display:block;width:100%;height:100%}
.okbig{width:76px;height:76px;border-radius:50%;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center}
.okbig svg{width:38px;height:38px;stroke-width:2.6}

/* interests */
.igrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.it{border-radius:18px;background:var(--sunk);padding:14px 8px 12px;display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12.5px;font-weight:700;text-align:center;position:relative;border:2px solid transparent}
.it .cover{width:100%;height:78px;border-radius:14px}
.it{padding:6px 6px 10px}
.it.on{border-color:var(--c);background:var(--surface)}
.it .tick{position:absolute;top:6px;right:6px;width:20px;height:20px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center}
.it .tick svg{width:13px;height:13px;stroke-width:3}

/* chat */
.msgs{display:flex;flex-direction:column;gap:12px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.msg .av{margin:0;width:30px;height:30px;font-size:11px;border:0}
.mb{display:flex;flex-direction:column;gap:3px;min-width:0}
.msg.me .mb{align-items:flex-end}
.who{font-size:11.5px;color:var(--muted);font-weight:600;display:flex;gap:6px;align-items:center}
.bubble{padding:9px 12px;border-radius:18px 18px 18px 6px;background:var(--sunk);font-size:14px;display:flex;gap:4px;align-items:flex-start}
.msg.me .bubble{background:var(--accent);color:var(--accent-ink);border-radius:18px 18px 6px 18px}
.bubble .more{opacity:.55}.bubble .more svg{width:16px;height:16px}
.msg.hidden .bubble{background:transparent;border:1.5px dashed var(--line);color:var(--muted);font-style:italic}
.pinned{display:flex;gap:10px;padding:10px 12px;border-radius:14px;background:var(--accent-soft);color:var(--accent-text);font-size:13.5px;align-items:center}
.composer{flex:none;display:flex;gap:8px;padding:10px 12px;border-top:1px solid var(--line)}
.composer .input{height:46px;border-radius:23px}
.composer .btn{width:46px;height:46px;padding:0;border-radius:50%}
.rules{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.rule{background:var(--sunk);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:6px;font-size:13px;font-weight:600}
.rule svg{width:22px;height:22px;color:var(--accent-text)}

.toast{position:absolute;left:16px;right:16px;bottom:86px;background:var(--ink);color:var(--surface);padding:12px 14px;border-radius:14px;font-size:14px;font-weight:600;opacity:0;transform:translateY(8px);transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:none}
.sheetbg{position:absolute;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-end;z-index:8}
.sheet{background:var(--surface);width:100%;border-radius:24px 24px 0 0;padding:20px 16px;display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;padding:13px 14px;border-radius:14px;background:var(--sunk);font-weight:600;width:100%;border:2px solid transparent}
.opt.on{border-color:var(--accent);background:var(--accent-soft)}
.sw{margin-left:auto;width:42px;height:26px;border-radius:13px;background:var(--line);position:relative;flex:none;transition:.15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:.15s}
.sw.on{background:var(--accent)}.sw.on::after{left:19px}
.toggles{display:flex;flex-direction:column;gap:8px}
.tg{display:flex;align-items:center;gap:12px;padding:12px 14px;border-radius:14px;background:var(--sunk);font-weight:600;font-size:14px;width:100%}
.tg svg{color:var(--accent-text)}
.otp{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.otp span{height:58px;border-radius:14px;background:var(--sunk);display:grid;place-items:center;font-family:var(--mono);font-size:24px;font-weight:700;border:2px solid transparent}
.otp span.f{border-color:var(--accent)}
.otpwrap{position:relative}
.otpwrap input{position:absolute;inset:0;opacity:0;width:100%;height:100%;font-size:16px}

/* guide */
.guide{display:flex;flex-direction:column;gap:18px;min-width:0;max-width:520px}
.guide h2{font-family:var(--display);font-size:30px;font-weight:800;line-height:1.05;margin:0;letter-spacing:-.02em}
.guide .tag{font-family:var(--mono);font-size:12px;color:var(--accent-text);letter-spacing:.04em}
.gcard{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;display:flex;flex-direction:column;gap:10px}
.gcard h3{margin:0;font-size:14px;font-weight:700}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.task:first-of-type{border-top:0}
.task .n{font-family:var(--mono);font-size:12px;color:var(--muted)}
.sim{display:flex;flex-wrap:wrap;gap:8px}
.jump{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:2px 12px}
.jump h4{grid-column:1/-1;margin:8px 0 2px;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.jump button{font-size:13.5px;padding:3px 0}
.jump button.cur{color:var(--accent-text);font-weight:700}
.jump button:hover{text-decoration:underline}
.status{font-size:13px;color:var(--muted)}
.status b{color:var(--ink)}
@media (prefers-reduced-motion: reduce){.toast,.sw,.sw::after{transition:none}}
</style>

  const b=BLOBS[CLUBS.indexOf(c)%BLOBS.length];

function status(e){
  const m=S.regs[e.id];
  if(e.cancelled)return['bad','Cancelled'];
  if(S.attended.has(e.id))return['ok','Attended'];
  if(m){if(m.status==='confirmed')return['ok','Going'];if(m.status==='waitlisted')return['warn','Waitlist #'+m.pos];if(m.status==='offer')return['warn','Seat offered'];}

}

  return `<button class="poster" data-go="event" data-id="${e.id}">${evCover(e,'',`<span class="dbadge"><b>${d.num}</b><small>${d.mon}</small></span><span class="onc ${k}"><i></i>${t}</span>`)}
  <span class="tname">${esc(e.title)}</span><span class="tmeta">${esc(c.name)} · ${d.dow} ${e.time}</span></button>`}
function erow(e,extra=''){const c=ec(e),d=dp(e),[k,t]=status(e);
  return `<button class="erow" data-go="event" data-id="${e.id}">${evCover(e,'thumb')}
  <span class="grow"><span class="tname" style="-webkit-line-clamp:1">${esc(e.title)}</span><span class="tmeta">${ic('cal')}<b style="color:var(--ink)">${d.dow} ${d.num} ${d.mon}</b> · ${e.time}</span><span class="tmeta">${ic('pin')}${esc(e.venue)}</span><span class="row" style="margin-top:2px"><span class="pill ${k}">${t}</span>${extra}</span></span></button>`}
function tile(c){const nx=clubEvents(c.id).find(e=>!e.cancelled);
  return `<button class="tile" data-go="club" data-id="${c.id}">${cover(c,'',`${S.followed.has(c.id)?`<span class="onc ok tag"><i></i>Following</span>`:c.recruit.open?`<span class="onc warn tag"><i></i>Recruiting</span>`:''}`)}
  <span class="tname" style="-webkit-line-clamp:1">${esc(c.name)}</span><span class="tmeta">${ic('clock')}${c.hours}/wk${nx?` · ${ic('cal')}${dp(nx).dow}`:''}</span></button>`}
const backFab=`<button class="fab" style="left:12px" data-a="back" aria-label="Back">${ic('back')}</button>`;
const backBtn=`<button class="ib" data-a="back" aria-label="Back">${ic('back')}</button>`;
const tg=(icon,label,on,act)=>`<button class="tg" data-a="${act}">${ic(icon)}<span>${label}</span><span class="sw ${on?'on':''}"></span></button>`;
function qr(seed){let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;const n=21;let r='';
  const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#111"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#111"/>`;
  for(let y=0;y<n;y++)for(let x=0;x<n;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;h=(h*1103515245+12345)>>>0;if((h>>16)&1)r+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#111"/>`}
  return `<div class="qr"><svg viewBox="0 0 21 21" shape-rendering="crispEdges">${r}${fin(0,0)}${fin(14,0)}${fin(0,14)}</svg></div>`}
const cluster=(ms)=>`<div class="cluster">${ms.map(([m,c])=>`<span class="bub" style="background:${c}">${mo(m)}</span>`).join('')}</div>`;

const SCR={};
function matchClub(c){const q=S.q.trim().toLowerCase(),f=S.f;
  if(q&&![c.name,c.alt||'',c.board,c.short,...c.tags].join(' ').toLowerCase().includes(q))return false;
  if(f.board&&c.board!==f.board)return false;if(f.beginner&&!c.beginner)return false;if(f.time!=='Any'&&c.hk!==f.time)return false;return true}
function matchEvent(e){const q=S.q.trim().toLowerCase(),f=S.f,c=ec(e);
  if(q&&![e.title,c.name,e.type,...c.tags].join(' ').toLowerCase().includes(q))return false;
  if(f.board&&c.board!==f.board)return false;if(f.beginner&&!e.beginner)return false;if(f.time!=='Any'&&c.hk!==f.time)return false;return !e.cancelled}
const fCount=()=>(S.f.board?1:0)+(S.f.beginner?1:0)+(S.f.time!=='Any'?1:0);
function recommend(){return CLUBS.map(c=>({c,s:c.tags.filter(t=>S.interests.has(t)).length})).filter(x=>x.s).sort((a,b)=>b.s-a.s).map(x=>x.c)}
function results(){
  const quick=`<div class="chips"><button class="chip ${fCount()?'on':''}" data-go="filters">${ic('filter')}Filters${fCount()?' · '+fCount():''}</button><button class="chip ${S.f.beginner?'on':''}" data-a="fBeg">${ic('smile')}Beginner</button>${BOARDS.map(([b,m])=>`<button class="chip ${S.f.board===b?'on':''}" data-a="fBoard" data-v="${b}">${mo(m)}${b}</button>`).join('')}</div>`;
  if(!S.q.trim()&&!fCount()) return quick+`<div class="stack"><div class="sec"><b>Try</b></div><div class="igrid">${INTERESTS.slice(0,9).map(([l,t,m,col],i)=>`<button class="it" style="--c:${col}" data-a="suggest" data-v="${l==='AI & ML'?'ml':l}">${itc(t,m,i)}${l}</button>`).join('')}</div></div>`;
  const cl=CLUBS.filter(matchClub),evs=S.ev.filter(matchEvent).sort((a,b)=>a.sort-b.sort);
  if(!cl.length&&!evs.length) return quick+`<div class="empty">${spot('map')}<b>Nothing found</b><div class="row" style="justify-content:center">${fCount()?'<button class="btn sm primary" data-a="fReset">Clear filters</button>':''}<button class="btn sm" data-a="exitSearch">Browse all</button></div></div>`;
  return quick+`${cl.length?`<div class="stack"><div class="sec"><b>Clubs</b><span class="meta">${cl.length}</span></div><div class="grid2">${cl.map(tile).join('')}</div></div>`:''}
  ${evs.length?`<div class="stack"><div class="sec"><b>Events</b><span class="meta">${evs.length}</span></div><div class="stack" style="gap:14px">${evs.map(e=>erow(e)).join('')}</div></div>`:''}`;
}

  if(S.searching) return {nav:'home',top:`${sb}<button class="link" style="padding:0 4px;font-weight:700" data-a="exitSearch">Cancel</button>`,body:`<div id="results" class="stack" style="gap:22px">${results()}</div>`};

SCR.event=({id})=>{
  const e=ev(id),c=ec(e),m=S.regs[id],l=left(e),saved=S.saved.has(id),d=dp(e);
  let foot,reg='';
  if(e.reg==='required'){
    const mine=m&&m.status==='confirmed';
    reg=e.cap<=40?`<div class="card" style="--c:${c.c}"><div class="sec"><span><span class="big">${l}</span> <span class="meta">seats left of ${e.cap}</span></span>${e.wl?`<span class="pill warn">${e.wl} waiting</span>`:''}</div>
      <div class="seats">${Array.from({length:e.cap},(_,i)=>`<i class="${i<e.taken?(mine&&i===e.taken-1?'me':'t'):''}"></i>`).join('')}</div><span class="meta">${ic('clock','')} Closes ${e.deadline}</span></div>`
    :`<div class="card" style="--c:${c.c}"><div class="sec"><span><span class="big">${l}</span> <span class="meta">seats left of ${e.cap}</span></span></div><div class="bar"><i style="width:${Math.round(e.taken/e.cap*100)}%"></i></div><span class="meta">Closes ${e.deadline}</span></div>`;
  }
  const sv=`<button class="btn icon" data-a="save" data-id="${id}" aria-label="${saved?'Saved':'Save'}" style="${saved?'color:var(--accent-text);border-color:var(--accent)':''}">${ic('bookmark')}</button>`;
  if(e.cancelled) foot=`<button class="btn primary" data-a="root" data-v="home">Find other events</button>`;
  else if(S.attended.has(id)) foot=`<button class="btn primary" data-go="stamped" data-id="${id}">${ic('star')} Badge earned</button>`;
  else if(m&&m.status==='confirmed') foot=`<button class="btn" data-go="pass" data-id="${id}">${ic('check')} Going</button><button class="btn primary" data-a="checkin" data-id="${id}">${ic('pin')} I'm here</button>`;

  else if(m&&m.status==='offer') foot=`<button class="btn primary" data-go="offer" data-id="${id}">Claim your seat</button>`;
  else if(e.reg==='none') foot=`<button class="btn ${saved?'':'primary'}" data-a="save" data-id="${id}">${ic('bell')} ${saved?'Reminder on':'Remind me'}</button>`;
  else if(e.reg==='apply') foot=`${sv}<button class="btn primary" data-go="membership" data-id="${e.club}">Audition</button>`;
  else if(l<=0) foot=`${sv}<button class="btn warn" data-go="full" data-id="${id}">Join waitlist</button>`;

  body:`${hero(c,`<span class="pill acc">${e.type}</span>${e.beginner?'<span class="pill ok">Beginner friendly</span>':''}`,esc(e.title),`<span class="dbadge" style="top:12px;left:auto;right:12px"><b>${d.num}</b><small>${d.mon}</small></span>`,e.img)}
  ${e.cancelled?`<div class="banner bad">${ic('alert')}<span class="grow">Cancelled by organizer<span>${esc(e.reason)}</span></span></div>`:''}
  ${e.changed&&!e.cancelled?`<button class="banner warn" data-go="updates" data-id="${id}">${ic('pin')}<span class="grow">New meeting point<span>${esc(e.venue)}</span></span>${ic('chev')}</button>`:''}
  <button class="li" data-go="club" data-id="${c.id}">${cover(c,'',``,'width:40px;height:40px;border-radius:12px')}<span class="grow"><b>${esc(c.name)}</b><span class="meta">Host</span></span>${ic('chev')}</button>

  ${e.reg!=='apply'&&!e.cancelled?`<div class="card" style="flex-direction:row;align-items:center;gap:14px">${medal(evBadge(e),S.attended.has(id),72)}<span class="grow"><b>${S.attended.has(id)?'Badge earned':'Earn this badge'}</b><span class="meta">${S.attended.has(id)?'It’s in your journey':'Check in at the event with today’s code'}</span></span></div>`:''}
  <div class="stack"><div class="sec"><b>Good to know</b></div><div class="icchips">${e.who.map(w=>`<span>${ic('users')}${esc(w)}</span>`).join('')}${e.bring.map(b=>`<span>${ic('bag')}${esc(b)}</span>`).join('')}</div></div>
